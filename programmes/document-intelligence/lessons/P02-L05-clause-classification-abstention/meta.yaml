    kind: synthetic
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    note: >-
      6000 clauses (1800 train, 600 calibration, 600 test, 3000 next quarter) drafted in
      section 1 by build_corpus() from one random.Random seed (20260923): stock sentences per
      clause type with slots for parties, jurisdictions, caps and notice periods; hybrid
      clauses that borrow the confusable neighbour's sentences; OCR-style character smudges;
