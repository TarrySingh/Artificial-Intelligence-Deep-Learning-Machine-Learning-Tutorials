id: P02-L05-clause-classification-abstention
title: Contract clause classification and calibrated abstention — a classifier that says "I don't know"
  at a rate you chose and priced
track: P02
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
objectives:
- Implement a bag-of-subwords featuriser (every repeat counted, log-damped, each row scaled to unit length)
  over a byte-pair-encoding vocabulary fitted with tokenizers on the training split only, and verify that
  the vocabulary is byte-identical across runs and across Python 3.11 and 3.12
- Implement multinomial logistic regression in numpy — a stable softmax, the cross-entropy gradient and
  full-batch gradient descent with a stated stopping rule
- Measure per-clause precision, recall and F1 with abstentions counted as false negatives, and the recall
  that abstaining costs each clause type
- Implement temperature scaling and the expected calibration error on a calibration split, and measure
  what calibration changes (confidence, ECE, the meaning of a threshold) and what it cannot (accuracy)
- Choose an abstention threshold from the coverage/accuracy curve, explain why it must be fitted away
  from the reported split, and price the abstention rate it implies through module 1's review queue
before_you_start:
  assumed:
  - write numpy code with matrix products, axis reductions and broadcasting (X @ W, sum(axis=1, keepdims=True))
  - explain what a gradient is and take one gradient-descent step by hand on a one-variable function
  - say what a train, validation and test split are each for, and why a threshold is not fitted on the
    test split
  resources:
  - title: 'Speech and Language Processing, chapter: Logistic Regression and Text Classification'
    by: Jurafsky and Martin (Stanford; free drafts)
    url: https://web.stanford.edu/~jurafsky/slp3/4.pdf
    kind: free
    why: 'sections 4.5, 4.7 and 4.8: the cross-entropy loss, the softmax and the multinomial gradient,
      the maths of Exercises 2 and 3'
  - title: 'CS231n: Linear Classification, softmax classifier section'
    by: Stanford CS231n course notes
    url: https://cs231n.github.io/linear-classify/
    kind: free
    why: scores to probabilities with the softmax and cross-entropy, and the numerical-stability trick
      of subtracting the max that a stable softmax needs
  - title: On Calibration of Modern Neural Networks
    by: Guo, Pleiss, Sun and Weinberger (ICML 2017; arXiv)
    url: https://arxiv.org/abs/1706.04599
    kind: free
    why: 'reliability diagrams, the expected calibration error and temperature scaling: the calibration
      of Exercise 5, and what it leaves unchanged'
  - title: Selective Classification for Deep Neural Networks
    by: Geifman and El-Yaniv (NeurIPS 2017; arXiv)
    url: https://arxiv.org/abs/1705.08500
    kind: free
    why: defines a classifier that may abstain, and the coverage and risk trade-off behind the coverage/accuracy
      curve and threshold choice
datasets:
- name: synthetic contract clause corpus, six clause types, four splits
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: '6000 clauses (1800 train, 600 calibration, 600 test, 3000 next quarter) drafted in section 1
    by build_corpus() from one random.Random seed (20260923): stock sentences per clause type with slots
    for parties, jurisdictions, caps and notice periods; hybrid clauses that borrow the confusable neighbour''s
    sentences; OCR-style character smudges; and truncation. The pool is deduplicated by text BEFORE it
    is shuffled and split, so no clause appears in two splits. Nothing is read from disk and nothing is
    downloaded.'
points: 100
status: reviewed
measured_seconds: 2.1
measured_peak_mib: 196
