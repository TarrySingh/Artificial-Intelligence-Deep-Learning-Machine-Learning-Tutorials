id: P02-L05-clause-classification-abstention
title: Contract clause classification and calibrated abstention — a classifier that says "I don't know" at a rate you chose and priced
track: P02
flagship: ""            # this programme's capstone is specified in MODULES.md, not yet built
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 180
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P02-L01-extraction-evaluation
objectives:
  - "Implement a bag-of-subwords featuriser (every repeat counted, log-damped, each row scaled to unit length) over a byte-pair-encoding vocabulary fitted with tokenizers on the training split only, and verify that the vocabulary is byte-identical across runs and across Python 3.11 and 3.12"
  - "Implement multinomial logistic regression in numpy — a stable softmax, the cross-entropy gradient and full-batch gradient descent with a stated stopping rule"
  - "Measure per-clause precision, recall and F1 with abstentions counted as false negatives, and the recall that abstaining costs each clause type"
  - "Implement temperature scaling and the expected calibration error on a calibration split, and measure what calibration changes (confidence, ECE, the meaning of a threshold) and what it cannot (accuracy)"
  - "Choose an abstention threshold from the coverage/accuracy curve, explain why it must be fitted away from the reported split, and price the abstention rate it implies through module 1's review queue"
datasets:
