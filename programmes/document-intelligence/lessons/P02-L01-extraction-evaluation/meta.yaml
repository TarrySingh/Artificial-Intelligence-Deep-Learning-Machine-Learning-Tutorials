id: P02-L01-extraction-evaluation
title: Build the evaluation harness for a field-extraction system before you build the extractor
track: P02
flagship: ''
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
objectives:
- Implement normalise_value and exact, normalised and fuzzy matching so that per-field-type equality is
  a written, reviewable policy, and measure what fuzzy matching costs when it is applied to a money field
- Implement a per-field precision/recall/F1 scorer that counts a wrong value as both a false positive
  and a false negative
- Build a confusion analysis over field types that turns one F1 number into a work order
- Implement a confidence-ordered review queue under a fixed budget and measure the macro-F1 it buys per
  unit of cost
- Explain why the harness is built before the extractor rather than after it
before_you_start:
  assumed:
  - write Python functions with loops, dicts and sets, and read a docstring with a worked example
  - compute precision, recall and F1 by hand from counts of true positives, false positives and false
    negatives
  - clean text with str methods and simple regular expressions (strip, lower, replace, re.sub)
  - 'read a confusion matrix: rows are the true class, columns the predicted class'
  resources:
  - title: 'Introduction to Information Retrieval, section 8.3: Evaluation of unranked retrieval sets'
    by: Manning, Raghavan and Schütze (Cambridge University Press; free online)
    url: https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-unranked-retrieval-sets-1.html
    kind: free
    why: defines precision, recall and the F measure, the three quantities score_field computes per field
  - title: 'scikit-learn user guide: Metrics and scoring'
    by: scikit-learn developers (official documentation)
    url: https://scikit-learn.org/stable/modules/model_evaluation.html
    kind: free
    why: the confusion-matrix and precision/recall/F-measure sections, including macro versus micro averaging,
      to check your scorer against
  - title: 'Speech and Language Processing, chapter: Words and Tokens'
    by: Jurafsky and Martin (Stanford; free drafts)
    url: https://web.stanford.edu/~jurafsky/slp3/2.pdf
    kind: free
    why: section 2.9 (minimum edit distance) explains the Levenshtein distance behind the fuzzy matcher;
      section 2.6 (regular expressions) helps with normalise_value
datasets: []
points: 90
status: reviewed
measured_seconds: 0.2
measured_peak_mib: 30
