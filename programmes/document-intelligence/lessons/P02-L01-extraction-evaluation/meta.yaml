objectives:
  - "Implement normalise_value so that per-field-type equality is a written, reviewable policy"
  - "Implement exact, normalised and fuzzy matching, and measure what fuzzy matching costs when it is applied to a money field"
  - "Implement a per-field precision/recall/F1 scorer that counts a wrong value as both a false positive and a false negative"
  - "Build a confusion analysis over field types that turns one F1 number into a work order"
