# Every factual claim this lesson makes about the world, with a primary source and the date
# the source was read. Numbers a student sees in output are computed by the code they run and
# are therefore not claims; they do not appear here.
#
# This lesson generates its own corpus, so it has no dataset entry and nothing to license. The
# three cost constants in section 8 (SECONDS_PER_REVIEWED_CELL, REVIEWER_COST_PER_HOUR,
# MACHINE_COST_PER_DOCUMENT) are labelled in the notebook as placeholders for the reader's own
# rates. The lesson asserts
# nothing about what they are in any organisation, so they are not claims either — and
# everything derived from them is derived in front of the student.
claims:
  - id: precision-recall-f1-definitions
    claim: >-
      Precision is the number of true positives over true positives plus false positives, and
      recall is true positives over true positives plus false negatives; F1 is the case of the
      F-beta measure at beta = 1, where precision and recall are weighted equally, and it
      reaches its best value at 1 and its worst at 0. These are the formulas `score_field`
      implements, and the reason the lesson's F1 is a harmonic rather than an arithmetic mean.
    where: "lesson.py section 5 (exercise 3 docstring and _check_score); tests/test_lesson.py::test_score_field_counts_and_ratios"
    source_url: https://scikit-learn.org/stable/modules/model_evaluation.html
    source_title: "scikit-learn User Guide — Metrics and scoring: quantifying the quality of predictions"
    quote: >-
      With beta = 1, F_beta and F_1 are equivalent, and the recall and the precision are
      equally important.
    quote_context: >-
      section 'Precision, recall and F-measures'. The page typesets beta, F_beta and F_1 as
      math; the quote spells them out. Re-read 2026-09-23: unchanged.
    accessed: 2026-09-23

  - id: confidence-gates-human-review
    claim: >-
      Routing an extraction to a human on the strength of its confidence score is the documented
      design of at least one production document-extraction service: Microsoft's Azure AI
      Document Intelligence tells operators that a field confidence is an estimated probability
      between 0 and 1 and that it can be used to decide whether to accept a prediction
      automatically or flag it for human review. The review queue in section 7 is that policy
      written out and measured, rather than an invention of this lesson.
    where: "lesson.py section 7 (exercise 5, review_queue) and section 8 (quality/cost curve)"
    source_url: https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/concept/accuracy-confidence
    source_title: "Microsoft Learn — Interpret and improve model accuracy and confidence scores (Azure AI Document Intelligence)"
    quote: >-
      For scenarios where accuracy is critical, confidence can be used to determine whether to
      automatically accept the prediction or flag it for human review.
    quote_context: "page dated 2026-04-08, last updated 2026-07-10 (both unchanged on re-read)"
    accessed: 2026-09-23

  - id: normalisation-heavy-fields-are-the-weak-ones
    claim: >-
      Field type predicts extraction difficulty, and the fields that need normalisation are
      among the hardest: in a May 2026 study of structured contract extraction, the
      domain-trained model the authors built (Olava Extract) scored its highest mean F1 on
      short-text identifiers and its lowest on currency fields requiring normalisation or
      aggregation. The finding is stated for that one model, in the caption of the paper's
      Figure 3, not for the frontier models it was compared with, and the lesson says so. It is
      the empirical reason this lesson makes `normalise_value` the first exercise rather than a
      footnote, and the reason the confusion analysis is grouped by field TYPE.
    where: "lesson.py section 3 (exercise 1 preamble) and section 6 (confusion by field type)"
    source_url: https://arxiv.org/html/2605.05532v1
    source_title: "A Few Good Clauses: Comparing LLMs vs Domain-Trained Small Language Models on Structured Contract Extraction (arXiv 2605.05532v1, submitted 7 May 2026)"
    quote: >-
      Performance is strongest on short-text identifiers and extracted text concepts, and
      weakest on currency fields requiring normalisation or aggregation.
    quote_context: >-
      Caption of Figure 3, 'Olava Extract mean F1 by field category', in the HTML full text.
      The sentence is NOT on the abstract page (https://arxiv.org/abs/2605.05532), which this
      entry cited until 2026-09-23; the abstract says nothing about field categories.
    accessed: 2026-09-23

  - id: contract-study-scorer-did-no-currency-parsing
    claim: >-
      The same study scored its models without normalising the values it compared: its
      evaluation did no lower-casing, date normalisation or currency parsing. A low F1 on
      currency fields there is therefore partly a property of the scorer, which is the point
      this lesson's exercise 1 makes about any harness.
    where: "lesson.py section 3 (exercise 1 preamble)"
    source_url: https://arxiv.org/html/2605.05532v1
    source_title: "A Few Good Clauses: Comparing LLMs vs Domain-Trained Small Language Models on Structured Contract Extraction (arXiv 2605.05532v1, submitted 7 May 2026)"
    quote: >-
      No lower-casing, date normalisation, currency parsing, or LLM-judge rescoring was done at
      the time of evaluation.
    quote_context: "section 3 (evaluation set-up), HTML full text"
    accessed: 2026-09-23

  - id: cost-per-document-is-an-evaluation-axis
    claim: >-
      Cost per document is reported alongside accuracy in current document-processing
      benchmarks, not treated as an afterthought: a March 2026 benchmark of multi-agent LLM
      architectures for financial document processing measures systems along five axes —
      field-level F1, document-level accuracy, end-to-end latency, cost per document and token
      efficiency — and reports the most accurate architecture costing 2.3 times the sequential
      baseline. The quality/cost table in section 8 puts a student on the same two axes.
    where: "lesson.py section 8 (the quality/cost curve) and the closing section"
    source_url: https://arxiv.org/abs/2603.22651
    source_title: "Benchmarking Multi-Agent LLM Architectures for Financial Document Processing: A Comparative Study of Orchestration Patterns, Cost-Accuracy Tradeoffs and Production Scaling Strategies (arXiv 2603.22651v1, submitted 24 Mar 2026)"
    quote: >-
      measured along five axes: field-level F1, document-level accuracy, end-to-end latency,
      cost per document and token efficiency.
    quote_context: "abstract; the same abstract gives the 2.3x cost figure. Re-read 2026-09-23: v1 only."
    accessed: 2026-09-23

  - id: human-oversight-is-a-legal-requirement-in-the-eu
    claim: >-
      For AI systems the EU AI Act classes as high risk, human oversight is a design obligation
      rather than a convention: Article 14(1) requires that such systems be designed and
      developed so that they can be effectively overseen by natural persons while in use. This
      lesson does not claim that every document-extraction system is high risk — that
      classification depends on the use case in Annex III — only that where it is, a review
      queue with a measured budget is the mechanism the obligation asks for. The text of
      Article 14(1) was not changed by the 2026 amendment of the Act; WHEN it applies was (see
      the next entry).
    where: "lesson.py section 7 preamble (why a review queue exists at all); README.md"
    source_url: https://artificialintelligenceact.eu/article/14/
    source_title: "EU Artificial Intelligence Act, Article 14: Human Oversight (AI Act Explorer)"
    quote: >-
      High-risk AI systems shall be designed and developed in such a way, including with
      appropriate human-machine interface tools, that they can be effectively overseen by
      natural persons during the period in which they are in use.
    quote_context: >-
      The AI Act Explorer reproduces the consolidated text of Regulation (EU) 2024/1689. The
      official text is at https://eur-lex.europa.eu/eli/reg/2024/1689/oj — that page renders
      client-side and could not be fetched as text on the access date, so the Explorer's
      rendering of the same article is cited as what was actually read. Re-read 2026-09-23:
      paragraph 1 verbatim; the page now carries the amended application dates.
    accessed: 2026-09-23

  - id: article-14-applies-from-december-2027
    claim: >-
      Regulation (EU) 2026/1744 (the Digital Omnibus on AI, of 8 July 2026, in force since
      27 July 2026) amended Article 113 of the AI Act so that the high-risk requirements of
      Chapter III, Sections 1 to 3 — Article 14 among them — apply to Annex III high-risk
      systems from 2 December 2027 rather than 2 August 2026. The lesson therefore states the
      obligation together with the date from which it applies.
    where: "lesson.py section 7 preamble"
    source_url: https://artificialintelligenceact.eu/article/113/
    source_title: "EU Artificial Intelligence Act, Article 113: Entry into Force and Application (AI Act Explorer, consolidated as amended)"
    quote: >-
      2 December 2027 as regards AI systems classified as high-risk pursuant to Article 6(2) and
      Annex III
    quote_context: >-
      Article 113, third subparagraph, point (c)(i), marked on the page as inserted by the
      amendment. The amending act, its date and its entry into force are named on
      https://artificialintelligenceact.eu/ai-act-explorer/digital-omnibus/, read the same day.
    accessed: 2026-09-23
