id: P02-L07-slice-discovery
title: Error analysis and slice discovery — is that regression real, and is the slice big enough to say?
track: P02
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
objectives:
- Implement automatic slice discovery over document attributes (vendor, layout family, language, binned
  page count, scan quality), including two-attribute crosses, above a minimum size
- Implement a vectorised paired bootstrap for the change in a slice's macro F1 between two model versions,
  with a percentile interval and a one-sided p-value that is never zero
- Implement Holm's step-down and Benjamini-Hochberg's step-up adjustments, and explain why a release gate
  over overlapping slices uses the family-wise one
- Compute the sample size a slice needs before it may block a release, and measure what searching two
  attributes deep does to it and to the smallest p-value the bootstrap can produce
- Produce a release decision that names which slice regressions are real and which slices are too small
  to say, and measure how often point-estimate and uncorrected rules block a release in which nothing
  changed
datasets:
- name: document-intelligence slice evaluation set (module 1's remittance advices with attributes)
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
