id: P02-L10-streaming-scanner-in-c
title: Implement a streaming field scanner in C that reads a document export of any size in fixed memory
track: P02
flagship: ''
tier: cpu8
budget_seconds: 60
language: c
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
objectives:
- Implement a chunk-resumable CSV field scanner in C whose counters do not depend on where the reader
  split the stream
- Implement a declared field-truncation policy in a fixed buffer, and report how often it fired without
  letting the count become a function of field length
- Distinguish a truncated final record from a legal final record with no trailing line break, and state
  what each contributes to the totals
- Measure throughput and peak resident memory against a Python scanner on identical bytes, and attribute
  each factor to the language or to the algorithm
- Show that peak resident memory is flat while the export grows by two orders of magnitude
