id: P02-L06-review-queues-real-reviewers
title: Human-in-the-loop review queues that survive contact with humans — agreement, deadlines, escalation,
  and the ceiling your reviewers put on every score
track: P02
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
objectives:
- Implement raw agreement and Cohen's kappa over the union of two reviewers' labels, including perfect
  agreement, chance level, systematic disagreement, one shared label and a label one reviewer never uses
- Implement an SLA-aware review queue that serves arrived work earliest deadline first and reports its
  breaches, and measure its breach rate against first-in-first-out and module 1's confidence order
- Implement a two-tier escalation policy and measure the tier-1 mistakes it sends to a senior reviewer
  against a random escalation of the same size
- Measure throughput against quality across shift lengths for reviewers who tire, and choose a rota against
  an explicit breach-rate target
- Compute from your own kappa the quality ceiling your evaluation harness can see, check it against the
  simulation's truth, and explain why it is not 1.0
before_you_start:
  assumed:
  - multiply the probabilities of independent events, P(A and B) = P(A) P(B), and add those of mutually
    exclusive ones
  - use sorted() with a key, or heapq, to take items from a queue in a chosen order
  - simulate a day of work with a seeded numpy random generator and report a rate from it
  resources:
  - title: 'Survey Article: Inter-Coder Agreement for Computational Linguistics'
    by: Artstein and Poesio (Computational Linguistics, 2008; ACL Anthology)
    url: https://aclanthology.org/J08-4004/
    kind: free
    why: observed versus expected agreement and the kappa family of coefficients, and how to read the
      values; the background for Exercises 1 and 2
  - title: sklearn.metrics.cohen_kappa_score
    by: scikit-learn developers (official documentation)
    url: https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html
    kind: free
    why: the reference definition (p_o - p_e) / (1 - p_e), to check your plain-Python kappa against on
      the same labels
  - title: Cheap and Fast - But is it Good? Evaluating Non-Expert Annotations for Natural Language Tasks
    by: Snow, O'Connor, Jurafsky and Ng (EMNLP 2008; ACL Anthology)
    url: https://aclanthology.org/D08-1027/
    kind: free
    why: 'how agreement between human annotators and expert labels is measured across NLP tasks, and how
      much annotator quality varies: context for the ceiling reviewers put on a score'
  - title: 'Algorithm Design, section 4.2: Scheduling to Minimize Lateness'
    by: Kleinberg and Tardos (Pearson)
    url: https://www.pearson.com/en-us/subject-catalog/p/algorithm-design/P200000003259/9780137546350
    kind: paid
    why: proves that earliest-deadline-first order minimises maximum lateness by an exchange argument,
      the reason sla_schedule serves the nearest deadline first
datasets:
- name: module 1's synthetic remittance advices and extractor, plus a simulated review team
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: Module 1's generator and seeds (build_corpus seed 20260916, run_extractor seed 7) re-create its
    180 documents and 1080 (document, field) cells record for record, carried in-lesson because a student
    bundle is one directory. Three simulated reviewers (seeds 101, 202, 303, shifted per simulated day)
    label them; every parameter is printed in the notebook and none is a claim about real people. Nothing
    is read from disk and nothing is downloaded.
points: 90
status: reviewed
measured_seconds: 2.9
measured_peak_mib: 31
