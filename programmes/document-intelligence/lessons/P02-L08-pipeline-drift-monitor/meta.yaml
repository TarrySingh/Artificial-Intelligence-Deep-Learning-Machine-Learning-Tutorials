id: P02-L08-pipeline-drift-monitor
title: Drift monitoring for a live document pipeline — PSI and KL say which distribution moved, a budgeted
  CUSUM on the audited defect rate says whether quality moved, and only the second one pages
track: P02
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
objectives:
- Implement a population stability index and a KL divergence over binned field-value and confidence distributions,
  on edges cut once on a baseline, floored on both sides, with one bin per category for categorical fields
- Implement the audited defect rate as a daily quality proxy and an upper one-sided CUSUM with reset on
  it
- Measure the false-page rate of a CUSUM threshold on simulated no-change years and choose the most sensitive
  threshold inside an explicit false-page budget instead of a round number
- Replay a synthetic year with a vendor template change, a seasonal mix shift and a model regression,
  catch the regression without paging for the other two, and tell the three apart by which distribution
  moved and whether quality moved
- Explain why a drift statistic, or a label-free confidence proxy, pages for the harmless changes and
  misses the harmful one
before_you_start:
  assumed:
  - bin data with np.histogram on explicit bin edges and turn the counts into proportions
  - explain how noisy a rate is when it is measured on a few hundred items, such as the share of audited
    documents that are defective
  - say what log(p / q) is when p equals q, and when p is much larger than q
  resources:
  - title: 'NIST/SEMATECH e-Handbook of Statistical Methods: CUSUM control charts'
    by: NIST (US National Institute of Standards and Technology)
    url: https://www.itl.nist.gov/div898/handbook/pmc/section3/pmc323.htm
    kind: free
    why: the tabular CUSUM with a reference value k and a decision threshold h, and how they trade detection
      speed against false alarms, the statistic cusum implements
  - title: Information Theory, Inference, and Learning Algorithms, chapter 2
    by: David MacKay (Cambridge University Press; free PDF from the author)
    url: https://www.inference.org.uk/itprnn/book.html
    kind: free
    why: section 2.6 defines relative entropy (KL divergence) and Gibbs' inequality, and notes that it
      is not symmetric; the background for kl_divergence
  - title: Statistical Properties of Population Stability Index
    by: Bilal Yurdakul (PhD dissertation, Western Michigan University, 2018; open access)
    url: https://scholarworks.wmich.edu/dissertations/3208/
    kind: free
    why: the population stability index, its link to KL divergence, and the type I and type II error rates
      behind the 0.10 and 0.25 rules of thumb; background for population_stability_index
  - title: 'Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift'
    by: Rabanser, Günnemann and Lipton (NeurIPS 2019; arXiv)
    url: https://arxiv.org/abs/1810.11953
    kind: free
    why: compares label-free shift detectors on inputs and predictions, and treats whether a detected
      shift is harmful as a separate question from detecting it
datasets:
- name: synthetic remittance-advice pipeline year with three injected events
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: One replay year of 364 days x 200 documents, generated in section 1 by simulate_year() from numpy.random.default_rng(20260923),
    with a random audit of 25 documents a day, and three counterfactual copies of the same year with one
    event switched off each (identical random numbers, so every difference is caused by the event). Nothing
    is read from disk and nothing is downloaded.
points: 96
status: reviewed
measured_seconds: 8.8
measured_peak_mib: 128
