id: P02-L08-pipeline-drift-monitor
title: Drift monitoring for a live document pipeline — PSI and KL say which distribution moved, a budgeted CUSUM on the audited defect rate says whether quality moved, and only the second one pages
track: P02
flagship: ""            # this programme's capstone is specified in MODULES.md, not yet built
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 180
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P02-L01-extraction-evaluation
objectives:
  - "Implement a population stability index and a KL divergence over binned field-value and confidence distributions, on edges cut once on a baseline, floored on both sides, with one bin per category for categorical fields"
  - "Implement the audited defect rate as a daily quality proxy and an upper one-sided CUSUM with reset on it"
  - "Measure the false-page rate of a CUSUM threshold on simulated no-change years and choose the most sensitive threshold inside an explicit false-page budget instead of a round number"
  - "Replay a synthetic year with a vendor template change, a seasonal mix shift and a model regression, catch the regression without paging for the other two, and tell the three apart by which distribution moved and whether quality moved"
  - "Explain why a drift statistic, or a label-free confidence proxy, pages for the harmless changes and misses the harmful one"
