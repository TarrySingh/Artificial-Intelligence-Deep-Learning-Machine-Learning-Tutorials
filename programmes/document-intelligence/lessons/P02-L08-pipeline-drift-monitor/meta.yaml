    kind: synthetic
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    note: >-
      One replay year of 364 days x 200 documents, generated in section 1 by simulate_year()
      from numpy.random.default_rng(20260923), with a random audit of 25 documents a day, and
