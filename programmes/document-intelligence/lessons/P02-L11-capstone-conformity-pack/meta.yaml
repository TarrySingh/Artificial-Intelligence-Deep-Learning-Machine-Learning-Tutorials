id: P02-L11-capstone-conformity-pack
title: The capstone conformity pack — a validator that regenerates every figure in an evidence pack from
  the artefacts behind it
track: P02
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
- P02-L02-layout-reading-order
- P02-L03-sequence-labelling
- P02-L04-table-extraction
- P02-L05-clause-classification-abstention
- P02-L06-review-queues-real-reviewers
- P02-L07-slice-discovery
- P02-L08-pipeline-drift-monitor
- P02-L09-cost-routing-budget
- P02-L10-streaming-scanner-in-c
objectives:
- Implement a reproduction gate that regenerates every figure in a document from a computed evidence bundle,
  and refuses the document if any figure's value cannot be found within the precision the document itself
  claims
- Implement three independent provenance checks -- a residual-by-class recomputation against the raw records,
  a cost-figure citation check against a measurement registry, and a threshold-timing check against the
  real alarm day -- each catching a number that is individually correct but was produced the wrong way
- Combine all four checks into a single validator with a logical AND, never a majority, and use it as
  the gate that refuses to render a pack assembled from the harness, slice analysis, drift monitor, cost
  model and escalation policy of earlier modules
- Measure, by planting each of this lesson's defects alone in an otherwise clean pack, which of the four
  checks catches each one, and explain why a reproduction gate cannot catch a figure that is correct for
  the wrong data
- Explain why a repair that only makes the validator quieter -- widening a tolerance, loosening a boundary
  by one step, or dropping a check from the combination -- leaves the pack no more honest, and why the
  rubric fails each such repair
before_you_start:
  assumed:
  - write Python regular expressions with groups, and use re.finditer to walk every match in a string
  - explain why 0.1 + 0.2 != 0.3, and compare floats within a stated tolerance or to a stated number of
    decimals
  - tell a dict, a list, a string, a bool and a number apart with isinstance, and say why isinstance(True,
    int) is True
  resources:
  - title: Regular Expression HOWTO
    by: Python documentation
    url: https://docs.python.org/3/howto/regex.html
    kind: free
    why: the finditer and groups sections are the tools for extract_figures, which must find every number
      a document prints
  - title: 'Floating-Point Arithmetic: Issues and Limitations'
    by: Python documentation (tutorial)
    url: https://docs.python.org/3/tutorial/floatingpoint.html
    kind: free
    why: representation error, and math.isclose and rounding as the way to compare a computed value with
      a printed one at the precision the document claims
  - title: Model Cards for Model Reporting
    by: Mitchell et al. (FAT* 2019; arXiv)
    url: https://arxiv.org/abs/1810.03993
    kind: free
    why: 'what a model-reporting document should state (intended use, evaluation data, per-group results):
      the kind of document the conformity pack is'
  - title: Improving Reproducibility in Machine Learning Research
    by: Pineau et al. (NeurIPS 2019 reproducibility programme; arXiv)
    url: https://arxiv.org/abs/2003.12206
    kind: free
    why: 'the reproducibility checklist and what the programme found when reported results were re-checked:
      the motive for a gate that regenerates every figure'
datasets:
- name: synthetic remittance-advice extraction records, drift replay and cost/measurement registry
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: 240 documents (4 field types, a 1/3 evaluation split) from build_corpus() on random.Random(20260923);
    a 300-day CUSUM replay with one injected regression from simulate_quality_series(); a fixed 3-tier
    cost model and a 4-entry measurement registry. Nothing is read from disk and nothing is downloaded.
points: 149
status: reviewed
measured_seconds: 5.7
measured_peak_mib: 29
