id: P02-L09-cost-routing-budget
title: Cost per document, and the routing budget that sets it — a three-tier router priced from the earlier
  modules, solved exactly by sweep and approximately by greedy, with its Pareto frontier and a recommendation
  generated from the numbers
track: P02
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
- P02-L03-sequence-labelling
- P02-L06-review-queues-real-reviewers
- P02-L07-slice-discovery
objectives:
- Implement cost per document and field accuracy of a routing plan as volume-weighted means over segments,
  and measure how far the unweighted mean over segments misstates the monthly bill and the wrong fields
- Implement the routing budget as an exhaustive sweep over every plan that picks the most accurate plan
  fitting a cap, and the Pareto frontier of field accuracy against cost per document as a staircase rather
  than a convex hull
- Implement the greedy marginal-yield rule and measure where it matches the sweep — at its own breakpoints,
  under a price per wrong field, on random segment mixes — and by how much it falls short between breakpoints
- Construct a segment mix on this router's own tiers on which the greedy rule is beaten by the sweep,
  and explain from the construction why greedy cannot recover
- Generate from the computed numbers alone a routing recommendation a finance partner could sign, including
  the price per wrong field avoided of the next step up the frontier
datasets:
- name: three-tier router price list, eight-segment traffic fixture, and random segment mixes
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: The tiers are priced in section 1 from named placeholders (module 1's machine cost and reviewer
    rate, module 6's simulated reviewing pace, a per-page price for the expensive tier); the eight segments
    in section 2 are a fixed fixture of volumes, page counts and per-tier field accuracies shaped on what
    modules 1-4 and 6-8 measured, each labelled with the module it mirrors. Section 6 draws 150 random
    six-segment mixes and caps from random.Random(20260923). Nothing is read from disk and nothing is
    downloaded.
points: 100
status: reviewed
measured_seconds: 0.8
measured_peak_mib: 83
