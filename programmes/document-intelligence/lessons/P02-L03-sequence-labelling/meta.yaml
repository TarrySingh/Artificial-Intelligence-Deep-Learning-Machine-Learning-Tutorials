id: P02-L03-sequence-labelling
title: From rules to a tagger — sequence labelling over document tokens, scored by module 1's harness
track: P02
flagship: ''
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P02-L01-extraction-evaluation
- P02-L02-layout-reading-order
objectives:
- Implement a BIO feature template over a document token stream — shape, affix, neighbouring token, line
  head, line position and one conjunction — and name the feature that carries the work
- Implement Viterbi decoding and demonstrate a case where greedy per-token tagging returns a lower-scoring
  sequence
- Implement the structured perceptron update, including the transition half, and show that one wrong tag
  breaks two bigrams
- Decode BIO tags back into field values, including the stray I- case a decoder is free to emit
- Measure the trained tagger against the rule baseline with module 1's harness and state which field types
  it improved and which it did not
before_you_start:
  assumed:
  - build and update a dict from string keys to numbers, with dict.get or collections.defaultdict
  - explain how a linear classifier scores an input as the sum of the weights of the features it has,
    and picks the highest-scoring class
  - write a regular expression for a simple pattern such as a date or an amount
  resources:
  - title: 'Speech and Language Processing, chapter: Sequence Labeling for Parts of Speech and Named Entities'
    by: Jurafsky and Martin (Stanford; free drafts)
    url: https://web.stanford.edu/~jurafsky/slp3/18.pdf
    kind: free
    why: sections 18.3 (BIO tagging of spans), 18.5 (feature-based CRF taggers) and 18.4 (Viterbi decoding),
      the ideas behind decode_spans, token_features and viterbi_decode
  - title: 'Speech and Language Processing, appendix: Hidden Markov Models'
    by: Jurafsky and Martin (Stanford; free drafts)
    url: https://web.stanford.edu/~jurafsky/slp3/A.pdf
    kind: free
    why: section A.4, the Viterbi algorithm worked as a trellis of best-path scores, the table that viterbi_decode
      fills in
  - title: 'Discriminative Training Methods for Hidden Markov Models: Theory and Experiments with Perceptron
      Algorithms'
    by: Michael Collins (EMNLP 2002; ACL Anthology)
    url: https://aclanthology.org/W02-1001/
    kind: free
    why: 'the structured perceptron: decode with Viterbi, then add the gold sequence''s features and subtract
      the predicted one''s, the update of perceptron_update (see ''A New Estimation Method'')'
datasets: []
points: 90
status: reviewed
measured_seconds: 0.8
measured_peak_mib: 35
