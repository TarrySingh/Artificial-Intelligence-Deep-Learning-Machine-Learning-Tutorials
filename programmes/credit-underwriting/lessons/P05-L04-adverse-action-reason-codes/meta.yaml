    that no model sees; generated in lesson.py by application_book(seed) (seed 20261019; replicate books
    from fixed seeds derived from it)
  generator: 'lesson.py :: application_book'
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  downloads: false
