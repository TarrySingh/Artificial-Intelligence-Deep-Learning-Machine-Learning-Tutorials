id: P01-L05-human-oversight
title: Turn the Article 14 human-oversight duty into measured baselines an inspector can re-run, and a
  gate that enforces them
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
objectives:
- Implement a decision view that folds module 1's chained log in sequence order and keeps the duplicate
  verifier entries a deduplicating fold destroys
- Implement override rate overall, per reviewer and per model recommendation, and explain why an undecided,
  an unscored and an unreviewed decision each leave the denominator by a different door
- Implement a time-to-decision distribution that separates a clock that stepped backwards from a reviewer
  who was too fast, and explain why abs() on the first invents the second
- Implement an automation-bias curve and separate a reviewer whose override rate collapses from one whose
  rate merely declines, using each reviewer's own minimum detectable difference
- Implement the Article 14(5) four-eyes check as a count of distinct natural persons and measure how many
  decisions a length test would have passed, then implement oversight_gate(), the control that enforces
  it, and report every decision it would have blocked with each reason it failed on rather than only the
  first
datasets:
- name: loan-copilot synthetic Article 12 event log
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: 5418 chained log entries over 1361 decisions, built in section 2 from a single numpy Generator
    seed (20260922) in module 1's exact log shape. Nothing is read from disk and nothing is downloaded,
    so the lesson runs offline and two runs agree to the last digit. Every defect it contains — the twelve
    decisions signed twice by one person, the nineteen signed once where Article 14(5) needs two, the
    eight never verified at all, the eleven out-of-scope decisions with no verifier, the fourteen reviewed
    under the plausibility floor, the three whose clock stepped backwards, the seven that never closed,
    the five with no model recommendation, the sixteen where the submitter signed their own case, and
    the three verification pairs recorded out of timestamp order — is planted deliberately and listed
    in the open inside _build_stream(). No real applicant data is involved, no real reviewer is named,
    and none of the figures the lesson prints is a claim about any real credit portfolio or any real person's
    review behaviour.
points: 100
status: reviewed
measured_seconds: 0.3
measured_peak_mib: 42
