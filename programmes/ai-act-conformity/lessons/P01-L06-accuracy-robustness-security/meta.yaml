id: P01-L06-accuracy-robustness-security
title: Build the Article 15 accuracy, robustness and cybersecurity evidence in which every measured number
  carries its uncertainty and every threshold carries the sequence number that proves when it was chosen
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
- P01-L04-data-governance
objectives:
- Implement a paired percentile bootstrap and measure what resampling predictions independently of labels
  does to the interval of a model that is right about every row
- Implement a declaration that refuses a bare point estimate, and declare the defensible end of the interval
  — the lower bound where higher is better, the upper bound where lower is better
- Implement a sealed accuracy floor whose ordering the ledger enforces, and explain why a floor sealed
  after the metric it governs was measured is a refusal rather than a judgement call
- Measure a four-family degradation curve and report the severity at which the declared lower bound crosses
  the floor, which on this fixture is a full grid step before the point estimate does
- Implement a neighbourhood poisoning scan with a minimum-support rule and a measured model-extraction
  budget, and emit only the residual-risk statements the evidence actually bounds
datasets:
- name: loan-copilot synthetic applicant table, evaluation and training splits
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: '3200 applicants (2000 training, 1200 held out) plus a 1200-row evaluation population and up to
    600 attacker queries, all drawn in section 3 from a single numpy Generator seed (20281115) and a fixed
    linear scoring model. Nothing is read from disk and nothing is downloaded, so the lesson runs offline
    and two runs agree to the last digit. Every defect it contains is planted deliberately and documented
    in the authoring notes below: three per-batch label flips in the training set (b06 at 0.55, b08 at
    0.12, b09 at 0.50) on top of 3% ordinary label noise, and four perturbation families applied to the
    held-out split. No real applicant data is involved, and none of the figures the lesson prints is a
    claim about any real credit portfolio. An optional off-path extension a student can run the same code
    against afterwards is named in claims.yaml with its real licence and direct URL; it is not on any
    path the grader needs.'
