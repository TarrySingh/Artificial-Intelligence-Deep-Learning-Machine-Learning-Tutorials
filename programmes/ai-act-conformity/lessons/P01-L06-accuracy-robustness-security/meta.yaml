# ---------------------------------------------------------------------------------------
# ---------------------------------------------------------------------------------------
# INDEPENDENT REVIEW, 2026-09-23. A second author re-ran all four gates, built a fresh wave of
# 33 mutants and 4 differently-shaped right-answer controls, re-fetched every URL in
# claims.yaml, and audited the things the gates cannot see. The wave was aimed deliberately at
# the thin spots the first wave named: the strict-versus-inclusive boundaries, the two
# seal_floor refusals, the findings order, the client-limit boundary and the list walk.
#
# WHAT THE FIRST WAVE MISSED. 14 of the 33 mutants scored a full 132/132 against the rubric as
# it stood. Ten of them were real rubric defects, every one a BOUNDARY the fixture never
# reaches, and every one now graded:
#
#   declare      `lo < point < hi` and `hi <= lo` both refused a ZERO-WIDTH interval — which is
#                what this lesson's own bootstrap returns for a model right about every row,
#                and what section 4's pairing demo prints. Two refusals of a measurement the
#                lesson itself makes, scoring full marks.
#   seal_floor   the length check run on the UNSTRIPPED rationale, so padding a short reason
#                out to MIN_RATIONALE_CHARS with whitespace bought a floor with no reason.
#   curve        the measurement handed (y_pred, y_true). accuracy is symmetric and cannot see
#                it; `metric_name` is a parameter and two of METRICS are not.
#   crossing     `lo <= floor` counted a bound sitting exactly ON the floor as a breach.
#   poison       `n <= min_support` made a batch of exactly min_support rows unexaminable while
#                `supported` still said True — the two were decided by separate expressions and
#                only one was pinned at the boundary; and `lo >= baseline_hi` accused every
#                batch in a set with nothing flagged, where both intervals are exactly [0, 0].
#   extraction   `hi > target` gave the attacker a free grid step; `days_lo <= target_days`
#                failed a system that met its target exactly; `round` in place of `floor` gave
#                the recommended limit back the queries the floor had just taken away.
#
# The fixes are eight tightened hidden cases and one new helper, `_separable_population` — two
# far-apart clusters labelled by cluster, the only way to put a batch's `lo` exactly level with
# its baseline's `hi` on a real scan. Re-run in full afterwards: 30 of 33 mutants lose points,
# scoring 88% to 98%, each losing only the test written for it plus its genuine collateral, so
# partial credit survives everywhere. All four controls still score 100%.
#
# THREE SURVIVORS, PROVED EQUIVALENT rather than patched:
#   * `[k for k in DECLARATION_KEYS if ci.get(k) is None]` in place of `if k not in ci`.
#     Measured over every shape the contract names — complete, key absent, point/lo/hi None or
#     nan, zero-width, empty — the two agree on the returned dict and on the exception type in
#     every case. They diverge only where a non-interval key is PRESENT and None (`level`,
#     `n`), which the docstring does not cover and where the reference raises an uncaught
#     TypeError and the variant raises UndeclarableMetricError. The variant is the more
#     graceful of the two on undocumented input; it is not a wrong answer.
#   * seal_floor storing the raw rationale in the payload instead of the stripped one. The
#     docstring specifies stripping for the LENGTH CHECK only, and nothing downstream compares
#     the stored text — crossing_severity recomputes the digest from the payload it is handed,
#     so a consistently unstripped payload verifies. No divergence exists inside the contract.
#   * poison_scan ranking findings by `-rate` without the `(-rate, id)` tie-break. `out` is
#     built by `for batch_id in sorted(set(batches))`, so the sequence handed to `sorted` is
#     already in ascending id order and Python's sort is stable: ties break by id either way.
#     Measured on a four-batch fixture with three tied rates, the two orders are identical.
#
# THREE DEFECTS THE GATES CANNOT SEE, all fixed here:
#   1. THE SELF-CHECK ANSWER KEY WAS DEAD. No letter reproduced any stored digest under the
#      scheme `check_self_check` actually uses — brute-forced over a-h, six salts and seven
#      formats, zero matches. A student answering all five correctly was told all five were
#      wrong. Nothing executes `check_self_check` with real answers (the call is commented
#      out), so execute.py and grade.py were both blind to it. The key is regenerated from
#      1c 2b 3d 4a 5c, the letters solutions section 16a argues for, and both files now mark
#      five right for the right answers and one right for all-'a'.
#   2. GATE 3, measured per RUN rather than per cell. Sections 15 and 16 were two markdown
#      cells back to back: 65 lines of prose with nothing to run between them. The note above
#      reads "the longest markdown cell here is 42 lines", which is true and is not what the
#      gate asks. A runnable cell now sits between them and the longest run is 44, the same as
#      reviewed P01-L04.
#   3. GATE 12, four places. `accuracy: 0.89` in the opening and in the common-mistakes list,
#      and self-check questions 1 and 3, which stated "You measure accuracy at 0.89 on 1200
#      held-out rows" and "Extraction is measured at 130 queries ... a limit of 500 a day".
#      0.89, 1200 and 130 are this run's own measured outputs, typed by hand, and would have
#      gone stale in silence if the seed or the query grid ever moved. The cell added for
#      gate 3 prints all of them and both stems now point at it. (Question 2's 0.83 is a
#      hypothetical and is not this lesson's worst family, which bottoms out at 0.7525; it is
#      left alone, as P01-L04 leaves its own scenario numbers.)
#
