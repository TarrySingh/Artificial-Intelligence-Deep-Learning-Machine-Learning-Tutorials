# MUTATION NOTES, 2026-09-22/23. 31 mutants and 3 right-answer controls were built in a temporary
# directory outside the lesson tree — each a whole copy of the lesson with one textual edit to
# the reference solution — and graded through tools/grade.py --solution.
#
# The FIRST wave caught 31 of 31 and found ONE real rubric defect, which scored a full 132/132
# against the rubric as it stood:
#
#   * AN ORDER-DEPENDENT FIXTURE. `test_curve_perturbs_the_inputs_and_leaves_the_fixture_alone`
#     snapshotted `lesson.TEST_FEATURES` inside itself and compared afterwards. By the time it
#     ran, an earlier rubric case had already called `perturbation_curve`, so an implementation
#     that writes the damage back into the features it was handed had corrupted the fixture
#     BEFORE the test that hunts for exactly that started looking — and its snapshot matched.
#     The mutant was caught only by two collateral tests. The snapshots are now taken at module
#     import, before any case has run, and every expectation drawn from the held-out split is
#     derived from them; that mutant now loses the test written for it, and any fixture
#     corruption from any source is visible wherever it happens.
#
# Two further hidden cases were strengthened where the wave showed a distinction resting on a
# single test: the defensible-end choice in `declare` (a second interval, 10%-to-70%, in
# `test_declare_carries_the_provenance_and_leaves_the_input_alone`) and the floor-ordering rule
# (a floor sealed mid-sweep on the REAL curve, in `test_crossing_on_the_real_sweep`). Both
# mutants now lose two tests rather than one.
#
# AFTER the fixes, re-run in full: 31 of 31 mutants lost points, scoring 76% to 97%, and every
# one of them kept full credit on the exercises it had not broken, so no test collapsed into
# all-or-nothing. Nothing survived, and nothing had to be proved equivalent. By exercise:
#
#   bootstrap: unpaired index draws (79%); point as the replicate mean (86%); percentiles
#     hard-coded at 2.5/97.5 (98%); resampling without replacement, i.e. a per-row permutation
#     (76%); a zero-width interval on no rows (98%).
#   declare: always publishing the lower bound (95%); testing the interval for truthiness
#     rather than for its keys (96%); allowing a point outside its own interval (96%).
#   seal_floor: allowing a second floor for the same metric (96%); blocking on any measurement
#     whatever its metric (96%); accepting any rationale (97%); digesting the ledger entry
#     rather than the payload (90%).
#   perturbation_curve: writing the damage back into the caller's features (91%); measuring
#     with bootstrap_ci directly instead of through the ledger (90%).
#   crossing_severity: crossing on the point rather than the lower bound (86%); comparing the
#     floor against the LAST measurement instead of the first (93%); skipping the digest check
#     (97%); failing only strictly inside the operating point (97%); reporting the severity
#     difference instead of grid steps (97%).
#   poison_scan: a baseline that includes the batch under test (96%); judging the gap before
#     applying the support floor (96%); comparing point estimates rather than intervals (93%);
#     listing findings least serious first (97%).
#   extraction_risk: reading the two budget bounds the wrong way round (90%); sizing the
#     recommendation off the confident budget rather than the lucky one (94%); listing clients
#     at the limit as over it (96%).
#   residual_risk: dropping the statements it cannot support (92%); accepting evidence with no
#     interval (97%).
#   unbounded_numbers: treating booleans as numbers (94%); descending into intervals (94%);
#     never walking lists (97%).
#
# The three controls are differently-shaped RIGHT answers and all score 100%: (1) np.quantile
# in place of np.percentile, a tuple-index form of the declared-end choice, and an iterative
# stack-based audit in place of the recursive one; (2) explicit loops in crossing_severity in
# place of next(), and a sorted-comprehension ranking in poison_scan; (3) seal_floor validating
# the floor before the rationale, and a while-loop path walk in residual_risk.
#
# WHAT THIS WAVE DOES NOT ESTABLISH. One author wrote both the rubric and the mutants, so the
# mutants inherit the author's idea of what a wrong answer looks like. Eleven of the thirty-one
# still lose exactly one test (96-97%), which means a single hidden case is carrying the whole
# distinction in each of those places — the defect found above was of exactly that shape, and
# it was invisible until a collateral test happened to catch its mutant. A second, independent
# wave should aim there first: seal_floor's two refusals, the digest check, the strict-versus-
# inclusive operating-point comparison, the findings order, the client-limit boundary, the
# non-interval evidence refusal and the list walk.
#
# WORKED EXAMPLES. All 34 doctests in the nine stub docstrings were run against the reference
# solution under doctest.testmod and pass. No gate runs them, so a wrong worked example would
# otherwise ship silently and teach the wrong contract to every student who reads it before
# writing anything.
#
# ONE PEDAGOGY GATE READING. Gate 3 asks for no more than about 40 lines of prose before the
# next runnable cell. The longest markdown cell here is 42 lines and is the section 16
