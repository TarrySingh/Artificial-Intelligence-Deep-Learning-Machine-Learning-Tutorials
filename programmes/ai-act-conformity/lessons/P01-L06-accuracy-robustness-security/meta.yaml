id: P01-L06-accuracy-robustness-security
title: Build the Article 15 accuracy, robustness and cybersecurity evidence in which every measured number carries its uncertainty and every threshold carries the sequence number that proves when it was chosen
track: P01
programme: ai-act-conformity
flagship: F09           # flagship id this lesson feeds, or empty
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T10-L01-ai-act-conformity-pack
  - P01-L01-article-12-logging
  - P01-L04-data-governance   # its support floor and name-it-not-drop-it rule are reused here by name
objectives:
  - "Implement a paired percentile bootstrap and measure what resampling predictions independently of labels does to the interval of a model that is right about every row"
  - "Implement a declaration that refuses a bare point estimate, and declare the defensible end of the interval — the lower bound where higher is better, the upper bound where lower is better"
  - "Implement a sealed accuracy floor whose ordering the ledger enforces, and explain why a floor sealed after the metric it governs was measured is a refusal rather than a judgement call"
  - "Measure a four-family degradation curve and report the severity at which the declared lower bound crosses the floor, which on this fixture is a full grid step before the point estimate does"
  - "Implement a neighbourhood poisoning scan with a minimum-support rule and a measured model-extraction budget, and emit only the residual-risk statements the evidence actually bounds"
datasets:
  - name: loan-copilot synthetic applicant table, evaluation and training splits
    kind: synthetic
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    note: >-
      3200 applicants (2000 training, 1200 held out) plus a 1200-row evaluation population and
      up to 600 attacker queries, all drawn in section 3 from a single numpy Generator seed
      (20281115) and a fixed linear scoring model. Nothing is read from disk and nothing is
      downloaded, so the lesson runs offline and two runs agree to the last digit. Every defect
      it contains is planted deliberately and documented in the authoring notes below: three
      per-batch label flips in the training set (b06 at 0.55, b08 at 0.12, b09 at 0.50) on top
      of 3% ordinary label noise, and four perturbation families applied to the held-out split.
      No real applicant data is involved, and none of the figures the lesson prints is a claim
      about any real credit portfolio. An optional off-path extension a student can run the same
      code against afterwards is named in claims.yaml with its real licence and direct URL; it
      is not on any path the grader needs.
points: 132             # = sum of RUBRIC points in tests/test_lesson.py
status: reviewed        # draft | executed | reviewed | shipped
# Authoring notes, 2026-09-22/23.
#
# All four gates run from the repo root on the venv interpreter. The measured figures at the
# foot of this file were written back by tools/execute.py and were not typed.
#
# WHAT MODULES.md ASKED FOR. Module 6, "Accuracy, robustness and cybersecurity evidence":
# three parts, all numpy. Accuracy as a metric WITH a bootstrap confidence interval, declaring
# the interval rather than the point. Robustness as a perturbation sweep over missing fields,
# unit changes, plausible noise and a stale feature, reporting the degradation curve and the
# perturbation at which performance crosses the declared floor. Cybersecurity as a
# data-poisoning detector over a training set plus a rate-limiting analysis for model
# extraction, then the residual-risk statement the evidence honestly supports. The rubric was
# required to fail any implementation that reports a metric without its interval, and any
# robustness report whose declared floor was chosen after seeing the results. The artefact is
# an Article 15 evidence report whose every number carries its uncertainty. All of that is
# built here.
#
# WHAT WAS DONE DIFFERENTLY, AND WHY.
#
# 1. The ordering rule is ENFORCED BY CODE, not asserted in prose. MODULES.md says the rubric
#    must fail a floor chosen after the results; a rubric cannot see an author's intentions, so
#    the lesson gives the floor a home. `EvidenceLedger` is an append-only, sequence-numbered,
#    hash-chained log — deliberately the same shape as the one P01-L01 builds, minus everything
#    that lesson grades. `seal_floor()` refuses to seal a floor for a metric the ledger has
#    already measured, AND refuses a second floor for a metric that already has one, because
#    re-sealing is the same cheat one entry later. `crossing_severity()` then refuses to report
#    at all unless the floor's seq is strictly below the minimum seq in the curve and the floor
#    still matches its own digest. Five rubric tests grade that ordering, including a floor
#    planted in the MIDDLE of a curve — which passes a naive "floor before the last point"
#    check and is exactly the shape a real after-the-fact floor takes.
#
# 2. A ninth exercise the spec did not name: `unbounded_numbers()`, an audit that walks the
#    finished report and names every numeric leaf that carries neither an interval nor a
#    documented licence to be bare. The spec's artefact requirement — "every number carries its
#    uncertainty" — is otherwise a property nobody checks. Making it executable also forces the
#    lesson to be explicit about the three kinds of number that legitimately have no interval
#    (counted on data we hold, declared as policy, or derived from intervals already reported),
#    which is the distinction the module is really about. `EXACT_QUANTITIES` is that list, with
#    its three reasons written above it.
#
# 3. The extraction analysis MEASURES the query budget rather than assuming one. MODULES.md
#    asked for "a rate-limiting analysis for model extraction". A rate limit is only a control
#    once you know what the model is worth, so the lesson fits label-only least-squares
#    surrogates at ten query budgets and reports the budget at which surrogate agreement
#    reaches 0.95 — as an interval, with the direction of the bound FLIPPED relative to a
#    performance claim: for your own metric you declare the bound you can defend, for somebody
#    else's attack you plan against the bound that favours them. This is the sharpest graded
#    subtlety in the cybersecurity third and the rubric separates the two readings explicitly.
#
# 4. The honest finding the measurement produces is that rate limiting is the WRONG control
#    here. A four-feature linear scorer is worth about 130 queries on the attacker-favourable
#    reading; buying 90 days would need a limit of one query a day, which is not a service. The
#    lesson prints that conclusion, computed, and says in the same breath that a real model with
#    hundreds of features would move the number by orders of magnitude — which is why it is
#    measured per system rather than quoted from a paper. Self-check question 3 is about exactly
#    this, because the tempting wrong answers are to obey the arithmetic or to discard the
#    measurement.
#
# 5. `MIN_SUPPORT` is 30 rows, the same floor P01-L04 used for its subgroup bias probe, and the
#    poisoning scan meets the same trap on purpose: batch b09 is 20 rows with half its labels
#    flipped, the loudest rate in the table and the least examinable. It is reported as
#    `insufficient_support` and still NAMED. Reusing the prerequisite's rule and vocabulary
#    rather than inventing a second one was a deliberate choice; a programme whose modules
#    disagree with each other teaches nobody.
#
# 6. Two simplifications against the spec, declared rather than hidden. The severity grids are
#    per family and are NOT comparable across families — one is a share of rows, another a
#    multiple of a standard deviation — so every curve carries its own unit and the report
#    prints it, instead of the single comparable severity axis the spec's phrasing implies.
#    And the bootstrap DRAW is part of the contract: the docstring requires the whole
#    (n_boot, n) index matrix in one `rng.integers` call from `default_rng(seed)`, so two
#    machines produce identical intervals. That rules out a statistically equivalent
#    loop-per-replicate implementation, which is a real restriction; it is taken because an
#    evidence pack whose intervals move between machines is not evidence, and because the
#    crossing severities on this fixture sit within 0.004 of the floor, close enough that
#    Monte Carlo noise between two draws could move a reported crossing by a whole grid step.
#
# DEPENDENCIES. Standard library plus numpy. No pyyaml, no assets directory, no network, no
# disk reads. The declared data set is generated inside lesson.py section 3 from one seed.
#
# BUDGET. Declared cpu8 / 90 s. The bootstrap is vectorised: one (n_boot, n) gather per
# measurement, never a Python loop over replicates. B is 2000 for the three headline metrics,
# 500 for the 24 sweep points (the sweep needs the shape of a curve, not a headline) and 1500
# for the poisoning and extraction work. The k-nearest-neighbour scan uses the expanded squared
# distance rather than a 3-D broadcast, which keeps the 2000-row matrix at about 32 MiB rather
# than 128. Measured figures at the foot of this file.
#
# SYNC between lesson.py and solutions/lesson_solution.py is mechanical, not manual: both are
# GENERATED from one master by substituting the nine stub bodies, so the two cannot drift in
# their prose, their public checks or their fixture. The solution additionally carries a banner
# cell and section 16a, the self-check answers. The self-check key in lesson.py is salted
# SHA-256 digests, so no answer is readable off the student's own page. Answers are 1c, 2b, 3d,
# 4a, 5c — five questions, four distinct letters, not all the same.
#
# RUBRIC MUTATION TESTING. 21 plausible-wrong variants of the reference solution were built in
# a temporary directory outside the lesson tree and graded through tools/grade.py, plus THREE
# controls that are differently-shaped RIGHT answers and must still score 100%. Results and the
# defects they found are recorded in the mutation notes below.
#
# WHAT COULD NOT BE VERIFIED. The extraction interval is a percentile bootstrap over the pooled
# (attack draw x evaluation point) match indicators. That treats the six attacker draws at each
# budget and the 1200 evaluation points as one exchangeable population, which understates the
# attacker-draw component of the uncertainty: matches within one attack are correlated and a
# cluster bootstrap over attacks would be the stricter treatment. Six clusters is too few for a
# percentile bootstrap over clusters, so the lesson takes the pooled reading and names the
# limitation in section 11 and in the residual-risk catalogue rather than hiding it. Nothing in
# the lesson claims the interval covers the attacker's luck in choosing query points.
#
# OPEN FOR THE OWNER, no action taken here:
