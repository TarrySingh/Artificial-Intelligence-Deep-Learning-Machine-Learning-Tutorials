#     "specified". It should become BUILT, cpu8, with the measured figures at the foot of this
#     file and "132 pts / 32 cases". The MODULES.md prose section 6 describes this lesson
#     accurately and needs no change beyond the four deliberate differences noted above.
#   * The evidence id this module fills, accuracy_robustness_cybersecurity_report, is already
#     declared in lessons/T10-L01-ai-act-conformity-pack (HIGH_RISK_CORE_EVIDENCE, Article 15).
#     Nothing needed there.
#   * flagship F09 matches the rest of the programme; flagships/ still holds no F09 directory.
#   * P01-L05 (human oversight) and P01-L07/L08 were being built concurrently by other agents
#     while this lesson was written; their directories appeared during the run and nothing here
