id: P01-L04-data-governance
title: Implement the executable data-governance checks an Article 10 record implies, each one carrying
  the smallest effect it could have detected
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
objectives:
- Implement the exact rule-of-three share floor and the two-proportion minimum detectable difference,
  and attach one power statement to every verdict the lesson emits
- Implement a leakage check that finds exact and re-entered duplicates across splits and an identifier
  that predicts the target, and state the precision at which it stops seeing them
- Implement a representativeness check against a declared population that reports the stratum the data
  holds and the declaration never mentioned, and emit the Article 10(2)(h) gap report with a remedy per
  gap
- Implement train-versus-test drift over categorical and numeric features, taking the categorical distance
  over the union of categories rather than over one split's
- Implement a subgroup bias probe with a minimum-support rule, and explain why a 100% error rate on three
  rows is reported as insufficient support rather than as the system's worst disparity
before_you_start:
  assumed:
  - compute a proportion and its standard error, and say what a 95% confidence interval for it means
  - explain what training, validation and test splits are for, and what happens to a test score if the
    splits share rows
  - use numpy arrays and collections.Counter to count categories and compute shares
  resources:
  - title: 'AI Act Article 10: Data and data governance'
    by: European Commission, AI Act Service Desk
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-10
    kind: free
    why: 'paragraph 2 (the governance practices, from origin and labelling to bias examination and gaps)
      and paragraph 3 (relevant, representative, free of errors): the checks the lesson codes'
  - title: OpenIntro Statistics
    by: OpenIntro (Diez, Cetinkaya-Rundel, Barr)
    url: https://www.openintro.org/book/os/
    kind: free
    why: 'chapters 5 and 6: confidence intervals for a proportion and the difference of two proportions,
      the maths behind the lesson''s share floor and minimum detectable difference'
  - title: 'scikit-learn: Common pitfalls and recommended practices'
    by: scikit-learn developers
    url: https://scikit-learn.org/stable/common_pitfalls.html
    kind: free
    why: section 12.2 on data leakage, including leakage through preprocessing before the split, the failure
      the leakage check hunts for
  - title: 'Fairness and Machine Learning: Limitations and Opportunities'
    by: Barocas, Hardt and Narayanan (MIT Press, free online)
    url: https://fairmlbook.org/classification.html
    kind: free
    why: 'the Classification chapter: group-wise error rates and the separation criterion, the quantities
      the subgroup bias probe compares'
  - title: 'Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift'
    by: Rabanser, Günnemann and Lipton (NeurIPS 2019, arXiv)
    url: https://arxiv.org/abs/1810.11953
    kind: free
    why: 'how to test whether a test set still looks like the training set, feature by feature or in aggregate:
      the idea behind the drift check'
datasets:
- name: loan-copilot synthetic application table
  kind: synthetic
  licence: n/a — generated inside lesson.py, not distributed and not derived from any real data set
  url: ''
  note: 2400 rows across three splits, built in section 2 from a single numpy Generator seed (20271202)
    and explicit per-stratum counts. Nothing is read from disk and nothing is downloaded, so the lesson
    runs offline and two runs agree to the last digit. Every defect it contains — the empty stratum, the
    thin one, the over-represented one, the undeclared one, the twenty duplicated test rows, the back-filled
    identifier, the unapproved label method and the three-row subgroup — is planted deliberately and documented
    in the authoring notes below. No real applicant data is involved, and none of the figures the lesson
    prints is a claim about any real credit portfolio.
points: 101
status: reviewed
measured_seconds: 0.2
measured_peak_mib: 37
