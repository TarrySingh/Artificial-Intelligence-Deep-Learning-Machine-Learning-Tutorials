id: P01-L04-data-governance
title: Implement the executable data-governance checks an Article 10 record implies, each one carrying
  the smallest effect it could have detected
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
objectives:
- Implement the exact rule-of-three share floor and the two-proportion minimum detectable difference,
  and attach one power statement to every verdict the lesson emits
- Implement a leakage check that finds exact and re-entered duplicates across splits and an identifier
  that predicts the target, and state the precision at which it stops seeing them
- Implement a representativeness check against a declared population that reports the stratum the data
  holds and the declaration never mentioned, and emit the Article 10(2)(h) gap report with a remedy per
  gap
- Implement train-versus-test drift over categorical and numeric features, taking the categorical distance
  over the union of categories rather than over one split's
- Implement a subgroup bias probe with a minimum-support rule, and explain why a 100% error rate on three
  rows is reported as insufficient support rather than as the system's worst disparity
datasets:
- name: loan-copilot synthetic application table
  kind: synthetic
  licence: n/a — generated inside lesson.py, not distributed and not derived from any real data set
  url: ''
  note: 2400 rows across three splits, built in section 2 from a single numpy Generator seed (20271202)
    and explicit per-stratum counts. Nothing is read from disk and nothing is downloaded, so the lesson
    runs offline and two runs agree to the last digit. Every defect it contains — the empty stratum, the
    thin one, the over-represented one, the undeclared one, the twenty duplicated test rows, the back-filled
    identifier, the unapproved label method and the three-row subgroup — is planted deliberately and documented
    in the authoring notes below. No real applicant data is involved, and none of the figures the lesson
    prints is a claim about any real credit portfolio.
points: 101
status: reviewed
