#     starts at seq 0, where the two are identical. On a quarter's slice of a continuing log
#     starting at seq 500 and already in clock order, the documented comparison gives 0 and
#     the positional one gives 4: every row reported out of sequence on a feed in perfect
#     order. That is the exact failure the author's own assertion ("a count that is never
#     zero is not a measurement") was written to catch, defeated by a 0-based feed. Two
#     hidden cases on a seq-500 slice now pin it.
