#     or on 10**9 and the two forms agree there; at 0.0 the assertion was a loose `>`, which
#     both forms satisfy. At tolerance 4.0 - a deviation the feed DOES contain - `>` reports
#     4 suspect pairs and `>=` reports 26. The docstring says "exceeds", so `>=` is wrong and
#     visibly so. A hidden case at that tolerance now separates them.
#   * `merge_deployer_feed` could compute `out_of_seq_rows` by comparing each `src_seq`
#     against its POSITION in the merged list rather than against the same rows sorted by
