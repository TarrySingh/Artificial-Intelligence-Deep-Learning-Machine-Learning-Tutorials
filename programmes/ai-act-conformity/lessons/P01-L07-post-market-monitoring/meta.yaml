id: P01-L07-post-market-monitoring
title: Build the Article 72 monitoring feed and the Article 73 incident clock, and price both ways of getting the alert threshold wrong
track: P01
programme: ai-act-conformity
flagship: F09           # flagship id this lesson feeds, or empty
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T10-L01-ai-act-conformity-pack
  - P01-L01-article-12-logging
objectives:
  - "Implement p-chart control limits from a declared baseline window, and measure what the same limits become when they are refitted over the period that contains the breach"
  - "Implement a tumbling-window monitor that cuts its windows on the log's sequence number rather than its timestamps, drops the incomplete tail, and confirms an excursion over a run before it pages"
  - "Measure both costs of a mis-tuned monitor on one feed — the pages raised for nothing, which mute it, and the degraded windows nobody saw — and find the limit width that minimises their sum"
  - "Implement a deployer-ingest path that estimates the clock offset by median rather than mean, reports its residual spread, and merges without counting the overlap twice"
  - "Implement the Article 73 classifier and its clock, starting every deadline at awareness rather than occurrence, and explain why a point 3(49)(c) infringement does not get the two-day deadline"
datasets:
  - name: loan-copilot synthetic provider log and partner deployer feed
    kind: synthetic
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    note: >-
      1717 provider rows and 160 deployer rows, built in section 2 from a single numpy
      Generator seed (20270302) and an explicit per-window error count. Nothing is read from
      disk and nothing is downloaded, so the lesson runs offline and two runs agree to the
      last digit. Every defect it contains - the three rising wobbles that are not faults,
      the five-window degradation, the thirty decisions a broken exporter flushed ten days
      late, the deployer clock two hours and seven minutes ahead, the four rows re-exported a
      day out, the sixty decisions the provider never logged and the seventeen-row incomplete
      tail - is planted deliberately and documented in the authoring notes below. The eight
      incident candidates in section 8 are fictional and none of them describes any real
      event, system, provider or deployer.
points: 109             # = sum of RUBRIC points in tests/test_lesson.py
status: reviewed        # draft | executed | reviewed | shipped
# Authoring notes, 2026-09-23.
#
# STATUS was `executed` with `reviewed_by` EMPTY when this lesson was authored. Both were
# promoted together on 2026-09-23 by the independent reviewer, whose own findings are in the
# REVIEW block at the foot of these notes.
#
# The measured figures at the foot of this file were written back by tools/execute.py and
# were not typed.
#
# WHAT MODULES.md MODULE 7 ASKED FOR. A windowed monitor computing "the module 6 metrics"
# over rolling windows and raising on a control-limit breach; a deployer ingest path that
# merges an external feed and reconciles the two clocks, with the module 1 clock-skew entry
# returning at scale; an incident classifier with the Article 73 clock starting at awareness;
# and, as the graded subtlety, the difference between a drifting metric and an incident plus
# the cost of getting it wrong in each direction. The artefact was to be a monitoring plan
# with computed control limits and an incident log with clocks. All of that is built.
#
# WHAT WAS DONE DIFFERENTLY, AND WHY.
#
#  1. Module 6 is SPECIFIED - NOT BUILT, so there are no "module 6 metrics" to window. The
#     lesson monitors one metric it defines itself - the share of decisions later found
#     wrong - and says so. Nothing here depends on module 6 existing; when it is built, its
#     accuracy metric drops into the same windowing machinery unchanged, which is why
#     `windowed_monitor()` reads only `row["wrong"]` and `row["seq"]`.
#  2. TUMBLING windows, not rolling ones. MODULES.md says "rolling windows". Overlapping
#     windows make one excursion arrive `window_size` times, turn the run rule into a
#     different exercise about autocorrelation, and make the cost model incoherent, because
#     a single degradation is then counted once per overlapping window. Non-overlapping
#     windows teach the same thing - a window size is a decision with a cost - and keep the
#     cost arithmetic honest. This is a deliberate deviation, stated in the notebook's own
#     prose rather than hidden.
#  3. The module 1 clock callback is a BUFFERED FLUSH rather than a clock that stepped
#     backwards. P01-L01 already taught the backwards clock on fourteen events; repeating it
#     would have been a re-run rather than a return "at scale". Thirty decisions written ten
#     days late is the same lesson - sequence numbers are the authority, timestamps are not -
#     in the shape a monitoring feed actually meets it, and it moves two whole windows rather
#     than reordering one decision.
#  4. The cost model has a THIRD term MODULES.md did not ask for: after SWITCH_OFF_AFTER
#     false pages the monitor is muted, and everything after that is missed. Without it a
#     linear cost makes an over-sensitive monitor merely noisy, and the brief's own sentence
#     - "switched off within a month" - is not modelled at all. With it, the tightest setting
#     in the k sweep is the most expensive row in the table, which is the point.
#  5. Seven stubs rather than the three parts the spec names, because the clock estimate and
#     the merge fail in different ways: grading them as one function would let a correct
#     median hide a double count.
#  6. The ground-truth set of degraded windows is a property of a FIXTURE and the notebook
#     says so in the same sentence that introduces it. A live monitor has no such set, which
#     is why the cost model is presented as a design-time exercise against a fixture or a
#     replay, not as something to run in production.
#
# THE READING THE LESSON FLAGS AS A READING. Article 113 as amended lists the provisions that
# do not apply from 2 August 2026, and Chapter IX - Articles 72 and 73 - is not among them.
# Section 1 reads that silence as meaning the monitoring and incident duties run from the
# general date while the Chapter III requirements they reference run from 2 December 2027 and
# 2 August 2028. That is an argument from a list's silence, not a ruling; the notebook says
# so in those words and claims.yaml labels it. No transitional provision in Article 111, no
# guidance and no case law was consulted on the point.
#
# THE MODELLING CHOICE THE REGULATION DOES NOT MAKE. Article 73(3) and 73(4) each say
# "notwithstanding paragraph 2", and neither says what happens to an incident that is both a
# death and an Article 3(49)(b) critical-infrastructure disruption. The lesson takes the
# SHORTER deadline, and candidate I-06 is built to force the student to meet the question.
# The notebook and claims.yaml both say this is the lesson's reading rather than the
# Regulation's.
#
# WHAT COULD NOT BE VERIFIED. EUR-Lex refuses automated retrieval, so no article quotation in
# claims.yaml was taken from the Official Journal directly. Every one was retrieved from
# euaiact.com - which states, per article, whether that article is as adopted or as amended
# by Regulation (EU) 2026/1744, and that it has been checked against the consolidated text on
# EUR-Lex - and compared word for word against an independent reproduction at ai-act-law.eu
# or artificialintelligenceact.eu. Both were retrieved on 2026-09-22 and agree. TWO
# exceptions, both recorded in the claim entries themselves: the SUPERSEDED wording of
# Article 72(3) rests on one source, artificialintelligenceact.eu, which prints the
# pre-amendment sentence beside the current one and marks it "amended"; and no source was
# found stating whether any authority has construed Chapter IX's application date, so the
# lesson infers it and labels the inference.
#
# DEPENDENCIES. Standard library plus numpy. numpy is used only to place the planted errors
# deterministically inside each window; every graded function is plain Python, `statistics`
# and `datetime`, so a student can read the arithmetic without a vendor's toolkit between
# them and the evidence. No pyyaml, no assets directory, no network, no disk reads.
#
# SYNC BETWEEN lesson.py AND solutions/lesson_solution.py is mechanical, not manual: the
# solution is GENERATED from the notebook by substituting the seven stub bodies, so the two
# cannot drift in the prose, the public checks or the fixture. The solution additionally
# carries a banner cell and section 12a, the self-check answers. The self-check key in
# lesson.py is salted SHA-256 digests, so no answer is readable off the student's own page,
# and the five answers are c, b, d, c, a - not all the same letter.
#
# GATE 12. Every figure in the notebook's prose is printed by code: the 7.5x spread between
# the shortest and the longest Article 73 deadline, the refit's effect on both the upper limit
# and the alert list, the dropped tail's rate as a multiple of the limit, the number of
# windows that timestamp ordering moves, the whole k sweep and its cheapest row, the
# mean-versus-median clock error in minutes, the understatement a double count causes, the
# number of verdicts each wrong clock flips, and the gap in hours between the monitor's
# confirmation and the recorded awareness, and - added at review - the SIZE of the batch a
# broken exporter flushed late and how late it was, both measured against the feed's own
# nominal cadence rather than read off the constant that planted them. The only integers
# typed into prose are the deadlines themselves - 15, 2 and 10 days - which are quoted law
# and are in claims.yaml with their sources.
#
# GATE 3. The generated notebook is 54 cells. The longest prose run before the next runnable
# cell is the section 12 self-check question list; every expository cell is well under 40.
# The author's figure of 45 was counted on the .py SOURCE, which counts a blank line inside a
# markdown cell as the comment marker `#`. Measured on the notebook jupytext actually emits -
# which is what a student reads - the worst run is 39 lines, so the gate is met outright and
# the P01-L04 exception is not needed after all. Re-measured at review, 2026-09-23.
#
# RUBRIC MUTATION TESTING. 33 plausible-wrong variants of the reference solution were built
# in a temporary directory outside the lesson tree and graded through tools/grade.py, plus
# THREE controls that are differently-shaped RIGHT answers and must still score 100%: one
# windowing with an index loop and a numpy sum instead of slicing and a generator; one
# computing the median and the MAD by hand-rolled sorting instead of through `statistics`;
# and one rewriting `classify_incident` as a ladder of guards with the widespread test and
# the point-(b) test in the other order.
#
# The FIRST run caught 30 of 33 and found three real rubric defects, each of which scored a
# full 109/109 because the fixture and the hand-built cases were one-sided:
#
#   * `missed_windows` could IGNORE the mute entirely. Every muting case in the rubric muted
#     the monitor before any true alert, so `first_detection` was None and every degraded
#     window was missed for the other reason. A case where the monitor detects at window 2,
#     is then muted at window 6 by three false pages, and degrades again at 8 and 9 now
#     separates them - and it is the case that carries the lesson's whole argument, because
#     it is the one where a muted monitor's later blindness is the entire bill.
#   * The merge could sort by TIMESTAMP ALONE. No two rows in the feed share a timestamp, so
#     the documented `(ts, decision_id)` tie-break was never exercised and Python's stable
#     sort made the two agree. Three rows built on one timestamp now pin the order.
#   * `hours_remaining` could use `int()` instead of `math.floor()`. Every deadline in the
#     fixture falls on a whole hour, so truncation towards zero and towards minus infinity
#     agreed everywhere. A deadline that fell THIRTY MINUTES ago now separates them: `int()`
#     reports 0, which an inspector reads as "due now" rather than "already missed".
#
# After the three fixes: 33 mutants, all 33 lost points (scores 72% to 98%), every one
# keeping partial credit on the exercises it had not broken, so no test collapsed into
# all-or-nothing; and all three controls still score 100%. Points are unchanged at 109 across
# 30 tests; no test was added, only three existing ones given another hidden case.
#
# ONE FURTHER VARIANT was measured separately and is reported here rather than counted above,
# because it is not a defect: in `monitor_costs`, `if false_seen == switch_off_after` in
# place of `>=`. The loop breaks on the alert at which the counter reaches the threshold, so
# the counter can never pass it, and the two conditions were measured identical over 50,000
# random (alerts, degraded, switch_off_after) triples with switch_off_after >= 1, and on the
# lesson's own feed at all seven k values crossed with switch_off_after 1, 2, 3 and 99. They
# DIFFER only at switch_off_after = 0 - "mute after no false alerts at all" - where the
# reference mutes on the first false page and the variant never mutes. No rubric test was
# added for that, because the right behaviour at 0 is undefined rather than known, and
# grading an undefined case would be grading the author's accident.
#
