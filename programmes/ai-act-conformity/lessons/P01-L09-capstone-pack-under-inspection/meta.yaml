#
# EIGHT survivors were proved EQUIVALENT over this lesson's input domain and were NOT
# "fixed" — inventing a test for each would have rejected correct work:
#   * run_suite iterating `suite` instead of `sorted(suite)`: changes only the insertion
#     order of the `results` dict. Nothing reads it — inspect_pack re-sorts on a total key,
#     the rubric compares results by dict equality, and the buckets are sorted separately.
#   * run_suite testing `cid not in checks` before `enabled`: differs only for a check that
#     is BOTH disabled and unimplemented. No suite in the domain has one: every SUITE row is
#     in CHECKS, disable_check only flips a flag, and no operation adds a suite entry.
#   * inspect_pack returning detail["keys"] unsorted: every branch of every check emits keys
#     already sorted — [], a one-element literal, sorted(set(...)), or a comprehension over
#     `for name in sorted(declarations)`. True by construction, not just on these two packs.
#   * suite_delta using `<=` / `>=` instead of `<` / `>`: the equality case is filtered by
#     the preceding `continue`, so the branch is only ever reached with after != before.
#   * plan_repairs demanding the cold-store segment CONTAIN the hole rather than overlap it:
#     each export's "covers" range either holds the whole purged window or misses it
#     entirely, in the shipped pack and in the rubric's variant.
#   * plan_repairs dating the reassessment AS_OF instead of max(AS_OF, latest_substantial):
#     every substantial modification in both packs precedes the inspection date, and the
#     contract asks only for a date no earlier than the modification.
#   * plan_repairs re-sourcing only detail_rows["empty"] and not ["missing"]: no unsourced
#     section in either pack reports a missing path — the path resolves and is empty, which
#     is what the docstring itself describes.
#   * inspection_report counting len(after_run["results"]) for "checks": no operation adds
#     or removes a suite entry, so the two runs always cover the same checks.
#
