# Authoring notes, 2026-09-23.
#
# All four gates were run from the repo root on the venv interpreter. The measured figures at
# the foot of this file were written back by tools/execute.py and were not typed.
#
# WHAT MODULES.md ASKED FOR (module 9, the capstone). "A complete evidence pack for a
# fictional system is handed to the student - already assembled, already green - along with
# an inspector's question list. Six of the artefacts are wrong in ways the earlier modules
# taught them to detect: a log with a purged window, a document section generated from an
# empty source, an accuracy figure with no interval, an oversight record where one reviewer
# approved 400 cases in an hour, a declaration emitted after a substantial modification, and
# a monitoring feed whose control limits were recomputed after the breach. The student's job
# is to find all six with the tools they built, write the findings, and then fix the pack so
# that every check they wrote comes back green for the right reason. The rubric grades the
# findings, the fixes, and - the part that matters - whether any of their 'fixes' merely
# silenced a check. Artefact: an inspection report and a repaired pack."
#
# All six defects are built, in that order of reading:
#   1. log            seqs 181-194 removed by a retention job; the 14 entries survive in the
#                     cold-store export-2026-05-14, and the published anchor still belongs to
#                     the whole log, so a re-chain around the hole is caught by it.
#   2. document       the metrics artefact carries primary_metric "accuracy" and
#                     primary_metric_value "", and Annex IV section 4 was emitted anyway.
#   3. accuracy       the accuracy declaration is {"point": 0.9025} with no lo, hi, level, n,
#                     n_boot or method, so P01-L06's declare() refuses it.
#   4. oversight      u:pieter's 400 verifications, 9 seconds apart inside one clock hour,
#                     each 8 seconds long - so the per-review floor AND the throughput
#                     ceiling both fire, and neither alone is the finding.
#   5. declaration    C-0031 modifies the intended purpose on 2026-07-02; the assessment on
#                     file is dated 2026-05-20 and the declaration was issued 2026-08-14.
#   6. monitoring     the limits in the pack were fitted over windows 0-33, which contain the
#                     five-window excursion at 26-30; the baseline sealed in the ledger is
#                     windows 0-15. The refit hides exactly those five windows.
#
# THE PART THAT MATTERS, and where the effort went. "Whether any of their fixes merely
# silenced a check" is graded three ways, none of which trusts the repairer:
#   * evidence_delta (exercise 3) - what the repair removed. Deleting the failing records.
#   * suite_delta (exercise 4) - what the repair did to the checks. Widening a tolerance,
#     switching a check off, dropping a parameter, deleting a check from the suite. The
#     graded subtlety here is the OTHER error: tightening is not silencing, and an audit
#     that flags it is ignored within a month.
#   * unsupported_values (exercise 5) - which numbers no longer reproduce from the evidence
#     they cite. It recomputes the bootstrap interval, the document section against its
#     artefact, the control limits against the sealed baseline and the ledger chain, and it
#     never reads pack["repair_ledger"], because the repair ledger is the repairer's own
#     account of the repair and this is the function that tests it.
#   * silencing_audit (exercise 6) joins the three, plus a fourth signal the three deltas
#     make possible: evidence the repair changed that the finding never named. That is what
#     catches the re-chained log, which removes nothing, renumbers the 246 entries after
#     the hole and republishes the anchor over them.
# Section 12 prints five repairs that each turn a red check green and fix nothing, with the
# audit's verdict beside each; section 15 prints two packs that are both 6/6 green, one
# accepted and one rejected. A student who deletes the failing record, widens a tolerance or
# stops calling a check reaches both tables and sees the word "silenced" against their own
# work, and the rubric's exercise-7 tests fail them on removals, on suite edits and on
# numbers that do not reproduce - separately from whether the checks went green.
#
# DELIBERATE DEVIATIONS FROM THE SKETCH, and why.
#   * The toolkit of modules 1 to 8 is GIVEN BACK in section 2 rather than re-derived. A
#     capstone that makes the student write verify_chain again is module 1 again. The names
#     and the record shapes are the earlier modules' own: verify_chain, missing_seq (which is
#     retention_status()["missing_seq"]), field_value, is_sourced, check_section, declare,
#     DECLARATION_KEYS, UndeclarableMetricError, bootstrap_ci, control_limits,
#     windowed_monitor, is_substantial_modification and its five REASON_ constants.
#   * Two shape changes, both forced by the same requirement: this lesson copies, hashes and
#     diffs whole packs, so the pack has to be JSON all the way down. P01-L03's Artefact
#     NamedTuple is a plain dict here, and P01-L01's ChainVerdict NamedTuple is a plain dict.
#     Behaviour and field names are unchanged.
#   * P01-L05's time_to_decision() is not reused as a function. Its idea - a floor below
#     which nobody read the case - is applied to throughput as well, because "400 cases in an
#     hour" is a rate and not a duration. CHECK_META names it as "time_to_decision, applied
#     to throughput" rather than pretending it is the same call.
#   * MODULES.md says "the tools they built in modules 1 to 8" would be used to FIND the six.
#     They are: every one of the six checks in section 4 is a call into that toolkit, and the
#     student's own work starts at reading what the checks say. The alternative - eight more
#     re-implementations - would have made the capstone the longest and least novel lesson in
#     the programme.
#   * The repair is expressed as a list of OPERATIONS applied by a given apply_repairs()
#     rather than as free-hand edits to the pack. That is what makes silencing measurable at
#     all: seven of the seventeen operations change the check rather than the world, they are
#     in the vocabulary on purpose, and the student is free to reach for them.
#   * The two-step repairs (void then withhold; refit then file) are deliberate. Each has a
#     halfway point where the check goes red with a DIFFERENT reason code, which the audit
#     calls "unfixed" - and the lesson says in the open that unfixed is a better place to be
#     than green.
#
# ANTI-HARDCODING. tests/test_lesson.py builds a variant pack with the same six defects in
# different places: the purge is at seqs 301-312 and exported on a different night, thirty
# more reviews are implausible, a second change becomes substantial, and the document section
# is about recall rather than accuracy. A plan_repairs that reads its findings passes it; one
# that remembers this notebook does not. Exercises 6 and 8 are graded almost entirely on
# hand-built inputs for the same reason.
#
# WHAT I COULD NOT VERIFY.
#   * EUR-Lex refuses automated retrieval, as it did for P01-L01 and P01-L07. Every article
#     quotation in claims.yaml was taken from euaiact.com and compared word for word against
#     the independent reproduction at ai-act-law.eu; both state they are checked against the
#     consolidated EUR-Lex text, and the authoritative URL is recorded beside each claim. I
#     did not read the Official Journal PDF.
#   * Nothing in this lesson depends on the Regulation (EU) 2026/1744 amendments that
#     P01-L07 records. The six duties it checks are quoted from the articles as they stand on
#     the access date, and no claim is made about text that has not yet been adopted.
#   * The thresholds - a 10-second plausibility floor, 60 reviews an hour, a 0.95 minimum
#     declared level, k = 3.0, the precedence of "silenced" over "unfixed" and the whole
#     repaired/silenced/unfixed ladder - are this lesson's modelling choices. They are
#     labelled as such in the lesson and in CHECK_META, and no authority is claimed for them.
#
# MUTATION TESTING, run before this was declared done. 22 plausible-but-wrong
# implementations of my own solution were graded against this rubric; all 22 lost points,
