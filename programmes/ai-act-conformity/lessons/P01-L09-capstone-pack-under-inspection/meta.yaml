#   * "the document section always cites accuracy" scored 100%. The traceability rule in
#     unsupported_values only asked whether the value's stamp matched SOME declaration in
#     the pack, so a real number filed under the wrong metric passed. Fixed in the lesson,
#     not in the rubric: the stamp must now match the declaration of the metric the artefact
#     itself names in "primary_metric", and the variant pack (whose section is about recall)
#     catches it.
# The 20 caught first time span every exercise: a disabled check reported green; a verdict
# that ignores unverified checks; findings that skip the not_run ones; findings ranked by
# count rather than share; findings with no evidence keys; a delta that walks only the
# before-families; a delta that skips a parameter which vanished; a suite delta that calls
# every change a loosening; an interval compared on the point alone; a declaration taken on
# trust because it carries a seed; an unverified ledger chain; a not_run check filed as
# unfixed; an audit that flags every mutation; one that flags none; one that lets another
# check's loosened parameter silence this one; a plan that restores the first cold-store
# segment; one that voids without withholding; one that refits without filing; one that
# deletes the records instead of voiding them; and a report whose verdict precedence is
