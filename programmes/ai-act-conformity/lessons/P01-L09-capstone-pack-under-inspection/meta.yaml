id: P01-L09-capstone-pack-under-inspection
title: Inspect a complete, already-attested conformity pack with the tools of modules 1 to 8, repair it,
  and measure whether any of the repairs merely silenced a check
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
- P01-L02-risk-classification
- P01-L03-annex-iv-documentation
- P01-L04-data-governance
- P01-L05-human-oversight
- P01-L06-accuracy-robustness-security
- P01-L07-post-market-monitoring
- P01-L08-conformity-assessment-route
objectives:
- Implement a suite runner with three statuses, and explain why a check nobody ran is reported as unverified
  rather than as passed
- Implement findings ranked by the share of the evidence each defect puts in doubt, and measure why a
  check that did not run ranks above four hundred bad reviews
- Measure what a repair did to the evidence, to the checks and to the numbers, as three independent diffs,
  two of which never read the repairer's own account of the repair
- Implement the audit that separates repaired from silenced from unfixed, and run it against five repairs
  that turn a red check green and change nothing about the system
- Plan the honest repair as operations against the pack, and measure that every check goes green with
  no evidence removed, no threshold moved and no number that fails to reproduce
before_you_start:
  assumed:
  - run a lesson's functions on a fixture and read their structured output without opening their source
  - read and walk nested dict records in Python
  - explain what a hash digest of a document proves, and what it does not prove about whether the document
    is true
  resources:
  - title: 'Closing the AI Accountability Gap: Defining an End-to-End Framework for Internal Algorithmic
      Auditing'
    by: Raji et al. (FAT* 2020, arXiv)
    url: https://arxiv.org/abs/2001.00973
    kind: free
    why: 'the audit stages from scoping to reflection and the artefacts each produces: the shape of the
      inspection the capstone has you carry out'
  - title: Categorizing Variants of Goodhart's Law
    by: Manheim and Garrabrant (arXiv)
    url: https://arxiv.org/abs/1803.04585
    kind: free
    why: why a check turned green by optimising the check is not the same as a system made safe, the failure
      the repaired-versus-silenced audit looks for
  - title: Artificial Intelligence Risk Management Framework (AI RMF 1.0)
    by: NIST
    url: https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-ai-rmf-10
    kind: free
    why: free PDF; sections 5.3 Measure and 5.4 Manage on testing, evidence and documented residual risk
      (MANAGE 1.4), a second lens on what the inspector asks for
  - title: 'Regulation (EU) 2024/1689 (the AI Act): official text'
    by: European Parliament and Council, EUR-Lex
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng
    kind: free
    why: the original 2024 text, without the Digital Omnibus (EUR-Lex links the consolidated version);
      Chapter III Section 2 (Articles 8 to 15) holds the requirements the pack evidences
  - title: 'The EU Artificial Intelligence Act: A Commentary'
    by: Michèle Finck (Oxford University Press, 2026)
    url: https://academic.oup.com/oxford-law-pro/book/62212
    kind: paid
    why: 'per the publisher an article-by-article commentary; its contents page was not checkable, so
      no entry numbers are given: look up Articles 8 to 15 and 43'
datasets:
- name: loan-copilot synthetic conformity pack
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: One evidence pack of 4962 indexed items - 427 chained log entries and a 14-entry cold store, 9
    Annex IV sections over 9 typed artefacts, 3 declared metrics over a retained 1200-row evaluation split,
    1400 oversight decisions with 1400 verifications, 1700 monitored decisions in 34 windows, 7 logged
    changes and a 3-entry hash-chained ledger - all built in section 3 of lesson.py from a single numpy
    Generator seed (20260923) and explicit per-window counts. Nothing is read from disk and nothing is
    downloaded, so the lesson runs offline and two runs agree to the last hash. Every defect it contains
    is planted deliberately and listed in the authoring notes below. No real provider, system, reviewer,
    notified body or applicant is involved, and none of the figures the lesson prints is a claim about
    any real credit portfolio or any real conformity assessment.
points: 138
status: reviewed
measured_seconds: 2.5
measured_peak_mib: 62
