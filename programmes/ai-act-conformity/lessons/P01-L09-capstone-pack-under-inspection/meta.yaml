id: P01-L09-capstone-pack-under-inspection
title: Inspect a complete, already-attested conformity pack with the tools of modules 1 to 8, repair it, and measure whether any of the repairs merely silenced a check
track: P01
programme: ai-act-conformity
flagship: F09           # flagship id this lesson feeds, or empty
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T10-L01-ai-act-conformity-pack
  - P01-L01-article-12-logging
  - P01-L02-risk-classification
  - P01-L03-annex-iv-documentation
  - P01-L04-data-governance
  - P01-L05-human-oversight
  - P01-L06-accuracy-robustness-security
  - P01-L07-post-market-monitoring
  - P01-L08-conformity-assessment-route
objectives:
  - "Implement a suite runner with three statuses, and explain why a check nobody ran is reported as unverified rather than as passed"
  - "Implement findings ranked by the share of the evidence each defect puts in doubt, and measure why a check that did not run ranks above four hundred bad reviews"
  - "Measure what a repair did to the evidence, to the checks and to the numbers, as three independent diffs, two of which never read the repairer's own account of the repair"
  - "Implement the audit that separates repaired from silenced from unfixed, and run it against five repairs that turn a red check green and change nothing about the system"
  - "Plan the honest repair as operations against the pack, and measure that every check goes green with no evidence removed, no threshold moved and no number that fails to reproduce"
datasets:
  - name: loan-copilot synthetic conformity pack
    kind: synthetic
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    note: >-
      One evidence pack of 4962 indexed items - 427 chained log entries and a 14-entry cold
      store, 9 Annex IV sections over 9 typed artefacts, 3 declared metrics over a retained
      1200-row evaluation split, 1400 oversight decisions with 1400 verifications, 1700
      monitored decisions in 34 windows, 7 logged changes and a 3-entry hash-chained ledger
      - all built in section 3 of lesson.py from a single numpy Generator seed (20260923)
      and explicit per-window counts. Nothing is read from disk and nothing is downloaded,
      so the lesson runs offline and two runs agree to the last hash. Every defect it
      contains is planted deliberately and listed in the authoring notes below. No real
      provider, system, reviewer, notified body or applicant is involved, and none of the
      figures the lesson prints is a claim about any real credit portfolio or any real
      conformity assessment.
points: 138             # = sum of RUBRIC points in tests/test_lesson.py
