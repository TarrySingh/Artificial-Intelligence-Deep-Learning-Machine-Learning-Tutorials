# Every factual claim this lesson makes about the world, with a source and the date the
# source was read. Numbers a student sees in output - the six affected/population counts and
# their shares, the evidence-index sizes, the removals, mutations and additions, the number
# of loosened parameters, the control limits, the bootstrap intervals and every verdict - are
# computed by the code they run over the synthetic pack built in section 3 of lesson.py. They
# are not claims about the world and do not appear here. The pack is synthetic and declared
# as such in meta.yaml.
#
# This lesson is engineering material about the machinery an evidence pack and its inspection
# imply. It is not legal advice, and nothing here substitutes for the Official Journal text
# or for professional advice on a specific system. Every threshold the lesson applies - the
# 10-second plausibility floor, the 60-reviews-an-hour ceiling, the 0.95 minimum declared
# level, k = 3.0, and the repaired/silenced/unfixed ladder itself - is the lesson's own
# modelling choice, is labelled as such where it appears, and is NOT a claim about what any
# authority would accept. Those choices are therefore not listed below: nothing sources them.
#
# SOURCING RULE, inherited from P01-L01, P01-L07 and T10-L01: a `quote` field contains text
# actually retrieved from `source_url` on the `accessed` date. No quote is reconstructed from
# memory or stitched across an ellipsis. EUR-Lex refuses automated retrieval, so every
# article quotation below was taken from euaiact.com and compared word for word against the
# INDEPENDENT reproduction at ai-act-law.eu; both were retrieved on the access date, both
# state that they are checked against the consolidated text on EUR-Lex, and in every case
# below the two agree exactly. The authoritative URL is recorded beside each claim and was
# not retrieved.
claims:
  - id: article-12-1-automatic-logs
    claim: >-
      Article 12(1) requires high-risk AI systems to technically allow for the automatic
      recording of events (logs) over the lifetime of the system. This is the duty behind the
      pack's `log` artefact and the `automatic_logging_design` evidence id, and it is why a
      log with a hole in it is a finding rather than a housekeeping note.
    where: "lesson.py section 1 (CHECK_META['log_integrity'].basis), section 4 (check_log_integrity)"
    source_url: https://www.euaiact.com/article/12
    source_title: "Article 12: Record-Keeping - Regulation (EU) 2024/1689"
    quote: >-
      High-risk AI systems shall technically allow for the automatic recording of events
      (logs) over the lifetime of the system.
    corroborating_url: https://ai-act-law.eu/article/12/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com states that Article 12 is unchanged since it was adopted and has been
      checked against the consolidated text on EUR-Lex. The independent reproduction at
      ai-act-law.eu gives the same sentence word for word.

  - id: article-19-1-six-month-floor
    claim: >-
      Article 19(1) requires providers of high-risk AI systems to keep the Article 12(1) logs
      that are under their control for a period appropriate to the intended purpose and of at
      least six months, unless Union or national law provides otherwise. The "at least" is the
      point the capstone leans on: the floor is a floor, so a retention job that removed a
      window inside it produced the hole the log check finds.
    where: "lesson.py section 1 (CHECK_META['log_integrity'].basis), section 3 (the purged window)"
    source_url: https://www.euaiact.com/article/19
    source_title: "Article 19: Automatically Generated Logs - Regulation (EU) 2024/1689"
    quote: >-
      Providers of high-risk AI systems shall keep the logs referred to in Article 12(1),
      automatically generated by their high-risk AI systems, to the extent such logs are
      under their control. Without prejudice to applicable Union or national law, the logs
      shall be kept for a period appropriate to the intended purpose of the high-risk AI
      system, of at least six months, unless provided otherwise in the applicable Union or
      national law, in particular in Union law on the protection of personal data.
    corroborating_url: https://ai-act-law.eu/article/19/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com states that Article 19 is unchanged since it was adopted and checked
      against the consolidated text on EUR-Lex.

  - id: article-11-1-documentation-before-and-current
    claim: >-
      Article 11(1) requires the technical documentation of a high-risk AI system to be drawn
      up before the system is placed on the market or put into service, and to be kept
      up to date. That is the duty behind the `technical_documentation` evidence id and behind
      a document section which was emitted from a source holding nothing: a section that says
      nothing is not documentation that is up to date, it is documentation that was never
      sourced.
    where: "lesson.py section 1 (CHECK_META['document_sourcing'].basis), section 4 (check_document_sourcing)"
    source_url: https://www.euaiact.com/article/11
    source_title: "Article 11: Technical Documentation - Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744"
    quote: >-
      The technical documentation of a high-risk AI system shall be drawn up before that
      system is placed on the market or put into service and shall be kept up-to date.
    corroborating_url: https://ai-act-law.eu/article/11/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com presents Article 11 as amended by Regulation (EU) 2026/1744. The sentence
      quoted here is identical on both reproductions. This lesson quotes only that sentence
      and makes no claim about the parts of Article 11 the amendment changed.

  - id: article-15-3-declared-accuracy
    claim: >-
      Article 15(3) requires the levels of accuracy and the relevant accuracy metrics of
      high-risk AI systems to be declared in the accompanying instructions of use. The Act
      says "levels" and "metrics" and says nothing about intervals; the lesson's rule that a
      declaration without an interval is undeclarable is P01-L06's modelling choice, carried
      into this capstone unchanged, and is labelled as such in the lesson.
    where: "lesson.py section 1 (CHECK_META['declared_accuracy'].basis), section 4 (check_declared_accuracy)"
    source_url: https://www.euaiact.com/article/15
    source_title: "Article 15: Accuracy, Robustness and Cybersecurity - Regulation (EU) 2024/1689"
    quote: >-
      The levels of accuracy and the relevant accuracy metrics of high-risk AI systems shall
      be declared in the accompanying instructions of use.
    corroborating_url: https://ai-act-law.eu/article/15/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com states that Article 15 is unchanged since it was adopted. Both
      reproductions give the sentence identically, including "instructions of use" rather
      than "instructions for use".

  - id: article-14-1-and-4b-oversight
    claim: >-
      Article 14(1) requires high-risk AI systems to be designed and developed so that they
      can be effectively overseen by natural persons during the period in which they are in
      use, and Article 14(4)(b) names automation bias by name among the things the overseer
      must remain aware of. Neither paragraph sets a minimum review time or a maximum review
      rate; the capstone's 10 seconds and 60 an hour are the lesson's own floor and ceiling,
      and the article is what makes a review nobody could have performed a finding at all.
    where: "lesson.py section 1 (CHECK_META['oversight_plausibility'].basis), section 4 (check_oversight_plausibility)"
    source_url: https://www.euaiact.com/article/14
    source_title: "Article 14: Human Oversight - Regulation (EU) 2024/1689"
    quote: >-
      High-risk AI systems shall be designed and developed in such a way, including with
      appropriate human-machine interface tools, that they can be effectively overseen by
      natural persons during the period in which they are in use.
    second_quote: >-
      to remain aware of the possible tendency of automatically relying or over-relying on
      the output produced by a high-risk AI system (automation bias), in particular for
      high-risk AI systems used to provide information or recommendations for decisions to be
      taken by natural persons
    corroborating_url: https://ai-act-law.eu/article/14/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      Both quotes were retrieved from euaiact.com and compared word for word against
      ai-act-law.eu; they agree. euaiact.com states that Article 14 is unchanged since it was
      adopted.

  - id: article-3-23-substantial-modification
    claim: >-
      Article 3(23) defines a substantial modification as a change to an AI system after its
      placing on the market or putting into service which is not foreseen or planned in the
      initial conformity assessment and as a result of which either the system's compliance
      with the Chapter III, Section 2 requirements is affected, or the intended purpose for
      which it was assessed is modified. The two limbs are why P01-L08's ladder tests the
      intended purpose before it tests compliance, and why the capstone's C-0031 - a move from
      consumer credit to small-business lending - is substantial on the first limb alone.
    where: "lesson.py section 2 (is_substantial_modification), section 4 (check_declaration_currency)"
    source_url: https://www.euaiact.com/article/3
    source_title: "Article 3: Definitions - Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744"
    quote: >-
      'substantial modification' means a change to an AI system after its placing on the
      market or putting into service which is not foreseen or planned in the initial
      conformity assessment carried out by the provider and as a result of which the
      compliance of the AI system with the requirements set out in Chapter III, Section 2 is
      affected or results in a modification to the intended purpose for which the AI system
      has been assessed
    corroborating_url: https://ai-act-law.eu/article/3/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com presents Article 3 as amended by Regulation (EU) 2026/1744 and notes that
      the wording of the definitions article differs from the text as originally adopted in
      2024. The point (23) text quoted here is identical on both reproductions.

  - id: article-43-4-reassessment-and-the-pre-determined-carve-out
    claim: >-
      Article 43(4) requires a high-risk AI system that has already been through a conformity
      assessment to undergo a NEW one in the event of a substantial modification, regardless
      of whether the modified system is further distributed or continues to be used by the
      current deployer; and it carves out, for systems that continue to learn, changes
      pre-determined by the provider at the initial assessment and contained in the point 2(f)
      Annex IV documentation. Both halves are in the lesson: the reassessment duty is why a
      declaration resting on an older assessment is a finding, and the carve-out is why the
      pack's pre-determined, documented change C-0027 is not.
    where: "lesson.py section 1 (CHECK_META['declaration_currency'].basis), section 2 (is_substantial_modification), section 3 (CHANGE_PLAN)"
    source_url: https://www.euaiact.com/article/43
    source_title: "Article 43: Conformity Assessment - Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744"
    quote: >-
      High-risk AI systems that have already been subject to a conformity assessment
      procedure shall undergo a new conformity assessment procedure in the event of a
      substantial modification, regardless of whether the modified system is intended to be
      further distributed or continues to be used by the current deployer.
    second_quote: >-
      For high-risk AI systems that continue to learn after being placed on the market or put
      into service, changes to the high-risk AI system and its performance that have been
      pre-determined by the provider at the moment of the initial conformity assessment and
      are part of the information contained in the technical documentation referred to in
      point 2(f) of Annex IV, shall not constitute a substantial modification.
    corroborating_url: https://ai-act-law.eu/article/43/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com presents Article 43 as amended by Regulation (EU) 2026/1744. Both
      paragraphs quoted here were compared word for word against ai-act-law.eu and agree
      exactly.

  - id: article-72-1-2-post-market-monitoring
    claim: >-
      Article 72(1) requires providers to establish and DOCUMENT a post-market monitoring
      system, proportionate to the nature of the technologies and the risks, and Article 72(2)
      requires that system to actively and systematically collect, document and analyse
      relevant performance data so the provider can evaluate continuous compliance with
      Chapter III, Section 2. It sets no control limit, no window and no baseline; those are
      P01-L07's modelling choices, and the capstone's finding is not that the limits are the
      wrong width but that they were not the ones the plan declared.
    where: "lesson.py section 1 (CHECK_META['monitoring_limits'].basis), section 4 (check_monitoring_limits)"
    source_url: https://www.euaiact.com/article/72
    source_title: "Article 72: Post-market Monitoring by Providers - Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744"
    quote: >-
      Providers shall establish and document a post-market monitoring system in a manner that
      is proportionate to the nature of the AI technologies and the risks of the high-risk AI
      system.
    second_quote: >-
      The post-market monitoring system shall actively and systematically collect, document
      and analyse relevant data which may be provided by deployers or which may be collected
      through other sources on the performance of high-risk AI systems throughout their
      lifetime, and which allow the provider to evaluate the continuous compliance of AI
      systems with the requirements set out in Chapter III, Section 2.
    corroborating_url: https://ai-act-law.eu/article/72/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com presents Article 72 as amended by Regulation (EU) 2026/1744, which is the
      same reading P01-L07 recorded on 2026-09-22. Both quoted passages agree word for word
      with ai-act-law.eu.

  - id: article-73-1-2-incident-clock-starts-at-awareness
    claim: >-
      Article 73(1) requires providers of high-risk AI systems placed on the Union market to
      report any serious incident to the market surveillance authorities of the Member States
      where the incident occurred, and Article 73(2) requires that report immediately after a
      causal link (or its reasonable likelihood) is established and in any event not later
      than 15 days after the provider or, where applicable, the deployer becomes AWARE of the
      incident. The clock starting at awareness rather than at occurrence is why the honest
      repair in this lesson files an incident dated the day of the inspection, months after
      the excursion the refitted limits were hiding.
    where: "lesson.py section 5 (_op_file_incident), section 13 (plan_repairs, the file_incident step)"
    source_url: https://www.euaiact.com/article/73
    source_title: "Article 73: Reporting of Serious Incidents - Regulation (EU) 2024/1689"
    quote: >-
      Providers of high-risk AI systems placed on the Union market shall report any serious
      incident to the market surveillance authorities of the Member States where that
      incident occurred.
    second_quote: >-
      The report referred to in paragraph 1 shall be made immediately after the provider has
      established a causal link between the AI system and the serious incident or the
      reasonable likelihood of such a link, and, in any event, not later than 15 days after
      the provider or, where applicable, the deployer, becomes aware of the serious incident.
    corroborating_url: https://ai-act-law.eu/article/73/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      euaiact.com states that Article 73 is unchanged since it was adopted. This lesson does
      not classify incidents or compute deadlines - that is P01-L07 - and quotes 73(2) only
      to justify dating the filed incident from awareness.

  - id: which-of-these-articles-the-2026-omnibus-amended
    claim: >-
      As presented by euaiact.com on the access date, four of the nine articles this lesson
      cites are given as amended by Regulation (EU) 2026/1744 (the Digital Omnibus on AI) -
      Articles 3, 11, 43 and 72 - and five are given as unchanged since adoption in 2024 -
      Articles 12, 14, 15, 19 and 73. Every passage this lesson quotes is identical on both
      reproductions consulted, so nothing in the lesson turns on which of the two texts a
      reader has in front of them.
    where: "meta.yaml authoring notes (WHAT I COULD NOT VERIFY); this file's retrieval_note fields"
    source_url: https://www.euaiact.com/article/43
    source_title: "euaiact.com per-article amendment banners - Regulation (EU) 2024/1689 as amended by Regulation (EU) 2026/1744"
    quote: >-
      For high-risk AI systems that continue to learn after being placed on the market or put
      into service, changes to the high-risk AI system and its performance that have been
      pre-determined by the provider at the moment of the initial conformity assessment and
      are part of the information contained in the technical documentation referred to in
      point 2(f) of Annex IV, shall not constitute a substantial modification.
    corroborating_url: https://ai-act-law.eu/article/43/
    authoritative_text_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
    accessed: 2026-09-23
    retrieval_note: >-
      This claim is about what the two reproductions SAY about amendment status, recorded
      because meta.yaml relies on it. The quote is the Article 43(4) passage whose page
      carries the amendment banner. The consolidated EUR-Lex text itself was not retrieved:
      EUR-Lex refuses automated retrieval, as P01-L01 and P01-L07 also recorded.
