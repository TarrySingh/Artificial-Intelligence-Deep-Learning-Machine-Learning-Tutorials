id: P01-L02-risk-classification
title: Turn the AI Act's risk tiers into a decision procedure that returns its own reasoning, the obligations that follow and the date each one binds
track: P01
programme: ai-act-conformity
flagship: F09           # flagship id this lesson feeds, or empty
