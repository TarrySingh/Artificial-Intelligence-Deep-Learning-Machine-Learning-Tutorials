  - T10-L01-ai-act-conformity-pack
  - P01-L01-article-12-logging
objectives:
  - "Implement the Article 6(3) derogation, including the profiling rule that overrides it and the Article 6(4) documentation duty that claiming it creates"
  - "Implement an ordered interview that reaches a risk tier in the fewest questions and records which question was decisive"
  - "Compute the obligations a tier implies, the date each one binds, and which of them bind today rather than later"
  - "Seal a classification into a hash-covered record and diff two records across a system change, reporting which obligations appeared and which vanished"
  - "Explain why a panel's disagreement is best reported as the earliest question they split on rather than as a spread of verdicts"
