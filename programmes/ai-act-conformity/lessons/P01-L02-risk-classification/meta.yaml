id: P01-L02-risk-classification
title: Turn the AI Act's risk tiers into a decision procedure that returns its own reasoning, the obligations
  that follow and the date each one binds
track: P01
programme: ai-act-conformity
flagship: F09
tier: cpu8
budget_seconds: 60
language: python
prerequisites:
- T10-L01-ai-act-conformity-pack
- P01-L01-article-12-logging
objectives:
- Implement the Article 6(3) derogation, including the profiling rule that overrides it and the Article
  6(4) documentation duty that claiming it creates
- Implement an ordered interview that reaches a risk tier in the fewest questions and records which question
  was decisive
- Compute the obligations a tier implies, the date each one binds, and which of them bind today rather
  than later
- Seal a classification into a hash-covered record and diff two records across a system change, reporting
  which obligations appeared and which vanished
- Explain why a panel's disagreement is best reported as the earliest question they split on rather than
  as a spread of verdicts
before_you_start:
  assumed:
  - write a Python function that branches on several boolean and string fields of a dict and returns a
    small structured result
  - compare two datetime.date values and say whether a date has passed as of a given day
  - read a legal article and tell its general rule from the exceptions to it, and the exceptions' own
    exceptions
  resources:
  - title: 'AI Act Article 6: Classification rules for high-risk AI systems'
    by: European Commission, AI Act Service Desk
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6
    kind: free
    why: 'paragraphs 1 to 4, shown as amended by the Digital Omnibus (new 1a to 1c marked): the Annex
      I and Annex III routes, the 6(3) derogation and its profiling override, and the 6(4) duty to document'
  - title: 'AI Act Annex III: High-risk AI systems referred to in Article 6(2)'
    by: European Commission, AI Act Service Desk
    url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3
    kind: free
    why: the eight use-case areas and their numbered points, which the lesson's classification procedure
      looks systems up against
  - title: Draft Commission guidelines on the classification of high-risk AI systems
    by: European Commission (draft of 19 May 2026)
    url: https://digital-strategy.ec.europa.eu/en/library/draft-commission-guidelines-classification-high-risk-ai-systems
    kind: free
    why: 'the Commission''s own draft reading of Article 6: general principles, then the Annex I and Annex
      III routes; a draft, so check whether a final text has replaced it'
  - title: Regulation (EU) 2026/1744 (Digital Omnibus on AI)
    by: European Parliament and Council, Official Journal
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX%3A32026R1744
    kind: free
    why: the amending act that moves the dates on which the high-risk obligations bind; the date logic
      of exercise 3 rests on it
  - title: 'The EU Artificial Intelligence Act: A Commentary'
    by: Michèle Finck (Oxford University Press, 2026)
    url: https://academic.oup.com/oxford-law-pro/book/62212
    kind: paid
    why: 'per the publisher an article-by-article commentary; its contents page was not checkable, so
      no entry numbers are given: look up Article 6 and Annex III for a lawyer''s reading'
datasets:
- name: SYSTEMS and PANEL — nine fictional AI system descriptions and four analyst intake forms
  licence: CC-BY-NC-SA-4.0
  url: none — authored in this repository, constructed inside lesson.py
  origin: authored-for-this-lesson
  cached_at: none — module-level literals in lesson.py, nothing is read from disk
  gated: false
  downloads: none
  synthetic: true
  notes: 'Not a third-party dataset. Every system, flag, justification and date is invented for this lesson
    and declared synthetic; none describes a real product, company or provider. The fixtures are constructed
    to cover one branch of the decision procedure each, plus two that fail the derogation for different
    reasons and a panel that splits at two different questions. The legal texts the rulebook encodes are
    not data files: they are cited in claims.yaml with their source URLs and access dates.'
points: 69
status: reviewed
