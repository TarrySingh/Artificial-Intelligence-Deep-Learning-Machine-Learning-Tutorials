id: P04-L04-discrimination-testing
title: Build AUC from the rank identity, put a bootstrap and a DeLong interval around it, compare two models on the same records, and say when a difference could not have been measured at all
track: P04
flagship: ""            # programme module 4; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 180
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P04-L01-validation-suite
objectives:
  - "Implement AUC by the Mann-Whitney rank identity with average-rank tie handling, and the KS statistic and Gini from the same ranking"
  - "Implement a stratified percentile bootstrap confidence interval for a rank statistic that has no elementary closed-form variance"
  - "Implement a paired bootstrap and the DeLong closed form for the difference between two models scored on the same records, and measure how often the independent shortcut misses a real difference"
  - "Report the minimum detectable difference and the sample size it implies, so that a non-significant result is never filed as no difference"
  - "Measure the coverage of your own intervals against a binormal model whose true AUC is known in closed form, and explain why a nominal 95% interval misses asymmetrically on a small sample"
datasets: []            # none: the book is synthetic, generated in the notebook, declared as such in DATA_NOTE; the coverage study draws from a binormal model whose true AUC is a closed form
points: 155        # = sum of RUBRIC points in tests/test_lesson.py
# Build notes, 2026-09-16. All four gates run from the repo root on the venv interpreter; the
# measured figures below were written back by tools/execute.py and never typed.
#
# Scope against programmes/model-risk/MODULES.md module 4. Everything the module map specifies
# is here: the Mann-Whitney rank identity with average-rank ties (exercise 1), KS and Gini
# (exercise 2), a bootstrap interval (exercise 3), a PAIRED bootstrap for the difference
# between two models scored on the same records (exercise 4), and an out-of-time holdout with
# the interval widened for the sample it actually had (section 11). Two additions the brief
# asked for and the module map did not spell out: a DeLong-style analytic comparison
# (exercise 5) and a sample-size check that says when a difference is not measurable
# (exercise 6), plus a coverage scorer (exercise 7) so the intervals themselves are graded
# against a distribution whose true AUC is known exactly. The module map's "the lab measures
# how often treating them as independent gives the wrong answer" is section 7, which runs 500
# fresh books and reports the detection rate of three rules side by side.
#
# Data: every record is synthetic, generated by numpy.random.default_rng(20260916) inside the
# notebook. DATA_NOTE says so and the notebook prints it. The coverage study's samples come
# from binormal_sample, whose true AUC is Phi(mu / sqrt(2)) in closed form — which is the only
# reason an interval can be marked right or wrong at all. datasets: [] is therefore correct
# and gate 11 is vacuous.
#
# Numbers: nothing a student sees is typed. The rubric's expected values come from pure-Python
# references written a different way (_auc_reference, _ks_reference, _delong_var_reference,
# _delong_pair_var_reference) or from a closed form worked by hand, never from this lesson's
# own synthetic sample, so a change to the generator cannot silently break grading.
#
# Mutation testing, 2026-09-16. 24 plausible-wrong variants of the reference solution were
# built in a scratch directory outside the lesson and graded. 23 are caught, and every one of
# those keeps partial credit — scores run from 68% to 98%, never 0 and never 100. The 24th is
# uncatchable and is documented below rather than quietly dropped. Five controls, each a
# correct answer written a different way, all still score 100%: average_ranks written with a
# Python loop over tied blocks instead of np.unique; ks_and_gini reducing with a Python loop
# over thresholds instead of searchsorted; delong_test taking the variance of the DIFFERENCED
# structural components instead of assembling a 2x2 covariance matrix; delong_auc_ci reading
# its point estimate off V01 instead of V10; and a stratified bootstrap that draws a SECOND
# stratified index set for the scores — fragile code, but under stratification the label
# vector is deterministic, so the replicate it produces is still a correct one and the rubric
# is right not to fail it. The rubric rejects wrong answers without rejecting
# differently-shaped right ones.
#
# Every variant, by exercise, with the score it earned:
#   1. ordinal ranks instead of averaged ties 81% · ranks returned in sorted order 68% ·
#      the one-class guard dropped 97% · a numpy scalar returned instead of a float 97%.
#   2. KS on raw cumulative counts rather than within-class shares 90% · KS on an evenly
#      spaced grid of 100 thresholds 92% · CDFs taken strictly below instead of at-or-below
#      92% · gini returned as auc - 0.5 98%.
#   3. labels and scores drawn with two separate unstratified index sets 92% · the alpha and
#      1-alpha percentiles instead of alpha/2 and 1-alpha/2 97% · the bootstrap mean returned
#      as the point estimate 97% · an unstratified resample 97% · the replicate standard
#      deviation at ddof=0 **100%, NOT CAUGHT**.
#   4. a fresh index draw for each of the two models inside one replicate 94% — the single
#      defect this exercise exists to prevent, and the one that passes every other case.
#   5. the covariance cross term dropped from Var(diff) 91% · a one-sided p-value 94% ·
#      ddof=0 in the structural variances 96% · V01 counting the events BELOW a non-event
#      rather than above it 95%.
#   6. mdd using the critical value alone with no power term 94% · measurability tested
#      before significance 93% · n_required truncated instead of rounded up 97%.
#   7. miss_low and miss_high swapped 97% · exclusive interval endpoints 98% · the coverage
#      standard error without its (1 - p) factor 96%.
#
# The one that got away, and what was done about it. A bootstrap `se` computed at ddof=0
# scores a clean 155/155. It cannot be caught: the rubric would have to reproduce the
# student's replicate stream to know what the right figure is, and at 2,000 replicates the
# two answers differ by a factor of 1.00025 — the fourth decimal place. The fix was not a new
# case but an honest docstring: the stub now says in as many words that ddof=1 is the house
# convention here, that the rubric does not grade the choice and cannot, and that where ddof
# IS gradeable — the DeLong structural variances in exercise 5, which are deterministic — it
# is graded, and the ddof=0 mutant there loses 6 points. A requirement that says it is graded
# and is not is the defect this lesson's predecessor was reviewed for twice.
#
# Two defects the mutation run found and fixed, rather than merely confirmed:
#   * the first draft graded `reason` by looking for the substring "0.010" in it, which any
#     plausible wording satisfied and no downstream tool could parse. The reason now opens
#     with a fixed machine-readable head that the docstring specifies and the rubric pins, so
#     a report generator can lift the figures instead of a human retyping them.
#   * the first draft handed the student a finished `average_ranks`, which made the tie
#     handling that the module map names as the point of exercise 1 into a freebie. It is now
#     a graded stub of its own, with the two tie cases scored separately from the AUC cases.
#
# Known limits, for the owner:
#   * the sample-size rule scales the standard error as 1 / sqrt(n) with the class balance
#     held fixed. That is the right first-order answer and it is what the stub says it is; it
#     is not exact, because the DeLong variance also depends on how the events and non-events
#     separate. The notebook states the assumption where it uses it and does not dress the
#     figure up as a power calculation from a named standard.
#   * section 10 measures the coverage of the DeLong normal-approximation interval and of the
#     percentile bootstrap. It does NOT build a bias-corrected and accelerated interval, which
#     is the usual next step and would be its own lesson.
#   * the bootstrap's `ddof` is not gradeable, as set out above. It is the only stated
#     requirement in this lesson that the rubric does not pin, and the docstring says so.
#   * worst run of prose before the next runnable cell: 28 non-blank comment lines (section
#     13, the five self-check questions), then 22 (section 12, common mistakes) and 22 (the
#     header). All inside gate 3's ~40, and section 12 is split by a runnable demonstration
#     of the broken-pairing mistake rather than running on into section 13.
#   * the lesson imports and runs in about 16 s, and tools/grade.py pays that once before the
#     first rubric case. That is inside the 180 s budget MODULES.md declares for this module
#     and well inside the cpu8 memory tier at a measured 38 MiB, but a student re-running the
#     grader repeatedly will feel it. The cost is section 7 (500 fresh books) and section 10
#     (two coverage studies); both are the lesson's own evidence and neither is padding.
#
# --- INDEPENDENT REVIEW, 2026-09-16 ----------------------------------------------------------
#
# All four gates re-run from the repo root before and after the changes below. Every file read
# in full. 19 fresh mutants were written in a scratch directory outside the lesson, each a
# plausible-wrong copy of the reference, and graded against the rubric. A control — the
# reference with only its non-graded demo cells stripped, which is what made a mutant run take
# 1 s instead of 17 s — scored 155/155 before and after, so the stripping decided nothing.
#
# 17 of the 19 were caught on the first pass, at 79% to 98%, every one keeping partial credit:
#   off-by-one in the rank offset 79% · integer division on the tie offset 81% · coverage miss
#   sides swapped 97% · DeLong variance pooled as a mean rather than summed 96% · n_required
#   truncated 97% · ks_threshold indexed into the raw scores instead of the unique thresholds
#   (right computation, wrong thing returned) 92% · AUC validation swallowed into a `return
#   0.5` 97% · a fresh draw per model inside a paired replicate 94% · the DeLong cross term
#   dropped 91% · ddof=0 in the DeLong variances 96% · measurability tested before significance
#   95% · coverage se missing its (1 - p) 96% · KS CDFs taken strictly below 92% ·
#   delong_components falling off the end without returning 79% · a significance test with a
#   0.5x fudge on the critical value 97%.
#
# TWO SURVIVORS AT 155/155, both real defects, both now closed:
#   1. An UNSTRATIFIED bootstrap whose eventless replicates are rescued with `reps[b] = 0.5`
#      rather than by stratifying. `test_bootstrap_stratifies_thin_class` asked only for a
#      finite, ordered interval, and this answer gives one. Measured: on a perfectly
#      separating 3-event sample the honest interval is [1.0000, 1.0000] with se 0 and this
#      one reports [0.5000, 1.0000] with se 0.0932 — a model that ranks perfectly filed as
#      possibly a coin. On the noisy thin sample the lower bound falls from 0.6333 to 0.5000.
#      FIX: that test now also scores the separating thin sample and requires lo > 0.999 with
#      se < 1e-12, with a message naming the invented replacement value. The mutant now
#      scores 151/155.
#   2. A GENERATOR IN THE DEFAULT ARGUMENT — `rng: Generator = np.random.default_rng(...)` in
#      the signature instead of `None` — which is built once at definition time and shared by
#      every call. Measured: two calls with no `rng` returned [0.674571, 0.770928] and
#      [0.661064, 0.760912]; the reference returns the same interval both times. Nothing in
#      the rubric ever called either bootstrap without a generator. FIX: both reproducibility
#      tests now make two no-`rng` calls and require agreement; the requirement is stated in
#      both stub docstrings and in section 12. Mutants 152/155 (bootstrap) and 152/155
#      (paired).
#   The reference still scores 155/155 after both fixes, and all 17 earlier mutants score
#   exactly as they did before — the new cases are additions to existing tests, so `points`
#   stays 155 and no rubric row changed its weight.
#
# ONE SURVIVOR THAT IS NOT A DEFECT, with the measurement rather than an invented case: a free
# (unstratified) draw that RETRIES until both classes appear scores 155/155 and cannot be
# caught. It violates the letter of the stub's instruction, but it produces a defensible
# interval — a bootstrap conditioned on validity rather than on the class counts — and the
# only trace it leaves is a slightly larger standard error. Measured over six seeds at each of
# six shapes, the ratio of its se to the stratified one is 1.109 at 3 events / 60 non-events,
# 1.138 at 5/60, 1.039 at 10/90, 1.033 at 40/360, 0.987 at 140/360 and 1.024 at 200/500. At
# the sizes this lesson works with, the difference is two to three per cent, which is inside
# the Monte-Carlo noise of the 500-replicate estimate itself; any bound tight enough to fail
# it would fail correct implementations too. Handled the way the author handled `ddof`: the
# docstring now says in as many words that the rubric grades the CONSEQUENCE of stratifying —
# a thin, perfectly separating class coming back as a point interval — and not the draw.
#
# Checked and found sound, beyond what the gates see: prerequisites `T00-L01-the-8gb-track`
# and `P04-L01-validation-suite` both resolve to real lesson directories; all five objectives
# open with a verb and none is "understand X"; ten stubs, every one a signature plus a
# docstring with a worked example, `# YOUR CODE HERE` and `raise NotImplementedError`, none a
# blank cell; every `_check_*` failure message names the mistake rather than restating the
# assertion; grading is per-case across 40 rubric rows and nothing is all-or-nothing; no
# number in prose is a measured result — the figures that appear are definitional (95%, the
# 2.5 and 97.5 percentiles, the 16% narrowing) or hypothetical scenarios in the self-check —
# and every reported measurement comes from code the student runs; no prose points at a path
# under solutions/, and the self-check says "the course solution bundle". All four external
# claims were re-fetched on 2026-09-16 and each quote appears verbatim at its URL, with the
# citations matching: OCC Bulletin 2026-13 lists "model validation and monitoring, including
# validating conceptual soundness and outcomes analyses" and states it sets no enforceable
# standards; Hanley and McNeil carry both quoted sentences; the Duke record gives DeLong et
# al., Biometrics 44(3):837-845, 1988 with the quoted abstract; Project Euclid gives Efron,
# Ann. Statist. 7(1):1-26, 1979, DOI 10.1214/aos/1176344552, with the abstract's opening
# sentence truncated exactly where claims.yaml says it is. Against MODULES.md module 4, every
# specified element is present — the rank identity with average-rank ties, KS and Gini, the
# bootstrap interval, the PAIRED bootstrap, the measured cost of the independent shortcut
# (section 7, 500 fresh books, three decision rules side by side) and the out-of-time holdout
# with the interval widened for the smaller sample (section 11) — plus the three declared
# additions. Budget and tier hold: 16.2 s against 180 s, 38 MiB against cpu8.
