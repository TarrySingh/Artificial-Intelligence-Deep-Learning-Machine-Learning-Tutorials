id: P04-L04-discrimination-testing
title: Build AUC from the rank identity, put a bootstrap and a DeLong interval around it, compare two
  models on the same records, and say when a difference could not have been measured at all
track: P04
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- Implement AUC by the Mann-Whitney rank identity with average-rank tie handling, and the KS statistic
  and Gini from the same ranking
- Implement a stratified percentile bootstrap confidence interval for a rank statistic that has no elementary
  closed-form variance
- Implement a paired bootstrap and the DeLong closed form for the difference between two models scored
  on the same records, and measure how often the independent shortcut misses a real difference
- Report the minimum detectable difference and the sample size it implies, so that a non-significant result
  is never filed as no difference
- Measure the coverage of your own intervals against a binormal model whose true AUC is known in closed
  form, and explain why a nominal 95% interval misses asymmetrically on a small sample
