id: P04-L09-streaming-monitor-in-c
title: Monitor a month's scores in C in one pass and fixed memory — module 1's bins and floored PSI over
  a pipe, a reproducible reservoir of the tail, a breach that names its bin, and a peak-memory ceiling
  the harness measures
track: P04
flagship: ''
tier: cpu8
budget_seconds: 180
language: c
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- 'Implement module 1''s binning and floored PSI in C over bin counts, and reproduce an in-memory numpy
  reference: the counts exactly and the PSI within a stated tolerance'
- Implement a single-pass monitor that reads a pipe once through a fixed 64 KiB buffer, rejects every
  score that is not a probability including NaN, and reports a truncated final record
- Implement Algorithm R over the tail with a splitmix64 generator shared by C and Python, and reproduce
  the sample bit for bit
- Measure the monitor's peak resident memory from outside it, normalise ru_maxrss for the platform that
  produced it, and hold the monitor under a ceiling set over its own measured baseline
- Explain why the harness measures a forked worker rather than the launcher's own high-water mark, and
  why a breach must name its bin and its checkpoint
datasets:
- name: synthetic development sample and monthly score extract
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: A 200,000-record development sample and a 4,194,304-record month of (account id, score) pairs,
    generated in section 2 and 3 of lesson.py from a counter-based splitmix64 stream seeded 20260909,
    using only exact IEEE operations (a 53-bit integer to a double, a scaling by a power of two, one product,
    square roots), so every machine and every numpy produces the same bits. The month is written as raw
    16-byte records under tempfile.gettempdir() and deleted at the end of the run and at interpreter exit;
    nothing is downloaded and nothing large is written into the lesson directory.
points: 86
status: reviewed
