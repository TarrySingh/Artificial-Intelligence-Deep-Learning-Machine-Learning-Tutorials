id: P04-L05-calibration-stability-depth
title: Measure how far one model's calibration error moves with the binning, test its fit on the degrees
  of freedom its setting demands, attribute a population shift to the input that moved, and price every
  stability threshold with the false-alarm rate it carries at your sample size
track: P04
flagship: ''
tier: cpu8
budget_seconds: 180
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- Implement equal-frequency calibration bins with a documented rule for tied scores, and measure how far
  one fixed model's ECE moves across binning scheme and bin count
- Implement the chi-square survival function and the Hosmer-Lemeshow statistic, and explain why its degrees
  of freedom are g - 2 on the fitting sample and g on an independent one
- Implement a per-driver characteristic stability index that attributes a population shift to the input
  that moved, with each driver's share of the model's log-odds movement
- Measure by bootstrap the null distribution of PSI at a given pair of sample sizes, and the false-alarm
  rate a conventional threshold carries there
- Generate a calibration-and-stability appendix from the results, in which every threshold is reported
  with its false-alarm rate
