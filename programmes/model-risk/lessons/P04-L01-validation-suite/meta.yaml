id: P04-L01-validation-suite
title: Build the validation suite that measures a model's calibration, stability and subgroup behaviour, applies a written promotion rule, and generates the validation report from the results
track: P04
flagship: ""            # programme opener; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
objectives:
  - "Implement a reliability table and the support-weighted expected calibration error over it"
  - "Implement a population stability index against a fixed baseline, floored on both sides so a bin that empties out is reported rather than erased"
  - "Implement a subgroup performance table whose minimum-support rule suppresses metrics without hiding groups"
  - "Apply a written champion-versus-challenger decision rule and report the outcome of every test in it"
  - "Generate the validation report from the measured results, and explain why re-cutting stability bins on each new sample makes a drifting population read as stable forever"
datasets: []            # none: the sample is synthetic, generated in the notebook, declared as such in DATA_NOTE and printed at the head of the report
points: 110        # = sum of RUBRIC points in tests/test_lesson.py
# Build notes, 2026-09-16. All four gates run from the repo root on the venv interpreter; the
# measured figures below were written back by tools/execute.py and never typed.
#
# Data: every record is synthetic, generated by numpy.random.default_rng(20260916) inside the
# notebook. DATA_NOTE says so, the notebook prints it, and render_validation_report puts it in
# section 1 of the generated report, so a reader of the artefact cannot mistake it for real
# lending data. datasets: [] is therefore correct and gate 11 is vacuous.
#
# Numbers: nothing a student sees is typed. The report's figures come from the run; the
# rubric's expected values come from a pure-Python reference (_ece_reference, _psi_reference)
# or a hand-worked closed form (PSI of ln(3) on the two-bin case), never from this lesson's
# own synthetic sample — so a change to the generator cannot silently break grading.
#
# Mutation testing, 2026-09-16. 32 plausible-wrong variants of the reference solution were
# built in a scratch copy and graded; all 32 are caught, and every one of them keeps partial
# credit — scores run from 84% to 98%, never 0 and never 100. Four controls, each a correct
# answer written a different way, all still score 100%: PSI binned with np.digitize instead of
# searchsorted, ECE reduced with a Python loop instead of boolean masks, reliability bins
# derived with np.ceil instead of searchsorted, and subgroup rows built from a set and sorted
# at the end. The rubric rejects wrong answers without rejecting differently-shaped right ones.
#
# The variants that mattered most, by exercise:
#   1. empty bin reported as 0.0 rather than nan; interior edge joining the UPPER bin; the
#      probability-range check removed; empty bins dropped from the table; mean_pred reported
#      as the bin midpoint rather than the mean of the predictions in it.
#   2. occupied bins weighted equally instead of by support; the reduction taken over every
#      bin, so 0 * nan poisons the total; the signed gap, letting over- and under-prediction
#      cancel; a numpy scalar returned instead of a float.
#   3. PSI on raw counts; flooring only one side, leaving a bin that appeared from nothing at
#      infinity; |a - e| instead of the signed difference; out-of-range values dropped rather
#      than clipped into the end bins; log base 10; contributions no longer summing to psi.
#   4. below-support groups dropped from the table; > instead of >= for the support rule;
#      metrics measured on the whole sample; gap inverted to event_rate - mean_pred; metrics
#      computed for the suppressed rows anyway.
#   5. improvement scored before the absolute gates, so a blown ECE ceiling promotes on a big
#      enough AUC gain; strict inequalities, so landing exactly on a limit fails; only the
#      failing reasons reported; ece_change subtracted the wrong way round; a merely-not-worse
#      challenger promoted.
#   6. the report recomputing the ECE instead of reporting the one it was handed; a suppressed
#      group's metrics printed; a suppressed group's row omitted; >= for the PSI breach test;
#      an empty calibration bin printing nan as if it were a rate; the verdict not upper-cased.
#
# Two defects the mutation run found and fixed, rather than merely confirmed:
#   * a numpy scalar returned from expected_calibration_error scored a clean 100%. np.float64
#     is a SUBCLASS of float, so the original isinstance() check could never catch it — while
#     json.dumps refuses it, which is where such a value stops a report pipeline. The case now
#     tests the concrete type, and both the docstring and the notebook's own check say why.
#   * five checks in the rubric turned a student's NotImplementedError into an AssertionError,
#     so an untouched stub was reported as a wrong answer rather than as work not yet done.
#
# Known limits, for the owner:
#   * auc_by_ranks is given to the student, not graded. It is the one instrument in the suite
#     they do not build. A later module in this programme (module 4) is specified to build
#     discrimination metrics properly, including the tie handling this helper already does.
#   * the PSI threshold and the minimum-support figure are policy inputs, passed in as
#     arguments, and the lesson nowhere says where they come from. claims.yaml records both as
#     deliberate non-claims rather than leaving the omission to look like an oversight.
#   * worst run of prose before the next runnable cell: 28 non-blank lines (section 10, the
#     five self-check questions), then 19 (section 9, common mistakes) and 19 (the header).
#     All inside gate 3's ~40. Section 9 is split by a runnable demonstration of the
#     re-cut-edges mistake rather than running on into section 10.
