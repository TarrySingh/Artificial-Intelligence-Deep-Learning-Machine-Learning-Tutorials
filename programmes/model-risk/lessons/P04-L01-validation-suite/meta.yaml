id: P04-L01-validation-suite
title: Build the validation suite that measures a model's calibration, stability and subgroup behaviour,
  applies a written promotion rule, and generates the validation report from the results
track: P04
flagship: ''
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
objectives:
- Implement a reliability table and the support-weighted expected calibration error over it
- Implement a population stability index against a fixed baseline, floored on both sides so a bin that
  empties out is reported rather than erased
- Implement a subgroup performance table whose minimum-support rule suppresses metrics without hiding
  groups
- Apply a written champion-versus-challenger decision rule and report the outcome of every test in it
- Generate the validation report from the measured results, and explain why re-cutting stability bins
  on each new sample makes a drifting population read as stable forever
