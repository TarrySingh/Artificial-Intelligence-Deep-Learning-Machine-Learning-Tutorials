id: P04-L07-challenger-from-scratch
title: Build two challengers from scratch — logistic regression by IRLS that reports separation instead
  of a runaway coefficient, and a monotonic weight-of-evidence scorecard — then audit whether the comparison
  with the champion was fair before letting it return a verdict
track: P04
flagship: ''
tier: cpu8
budget_seconds: 240
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
- P04-L04-discrimination-testing
objectives:
- Implement logistic regression by iteratively reweighted least squares, solving the weighted normal equations
  without an explicit inverse and stopping on a stated convergence criterion
- Detect complete and quasi-complete separation and report it as a finding that names the runaway variable,
  never as a coefficient
- Verify a fit by its score equations and by the closed-form log odds ratio of a 2x2 table
- Implement a binned weight-of-evidence scorecard whose documented monotonic directions are enforced by
  pooling adjacent violators
- Audit a champion-challenger comparison for the same records, period and missing-value treatment, and
  explain why a comparison that fails the audit must report no metrics and no promotion decision
before_you_start:
  assumed:
  - write a numpy solve of a linear system (np.linalg.solve) and explain why it is preferred to forming
    an explicit inverse
  - explain what a logistic regression predicts, what its coefficients mean as log odds, and what a likelihood
    is
  - build a 2x2 table of counts from two binary variables and compute an odds ratio from it
  resources:
  - title: Advanced Data Analysis from an Elementary Point of View
    by: Cosma Rohilla Shalizi, Carnegie Mellon University (free draft book)
    url: https://www.stat.cmu.edu/~cshalizi/ADAfaEPoV/
    kind: free
    why: 'chapter 11, section 11.3: iteratively re-weighted least squares as Newton''s method (11.3.1),
      and why linearly separable data leave the likelihood with no maximum'
  - title: Pattern Recognition and Machine Learning
    by: Christopher M. Bishop (Springer; free PDF hosted by Microsoft Research)
    url: https://www.microsoft.com/en-us/research/wp-content/uploads/2006/01/Bishop-Pattern-Recognition-and-Machine-Learning-2006.pdf
    kind: free
    why: 'section 4.3.3, Iterative reweighted least squares: the Newton-Raphson update for logistic regression
      written out as a weighted least-squares problem'
  - title: Isotonic regression (scikit-learn user guide)
    by: scikit-learn developers
    url: https://scikit-learn.org/stable/modules/isotonic.html
    kind: free
    why: 'states the problem pooling adjacent violators solves: a non-decreasing fit minimising weighted
      squared error; the page gives the problem, the lesson the algorithm'
  - title: Applied Logistic Regression, 3rd edition
    by: Hosmer, Lemeshow and Sturdivant (Wiley)
    url: https://www.wiley.com/en-us/Applied+Logistic+Regression%2C+3rd+Edition-p-9780470582473
    kind: paid
    why: 'chapter 3, section 3.2 (a dichotomous covariate: the odds ratio from a 2x2 table equals the
      exponentiated coefficient) and section 4.4, Numerical Problems, which treats separation'
  - title: Intelligent Credit Scoring, 2nd edition
    by: Naeem Siddiqi (Wiley)
    url: https://www.wiley.com/en-us/Intelligent+Credit+Scoring%3A+Building+and+Implementing+Better+Credit+Risk+Scorecards%2C+2nd+Edition-p-9781119279150
    kind: paid
    why: 'chapter 10, Initial Characteristic Analysis (weight of evidence, information value) and the
      Validation section that closes it: the practitioner''s account of the scorecard you build'
datasets:
- name: synthetic-credit-book-dev-and-validation
  kind: synthetic
  description: 4,000-record development book (2024-01 to 2024-12) and 3,000-record validation book (2025-01
    to 2025-06) of retail credit accounts, with a thin-file missing income, a post-default collections
    flag, a vendor score and a documented champion, generated in lesson.py by synthetic_book(numpy.random.default_rng(20260923))
  generator: 'lesson.py :: synthetic_book, champion_model'
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  downloads: false
