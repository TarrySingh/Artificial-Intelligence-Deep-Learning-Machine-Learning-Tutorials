claims:
- id: interagency-guidance-validation-identifies-limitations
  claim: The supervisory guidance on model risk management issued jointly by the Federal Reserve, the
    FDIC and the OCC on 17 April 2026 (SR 26-2 at the Federal Reserve) states that sound validation identifies
    model limitations and errors. Section 7 cites it in one sentence as the reason a committee pack carries
    a limitations section at all — and the lesson then builds that section from what the suite could not
    measure.
  where: lesson.py section 7 (exercise 4, limitations), first sentence
  source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602a1.pdf
  source_title: SR Letter 26-2 Attachment — Supervisory Guidance on Model Risk Management, Board of Governors
    of the Federal Reserve System, Federal Deposit Insurance Corporation, Office of the Comptroller of
    the Currency, April 17, 2026
  quote: Sound validation identifies model limitations and errors and clarifies appropriate use and whether
    corrective actions may be warranted.
  quote_context: From section "V. MODEL VALIDATION AND MONITORING", first paragraph, which opens "Model
    validation evaluates whether models perform as expected and includes an assessment of a model's reliability
    and its limitations." The attachment is linked from https://www.federalreserve.gov/supervisionreg/srletters/SR2602.htm.
  accessed: 2026-09-23
- id: interagency-guidance-documentation-tracks-remediation
  claim: The same guidance notes that documentation can support the tracking of recommendations, responses
    and exceptions, and can help manage model remediation efforts. Section 4 cites it as the reason the
    findings register exists — it is where that tracking lives — and the lesson says "can support", as
    the guidance does, not "requires".
  where: lesson.py section 4 (exercise 1, build_register), second paragraph
  source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602a1.pdf
  source_title: SR Letter 26-2 Attachment — Supervisory Guidance on Model Risk Management, Board of Governors
    of the Federal Reserve System, Federal Deposit Insurance Corporation, Office of the Comptroller of
    the Currency, April 17, 2026
  quote: documentation can help maximize the likelihood of continuity of operations, including supporting
    the tracking of recommendations, responses, and exceptions; it can also be used to more effectively
    help manage any model remediation efforts.
  quote_context: 'From the subsection "Documentation" of section "VI. GOVERNANCE AND CONTROLS" (it follows
    the subsection "Model Inventory"), whose first sentence reads "Adequate documentation helps to support
    effective model risk management." The quoted clause follows "For example,". (Corrected on independent
    review, 2026-09-23: the subsection sits in section VI, not under "Components of Model Validation"
    in section V.)'
  accessed: 2026-09-23
