id: P04-L10-committee-pack
title: Assemble the committee pack from the evidence — a findings register that keeps its history, a remediation
  tracker that ages and escalates from an explicit date, a summary and limitations built from the findings
  — and a gate that traces every figure in it to a computed result or refuses to render
track: P04
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
- P04-L02-model-inventory-tiering
- P04-L03-conceptual-soundness
- P04-L04-discrimination-testing
- P04-L05-calibration-stability-depth
- P04-L06-reproduce-the-number-in-c
- P04-L07-challenger-from-scratch
- P04-L08-explainability-evidence
- P04-L09-streaming-monitor-in-c
objectives:
- Implement a findings register whose identifiers, raised dates and owners survive from one pack to the
  next, and a remediation tracker that ages live findings from an explicit as-of date and escalates the
  overdue ones by policy
- Assemble an executive summary whose opinion follows from the register by a written rule, and a limitations
  section built from the subgroups, bins and comparisons the suite could not measure
- Implement a graded definition of a figure in a document — excluding dates, section numbers and identifiers;
  reading thousands separators, signs, ranges, percentages and scientific notation — with the half unit
  of precision each figure claims
- Implement a gate that traces every figure in the pack to a computed result within that half unit, and
  a committee pack that refuses to render while any figure is untraceable
- Measure how a widened tolerance, an exempted class of figure or numbers read out of strings let a typed
  figure through, and explain why a figure that traces is not thereby the right figure
before_you_start:
  assumed:
  - write a regular expression with groups and alternatives, and use re.finditer to get matches with their
    positions out of a text
  - compute the age in days between two datetime.date values and compare it with a threshold
  - read and write Python dataclasses, and sort and group lists of them
  resources:
  - title: SR 26-2 Revised Guidance on Model Risk Management (the attachment)
    by: Federal Reserve, OCC and FDIC (hosted by the Federal Reserve), 17 April 2026; supersedes SR 11-7
    url: https://www.federalreserve.gov/supervisionreg/srletters/sr2602a1.pdf
    kind: free
    why: section VI, Documentation ('tracking of recommendations, responses, and exceptions' and remediation),
      Model Inventory and Roles and Responsibilities; section V, Ongoing Model Monitoring
  - title: SS1/23 Model risk management principles for banks
    by: Prudential Regulation Authority, Bank of England
    url: https://www.bankofengland.co.uk/prudential-regulation/publication/2023/may/model-risk-management-principles-for-banks-ss
    kind: free
    why: 'Principle 2, governance, and Principle 4, independent validation: who owns a finding, who it
      is reported to, and the model risk reporting a committee pack serves'
  - title: Regular Expression HOWTO (Python documentation)
    by: Python Software Foundation
    url: https://docs.python.org/3/howto/regex.html
    kind: free
    why: 'the sections on repeating things, groups and finditer: enough to write the number-in-text matcher
      the figure gate is built on'
  - title: 'datetime: date objects (Python documentation)'
    by: Python Software Foundation
    url: https://docs.python.org/3/library/datetime.html
    kind: free
    why: 'date.fromisoformat, date subtraction and timedelta.days: the arithmetic behind ageing a finding
      from an explicit as-of date'
datasets:
- name: synthetic retail application book, out-of-time sample and driver samples
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  note: Module 1's generator and seed (numpy.random.default_rng(20260916)) re-create module 1's development
    and monitoring samples record for record, and draw one further out-of-time sample of 1,400 records;
    two stand-in driver samples for module 5's per-driver stability come from default_rng(20260921). The
    evidence of modules 2, 3 and 6 to 9 is FIXTURE data in each module's record format, labelled in section
    3 and in DATA_NOTE, which the notebook prints and module 1's report section carries into the pack.
    Nothing is downloaded and nothing is written to disk.
