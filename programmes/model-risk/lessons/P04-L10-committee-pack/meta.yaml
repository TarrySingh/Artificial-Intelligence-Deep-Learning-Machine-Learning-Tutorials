id: P04-L10-committee-pack
title: Assemble the committee pack from the evidence — a findings register that keeps its history, a remediation
  tracker that ages and escalates from an explicit date, a summary and limitations built from the findings
  — and a gate that traces every figure in it to a computed result or refuses to render
track: P04
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
- P04-L02-model-inventory-tiering
- P04-L03-conceptual-soundness
- P04-L04-discrimination-testing
- P04-L05-calibration-stability-depth
- P04-L06-reproduce-the-number-in-c
- P04-L07-challenger-from-scratch
- P04-L08-explainability-evidence
- P04-L09-streaming-monitor-in-c
objectives:
- Implement a findings register whose identifiers, raised dates and owners survive from one pack to the
  next, and a remediation tracker that ages live findings from an explicit as-of date and escalates the
  overdue ones by policy
- Assemble an executive summary whose opinion follows from the register by a written rule, and a limitations
  section built from the subgroups, bins and comparisons the suite could not measure
- Implement a graded definition of a figure in a document — excluding dates, section numbers and identifiers;
  reading thousands separators, signs, ranges, percentages and scientific notation — with the half unit
  of precision each figure claims
- Implement a gate that traces every figure in the pack to a computed result within that half unit, and
  a committee pack that refuses to render while any figure is untraceable
- Measure how a widened tolerance, an exempted class of figure or numbers read out of strings let a typed
  figure through, and explain why a figure that traces is not thereby the right figure
