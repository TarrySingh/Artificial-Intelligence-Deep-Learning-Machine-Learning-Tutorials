id: P04-L10-committee-pack
title: Assemble the committee pack from the evidence — a findings register that keeps its history, a remediation tracker that ages and escalates from an explicit date, a summary and limitations built from the findings — and a gate that traces every figure in it to a computed result or refuses to render
track: P04
flagship: ""            # programme module 10, the closing module; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track              # the tier gate, and the house shape: stubs, checks, rubric
  - P04-L01-validation-suite           # the report generator this pack extends, carried forward
  - P04-L02-model-inventory-tiering    # TierDecision, CoverageRow, parse_date
  - P04-L03-conceptual-soundness       # Finding, MonotonicityProbe, SEVERITY_ORDER
  - P04-L04-discrimination-testing     # Interval, PairedDifference, Measurability
  - P04-L05-calibration-stability-depth   # CharacteristicShift
  - P04-L06-reproduce-the-number-in-c  # the REPRODUCED / EXPLAINED / FINDING verdict
  - P04-L07-challenger-from-scratch    # Check, Audit
  - P04-L08-explainability-evidence    # the reproducibility certificate
  - P04-L09-streaming-monitor-in-c     # the monitor report and its breach bin
objectives:
  - "Implement a findings register whose identifiers, raised dates and owners survive from one pack to the next, and a remediation tracker that ages live findings from an explicit as-of date and escalates the overdue ones by policy"
  - "Assemble an executive summary whose opinion follows from the register by a written rule, and a limitations section built from the subgroups, bins and comparisons the suite could not measure"
  - "Implement a graded definition of a figure in a document — excluding dates, section numbers and identifiers; reading thousands separators, signs, ranges, percentages and scientific notation — with the half unit of precision each figure claims"
  - "Implement a gate that traces every figure in the pack to a computed result within that half unit, and a committee pack that refuses to render while any figure is untraceable"
  - "Measure how a widened tolerance, an exempted class of figure or numbers read out of strings let a typed figure through, and explain why a figure that traces is not thereby the right figure"
