id: P04-L06-reproduce-the-number-in-c
title: Reproduce a portfolio aggregate in C to the last bit, measure what left-to-right, pairwise and compensated summation each lose, and decide whether a disagreement between two teams is arithmetic or a finding
track: P04
flagship: ""            # programme module 6; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: c             # python | c | cpp
prerequisites:
  - P04-L01-validation-suite   # the support-weighted mean this lesson takes apart
  - T00-L01-the-8gb-track      # declared budgets, stubs, public checks, the rubric shape
objectives:
  - "Implement left-to-right, pairwise and Kahan-Babuska-Neumaier summation in C and reproduce a Python reference bit for bit"
  - "Measure how far each summation lands from the exactly-rounded total, in representable doubles rather than in adjectives"
  - "Demonstrate that one array summed in four different orders gives four different naive totals and one compensated total"
  - "Implement a ULP distance and a count of agreeing significant digits, and report a disagreement with both"
  - "Implement the worst-case reproduction bound and its three verdicts, and explain why only bit-for-bit equality closes a finding"
datasets: []            # none: the portfolio is synthetic, generated in lesson.c and mirrored in the notebook, declared in DATA_NOTE and printed in section 1
points: 75         # = sum of RUBRIC points in tests/test_lesson.py
# Build notes, 2026-09-16. All four gates run from the repository root on the venv
# interpreter; the measured figures at the foot were written back by tools/execute.py and
# never typed.
#
# WHAT THE SPEC ASKED FOR. MODULES.md module 6 specifies naive, pairwise and Kahan summation
# over millions of exposures spanning many orders of magnitude, the error of each measured
# against a higher-precision reference, and a reproduce() that adjudicates a stated
# difference. All of that is here. Two deliberate departures, both recorded because a reader
# of MODULES.md will notice them:
#
#   * The "exact reference accumulated in higher precision" is math.fsum, not a long double.
#     On Apple Silicon long double IS double — 53 bits, DBL_MANT_DIG == LDBL_MANT_DIG — so a
#     long double accumulator would have been a reference that silently was not one, on the
#     machine this lesson was authored and gated on. math.fsum tracks exact partial sums and
#     is documented as accurate to the last bit bar a double-rounding case it names, so every
#     check allows the compensated answer two representable steps rather than demanding zero.
#     The whole lesson would have been a lie told by its own instrument otherwise.
#   * Two of the six exercises are in Python (ulps_between, agreeing_significant_digits).
#     MODULES.md does not forbid it and the flagship's own C lesson, F15-L06, has the same
#     shape. The reason is pedagogical: the C half is where a number is computed, the Python
#     half is where a disagreement is described, and a validator needs both. The C half is
#     still four of the six exercises and 64 of the 75 points.
#
# DATA. Synthetic, generated by a counter-based splitmix64 stream seeded 20260916, in
# lesson.c and again in numpy, and declared in DATA_NOTE, printed in section 1. Every element
# is built by two exact operations — a 53-bit integer converted to a double, then a scaling by
# a power of two — so the C array and the numpy array are the SAME 64 bits, element for
# element. One rubric case (4 points) exists solely to prove it, because every other case in
# the file is worthless if it is not true. datasets: [] is therefore correct and gate 11 is
# vacuous.
#
# NUMBERS. Nothing a student sees is typed. The unit roundoff, the significand width, all
# three totals, the four orderings, the ULP distances, the digit counts, the bound and the
# ratio between the bound and the observed gap are all printed by code the student runs. The
# rubric's expected values come from references implemented in tests/test_lesson.py against a
# plain Python list — _ref_naive, _ref_pairwise, math.fsum and a private _ulps — never from
# lesson.py's helpers, so a student who redefines python_naive_sum or ulps_between cannot move
# the reference that grades them.
#
# THE MEASURED SEPARATION, on the shipped seed and N = 2,000,000 (all figures produced by the
# gates, reproduced here so a future editor can tell at a glance whether a change moved them):
# the exactly-rounded net total is 82979775.53980762; naive lands 78 representable doubles
# away, pairwise 4, compensated 0. numpy's own pairwise sum lands 1 away and is NOT the same
# double as the student's pairwise sum, which is the point of section 4. On the gross total,
# where nothing cancels, naive is 10,931 doubles out. Summed in four orders the naive total
# takes four distinct values (78, 124, 97 and 171 doubles from exact) while the compensated
# total does not move at all. The exposure-weighted mean PD — module 1's shape — is 663
# doubles out under naive summation and exact under both of the others.
#
# THE LESSON'S OWN POINT, and the reason reproduce() is not a tolerance function. The
# worst-case bound (n-1)*u*sum_abs is the only bound a report can defend, and on this
# portfolio it is 11.3 against an observed gap of 3.0e-6 — about 3.76 million times too
# loose. Section 10 therefore drops a whole position worth roughly one currency unit from the
# extract and shows the verdict staying EXPLAINED: the bound cannot see a real defect that a
# bit-for-bit comparison catches instantly (67,108,803 doubles apart, 7 agreeing digits).
# A lesson that stopped at "compute a tolerance" would have taught the opposite of validation.
#
# BUILD FLAGS ARE PART OF THE ANSWER. -ffp-contract=off and -fno-fast-math are in CFLAGS with
# a comment saying why: contraction would let the compiler fuse a multiply and an add into one
# FMA with a single rounding, so `values[i]*weights[i]` summed in place would give a different
# double on a chip with FMA than on one without, and fast-math would permit reassociating the
# very loop the lesson is about. weighted_mean() materialises its products into an array for
# the same reason. A reproducibility lesson cannot leave either at the compiler's discretion.
#
# THE COMPILED-LESSON TRAP (QUALITY.md). Section 12 carries the make clean warning, and it
# says the true thing rather than the convenient one: this binary links only the system maths
# library — the Makefile probes for -lm by linking a trivial program rather than naming a
# platform — so no absolute virtualenv path is baked into it and the dyld half of the trap
# cannot bite here. The stale-timestamp half still can, because a binary that arrives with a
# copied directory is newer than the .c beside it and make will not rebuild it. Both halves
# are stated, and lesson.c's own header repeats the instruction.
#
# GATE 3. Measured, not estimated: the longest markdown block in lesson.py is 22 non-blank
# lines (section 12, common mistakes), and the next two are 18. Thirty cells, fifteen of them
# markdown, and every one of the fifteen is followed immediately by something that runs.
#
# GATE 7. No string in lesson.py contains "solutions/" — checked by grep, not by eye. The
# student file and the reference file set their own C_SRC and BIN rather than sharing a
# switch. lesson.c is GENERATED from solutions/lesson.c by replacing the four answers with
# their stubs, so the two C files cannot drift outside those four bodies.
#
# MUTATION TESTING, 2026-09-16. 41 variants were built in a scratch directory outside the
# lesson and graded through tools/grade.py: 31 plausible-wrong mutants and 10 controls.
# All 31 mutants are caught, scoring 56% to 93% — never 0 and never 100, so partial credit
# survives every one — and all 10 controls still score 100%. The controls are correct answers
# written differently: naive_sum starting from x[0] instead of 0.0, naive_sum over a copy,
# pairwise_sum whose base case delegates to naive_sum, kahan_sum with the branch as a ternary
# and the return written c + s, reproduce() with the bound built in three statements and the
# gap taken as fabs(b - a), reproduce() without the n <= 1 branch (the arithmetic already
# gives 0.0 there), weighted_mean with its two factors swapped, ulps_between built from a
# signed struct unpack, ulps_between without the a == b shortcut (redundant, because the key
# maps both zeros to 0), and agreeing_significant_digits counted with a while loop.
#
# TWO RUBRIC DEFECTS FOUND BY THE FIRST PASS, both fixed before this file was written:
#   * reproduce() without fabs(sum_abs) scored a full 75/75. Nothing graded a negative
#     sum_abs, and a caller who hands the function the signed NET total — the figure sitting
#     beside the gross one in every reconciliation pack — would get a negative bound, making
#     gap <= bound false for every possible gap. The function would report a finding on every
#     reconciliation it was ever given, including the ones that reconcile, and would look like
#     it was working. Now graded in tests, checked in the notebook, checked again in the C
#     self-test, and the reason is stated in the stub's comment.
#   * agreeing_significant_digits skipping the exponent comparison scored a full 75/75. The
#     only exponent case in the rubric was 9.999 against 10.001, whose leading digits differ
#     anyway. 1.0 and 10.0 have IDENTICAL seventeen-digit mantissas, so without the exponent
#     test a figure and the same figure off by a factor of ten agree on every digit. That pair
#     is now a graded case in the rubric and in the notebook, and it is named in the docstring.
#
# The mutants that mattered most:
#   * kahan_sum in the unbranched 1965 form, and kahan_sum that always takes the first branch.
#     Both are correct compensated sums on almost any data and both get this portfolio's net
#     total right; they fail only where an addend exceeds the running sum. That case is graded
#     twice — in the binary's self-test and in its own 4-point rubric entry — because without
#     it the branch is unobservable and a wrong answer is indistinguishable from a right one.
#     Both score 88%.
#   * pairwise_sum splitting at a power of two, stopping at 64, recursing to single elements,
#     or putting the long half on the left. All four are good algorithms; all four are wrong
#     here. Each loses the 8-point bit-for-bit case and keeps the 3-point accuracy case, which
#     is exactly the shape the lesson argues for, and each scores 83%.
#   * reproduce() testing gap <= bound BEFORE a == b. Every check in the notebook still
#     passes, because two equal figures are also inside any bound — so the rubric hands it a
#     pair of identical figures with an enormous bound, where the two verdicts finally differ.
#   * reproduce() with a hard-coded 1e-9 tolerance, and with DBL_EPSILON in place of the unit
#     roundoff. Both survive the notebook's own verdict checks; the bound cases, which vary n
#     and sum_abs independently and pin the exact boundary, catch them.
#   * ulps_between subtracting the two ordering keys as floats. Right for small numbers and
#     silently wrong for this lesson's own totals, where a 63-bit key rounds to a multiple of
#     1024 and a gap of 78 steps reads as 0 — the same bug this author shipped in the C helper
#     on the first build, caught by the self-test rather than by reading.
#   * the generator scaling by 2^-52. It scores 56%, the lowest of the 31, because the
#     bit-identity case fails first and takes every sum with it — which is the right shape: if
#     the two sides do not hold the same array, no comparison between them means anything.
#
# ============================== INDEPENDENT REVIEW, 2026-09-16 ==============================
#
# Every file read; all four gates re-run from the repository root on the venv interpreter
# (execute PASS 2.4 s / 383 MiB against a 120 s budget; grade --solution 75/75 = 100%;
# grade student 7/75 = 9%; jupytext converts to 30 cells). The author's four-gate claim holds.
#
# MUTATION TEST OF THE RUBRIC. 36 fresh mutants and 3 fresh controls, built in a scratch
# directory outside the lesson and graded through tools/grade.py --solution. 32 of the 36 are
# caught, scoring 69% to 93% — never 0, never 100, so partial credit survives every one — and
# all 3 controls score 100%. Coverage: off-by-one loop bound, skipped first element, a mean
# where a sum belongs, a float accumulator, block size 64, base case off by one, the long half
# on the left, the unbranched 1965 compensation, compensation overwritten instead of
# accumulated, returning s instead of s + c, a sign flip on the correction, a strict < on the
# bound, the bound tested before equality, sum_abs without fabs, the unit roundoff written as
# an integer division, a hard-coded 1e-9 tolerance, a NaN swallowed into a REPRODUCED default,
# a bound with no n in it, n instead of n - 1, a signed gap, ULP keys subtracted as floats, a
# raw-bit-pattern ULP distance, a ULP function that never returns, a ULP NaN swallowed into 0,
# a ULP distance returned as a float, the exponent comparison dropped, the digit count off by
# one, the decimal point counted as a matching digit, the sign test dropped, a NaN defaulted to
# 0, a module-level accumulator reused across calls, and a relative rather than absolute bound.
#
# FOUR SURVIVORS, ALL MEASURED AND ALL EQUIVALENT — no rubric case was added for any of them,
# because each would have failed a correct answer:
#   * kahan_sum branching on fabs(s) > fabs(x) rather than >=. Measured: 200,000 random arrays
#     carrying 3,246,045 planted exact |s| == |x| adjacencies, zero bitwise differences. When
#     the magnitudes are equal the two operands are either equal or exact negatives, and both
#     branches then evaluate to the same double — 0 in every one of the four cases printed by
#     the measurement, including 1e300 against -1e300.
#   * pairwise_sum adding the right subtotal before the left. IEEE addition is commutative,
#     both subtotals are computed identically, and the mutant scores 75/75 because it IS the
#     reference.
#   * reproduce() without the n <= 1 guard. Verdicts are identical for every n in 0..3 across
#     six figure pairs; the arithmetic already gives 0.0 at n = 1. The only divergence is the
#     bound REPORTED for n = 0 (-1.11e-16 rather than 0.0), which is an empty extract, and the
#     verdict there is FINDING either way. The author already lists this variant as a control.
#   * reproduce() computing (n - 1) * (u * fabs(sum_abs)) rather than (n - 1) * u *
#     fabs(sum_abs). Measured over 4,000,000 (n, sum_abs) pairs in four magnitude bands: zero
#     differences in the ordinary band (2^-20..2^20) and zero in the huge band (~1e271..1e301);
#     the two orders diverge only once u * sum_abs reaches gradual underflow, and the largest
#     sum_abs at which they differ at all is 2.0e-292. Scaling by a power of two is exact, so
#     both associations round exactly once above that. The stub's instruction to compute the
#     bound in one stated order is therefore a convention that keeps two validators on the same
#     expression, not a numerical necessity — which is the lesson's own argument, so the wording
#     stands; it is simply not gradeable, and grading a portfolio whose absolute exposures sum
#     to 1e-300 would be theatre.
#
# THREE DEFECTS FIXED IN THIS REVIEW, none of them visible to the four gates:
#   1. THE MAGNITUDE CLAIM WAS FALSE, in a lesson whose thesis is that you measure rather than
#      type. Four student-facing places said the portfolio spans "2^-20 to 2^+20 in magnitude".
#      2^-20 is the exponent CODE floor; the mantissa is a uniform 53-bit fraction on top of
#      it, so the measured minimum magnitude is 1.335063304144248e-12 (about 2^-39.4) and
#      4.89% of the two million positions sit below 2^-20 — and the notebook prints that
#      measured range in the very next cell, three lines under the sentence contradicting it.
#      Corrected in lesson.py, solutions/lesson_solution.py, lesson.c, solutions/lesson.c and
#      two rubric hints to say the SCALE spans 2^-20 to 2^+20 and to point at the printed range.
#   2. THE SELF-CHECK ANSWERS WERE IN THE STUDENT FILE. _check_self_check carried
#      key = {1: ("b", ...), 2: ("c", ...), 3: ("b", ...), 4: ("d", ...)} in lesson.py, three
#      lines below the cell where the student types their answers, so the four questions tested
#      nothing — against QUALITY.md gate 8 and against the house style of T00-L01, which says
#      only "Answers are in this lesson's worked solution in the course repository." The marker now compares a
#      salted SHA-256 digest per question, so the instant feedback and the section pointer
#      survive and the letters do not appear in the student bundle. The worked reasoning stays
#      where it was, in the solution file.
#   3. THE LIBM PROBE WROTE TO A FIXED /tmp PATH. the probe's output file is owned by whoever
#      built first; the second user on a shared machine cannot write it, the probe fails, -lm
#      is silently dropped, and on Linux the link then fails for a reason unrelated to the
#      student's code. The probe now uses mktemp and removes its own artefact. Re-verified:
#      make clean, make paths (LIBM = -lm here), and a full reference build and self-test.
#
# VERIFIED TRUE. All five claims in claims.yaml were re-fetched on 2026-09-16 and every quote
# is verbatim at its URL: SR 26-2 carries "clarify model risk management principles and to
# emphasize a risk-based approach to model risk management that is tailored to a banking
# organization's model risk profile and the size and complexity of its operations", issued
# 17 April 2026 and superseding SR 11-7 (4 April 2011) and SR 21-8 (9 April 2021); the
# numpy.sum Notes paragraph reads as quoted including "This improved precision is always
# provided when no axis is given"; the math.fsum entry carries both the partial-sums sentence
# and the double-rounding caveat the lesson leans on for its two-ULP allowance; Crossref
# returns Kahan, Communications of the ACM 8(1):40, 1965 for DOI 10.1145/363707.363723; and
# the Manchester record returns Higham, SIAM J. Sci. Comput. 14(4):783-799, 1993. Both
# paywall notes in claims.yaml are accurate. The solution does what the prose claims: the
# reference binary's own totals, orderings and verdicts were reproduced here.
#
# AGAINST MODULES.md MODULE 6. Naive, pairwise and Kahan over two million exposures, error of
# each measured against a higher-precision reference, reproduce() adjudicating a stated
# difference, graded by a test binary, make clean warning present, C, tier cpu8, 120 s budget —
# all as specified. Both declared departures stand up: long double IS double here (the binary
# prints LDBL_MANT_DIG next to DBL_MANT_DIG, so the student sees it rather than being told),
# and the two Python exercises are 11 of 75 points and belong on the reporting side of the
# lesson. No further deviation found.
#
# WHAT THE GATES STILL CANNOT SEE, and is fine: the longest markdown block is 23 non-blank
# prose lines (section 12) against a ~40-line ceiling, 15 markdown cells each followed
# immediately by something that runs, all six stubs carry a docstring, a worked example and a
# requirements list, no check message says "assertion failed", no student-facing string
# contains "solutions/", and both prerequisite ids resolve to real lessons on disk.
