id: P04-L06-reproduce-the-number-in-c
title: Reproduce a portfolio aggregate in C to the last bit, measure what left-to-right, pairwise and
  compensated summation each lose, and decide whether a disagreement between two teams is arithmetic or
  a finding
track: P04
flagship: ''
tier: cpu8
budget_seconds: 120
language: c
prerequisites:
- P04-L01-validation-suite
- T00-L01-the-8gb-track
objectives:
- Implement left-to-right, pairwise and Kahan-Babuska-Neumaier summation in C and reproduce a Python reference
  bit for bit
- Measure how far each summation lands from the exactly-rounded total, in representable doubles rather
  than in adjectives
- Demonstrate that one array summed in four different orders gives four different naive totals and one
  compensated total
- Implement a ULP distance and a count of agreeing significant digits, and report a disagreement with
  both
- Implement the worst-case reproduction bound and its three verdicts, and explain why only bit-for-bit
  equality closes a finding
