claims:
- id: interagency-mrm-guidance-2026-conceptual-soundness
  claim: On 17 April 2026 the Federal Reserve Board, the OCC and the FDIC jointly issued revised guidance
    on model risk management, carried by the OCC as Bulletin 2026-13. It names model validation and monitoring,
    including validating conceptual soundness and outcomes analyses, among the practices it addresses.
    This lesson builds the conceptual-soundness half of that pair; P04-L01 built the outcomes half.
  where: lesson.py section 1 (the one sentence of regulatory context in the notebook)
  source_url: https://www.occ.gov/news-issuances/bulletins/2026/bulletin-2026-13.html
  source_title: 'OCC Bulletin 2026-13: Model Risk Management — Revised Interagency Guidance'
  quote: model validation and monitoring, including validating conceptual soundness and outcomes analyses
  accessed: 2026-09-16
- id: interagency-mrm-guidance-2026-date-and-supersession
  claim: The Federal Reserve carries the same 17 April 2026 interagency guidance as SR 26-2, and it supersedes
    SR 11-7 of 4 April 2011 and SR 21-8 of 9 April 2021. The agencies say they updated it to clarify model
    risk management principles and to emphasise a risk-based approach tailored to a banking organisation's
    model risk profile. The lesson cites the date only; it makes no claim about what the guidance requires
    beyond the quoted sentence in the claim above.
  where: lesson.py section 1; programmes/model-risk/README.md gives the fuller account
  source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602.htm
  source_title: 'SR 26-2: Revised Guidance on Model Risk Management — Board of Governors of the Federal
    Reserve System'
  quote: clarify model risk management principles and to emphasize a risk-based approach to model risk
    management
  accessed: 2026-09-16
- id: leakage-survey-17-fields-329-papers
  claim: A systematic survey of leakage in machine-learning-based science found errors in 17 fields, collectively
    affecting 329 papers. The lesson cites this once, as the motivation for scanning every feature against
    the target every time an extract is rebuilt. It makes no claim about the rate of leakage in banking
    models, for which it has no source.
  where: lesson.py section 6 (the two sentences introducing exercise 5)
  source_url: https://arxiv.org/abs/2207.07048
  source_title: Kapoor and Narayanan — Leakage and the Reproducibility Crisis in ML-based Science (2022)
  quote: 17 fields where errors have been found, collectively affecting 329 papers and in some cases leading
    to wildly overoptimistic conclusions.
  accessed: 2026-09-16
