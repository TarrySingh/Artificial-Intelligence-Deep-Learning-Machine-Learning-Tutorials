id: P04-L03-conceptual-soundness
title: Build the probes that review a model's conceptual soundness by running it — feature use, variable reconciliation, monotonicity and domain counterexamples, leakage, contamination, a trivial-baseline margin, and the finding register they generate
track: P04
flagship: ""            # programme module 3; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P04-L01-validation-suite
objectives:
  - "Implement a feature-use recorder that reports which inputs an implementation actually reads, across branches and through .get()"
  - "Implement a reconciliation that separates undocumented variables, unused documented variables, features unavailable at decision time and features absent from the catalogue"
  - "Implement a monotonicity prober and a domain prober that search a documented specification for counterexamples, and keep a crash apart from a wrong-way move"
  - "Implement mechanical checks for target leakage, train/test contamination by duplicate rows, and a stated margin over a trivial baseline"
  - "Generate a severity-rated finding register from those results, and explain why its severities must come from policy rather than from the code that writes it"
datasets: []            # none: both extracts, the specification and the implementation under review are synthetic, generated in the notebook, declared in DATA_NOTE and printed at the head of the run
points: 122        # = sum of RUBRIC points in tests/test_lesson.py
# Build notes, 2026-09-16. All four gates run from the repo root on the venv interpreter; the
# measured figures below were written back by tools/execute.py and never typed.
#
# What the module map specified, and what was built. MODULES.md specifies module 3 as a
# monotonicity prober, a domain prober, a variable reconciliation and a severity-rated
# soundness_findings() over a documented specification with a planted discrepancy. All four
# are here, and three further mechanical checks were added because the commissioning brief
# named them and they belong to the same review: scan_leakage (target leakage), duplicate
# contamination between the two extracts, and a trivial-baseline margin test. The
# feature-availability-at-inference-time check the brief asks for is not a separate function;
# it is two of the five fields of reconcile_variables, graded by two rubric cases, because
# availability is a fact about the variables the implementation READS and nothing else. Eight
# exercises, 37 rubric cases, 122 points.
#
# Data: both extracts are synthetic, generated by numpy.random.default_rng(20260916) inside
# the notebook. DATA_NOTE says so and the notebook prints it. datasets: [] is therefore
# correct and gate 11 is vacuous.
#
# Numbers: nothing a student sees is typed. Every rubric expectation is hand-worked here
# (Brier 0.0625 against a baseline of 0.25; an AUC of exactly 0.875 from four negatives at
# 0, 1, 2, 3 and four positives at 2.5, 2.5, 4, 5; a 1/3 wrong-way step on a four-point grid)
# and no case depends on the notebook's synthetic extract, so a change to the generator
# cannot silently break grading.
#
# The planted discrepancies, which the student's own probes find rather than being told:
#   * arrears_90d_next_month — read by the implementation, absent from the documented variable
#     list, and staged post_decision in the feature catalogue. It is also the extract's
#     leakage flag. The notebook opens by scoring the same records with and without it.
#   * channel_code — read by the implementation, undocumented, and absent from the catalogue
#     altogether, which is a DIFFERENT finding from "known to be late" and is filed as one.
#   * region_index — documented, and never read.
#   * a 12.0 / months_on_book term, which raises ZeroDivisionError at the documented domain
#     boundary of 0 and also breaks the documented decreasing direction below 40 months. No
#     live record has months_on_book = 0, which is why three years of outcomes analysis never
#     found it and a domain sweep finds it in 25 calls.
#   * a quadratic income term that reverses the documented decreasing direction above ~92k.
#   * an "expert overlay" returning 1.05 for prior_defaults >= 4, a value no live record has,
#     so it is an impossible-return finding and not a monotonicity one.
# The reference run raises 12 findings, 4 critical, from those five plus the contamination and
# the baseline margin.
#
# Mutation testing, 2026-09-16. 25 plausible-wrong variants of the reference solution were
# built in a scratch directory outside the lesson and graded. All 25 are caught, every one
# keeps partial credit, and scores run from 90% to 98% — never 0 and never 100. Four controls,
# each a correct answer written a different way, all still score 100%: the leakage ordering
# done as a stable two-pass sort instead of one composite key, the contamination set built by
# comprehension instead of map, the reconciliation written with membership tests instead of
# set algebra, and the domain failures accumulated under a different name and chained at the
# end. The rubric rejects wrong answers without rejecting differently-shaped right ones.
#
# The variants that mattered most, and what each cost:
#   * a recorder overriding only __getitem__, so a .get(name, default) read is reported as an
#     unused feature — which would have certified the planted leak as absent. 119/122.
#   * `catalogue.get(n) != "application"`, merging "staged after the decision" with "nobody
#     catalogued it": it passes every other reconciliation case. 119/122.
#   * a monotonicity prober scoring a raising grid point as 0.0 instead of skipping it, and
#     one with the increasing/decreasing sign flipped. 118/122 and 111/122.
#   * a prober that mutates the caller's base row — the only case that catches it. 120/122.
#   * n_tested counting failures rather than calls; domain failures re-sorted by variable
#     name, which makes the register order depend on the alphabet. 119/122 each.
#   * domain bounds made exclusive, so a model returning exactly 0.0 or 1.0 is a finding.
#     115/122.
#   * scan_leakage flagging on `auc >= threshold` rather than `max(auc, 1 - auc)`, which
#     misses perfect separation pointing downwards. 118/122.
#   * duplicate_contamination matching on values rounded to three decimals, and one that never
#     counts a within-test repeat. 119/122 each.
#   * baseline_margin_check clamping a negative skill at 0.0. 118/122.
#   * soundness_findings with hard-coded severities, 115/122: it fails the case that re-grades
#     the same evidence under a second policy, which is why that case exists.
#
# One defect the mutation run found and fixed rather than merely confirmed. A register sorting
# on the severity STRING scored a clean 122/122, because "critical" < "high" < "medium" is the
# same order alphabetically as by rank — the coincidence only breaks at "low", which ranks last
# and sorts third, and no bundle in the rubric produced a "low" finding. test_findings_sort_order
# now re-grades the same evidence under a policy that assigns "low" and "medium" to two rules
# and asserts the medium one comes first; the mutant drops to 119/122.
#
# Known limits, for the owner:
#   * auc_by_ranks is given, not graded, exactly as in P04-L01. Module 4 is specified to build
#     it with the tie handling and the confidence interval.
#   * the feature-use recorder catches reads through __getitem__ and .get(). An implementation
#     that unpacks the row with ** or iterates its keys defeats it. The notebook says so in
#     common mistakes; making the recorder total would need a Mapping ABC subclass and would
#     stop teaching the thing it is there to teach.
#   * the monotonicity prober is a grid search, so it can miss a violation narrower than the
#     grid step. That is stated in the docstring and is the honest property of the method;
#     a claim of "monotone" from this probe is a claim about the points it tested.
#   * worst run of prose before the next runnable cell, measured across CONSECUTIVE markdown
#     cells rather than one at a time: 32 non-blank lines (section 12, the five self-check
#     questions), then 23 (the header) and 19 (section 11, common mistakes, which is split by
#     a runnable one-row-probe demonstration). All inside gate 3's ~40. The self-check ran to
#     41 before a runnable reproducibility demonstration was put between it and the closing
#     paragraph; that cell runs the whole review twice and diffs the two registers.
#   * the untouched student file scores 0/122 with all 37 cases reporting TODO and none
#     reporting ERROR, so a student who has written nothing is told what to write rather than
#     handed a traceback.
#
# INDEPENDENT REVIEW, 2026-09-16. All four gates re-run from the repo root on the venv
# interpreter, not taken on trust: execute PASS (0.1 s, 40 MiB against a 120 s / 8 GiB budget),
# grade --solution 122/122, grade on the student file 0/122 with all 37 cases TODO and none
# ERROR, jupytext converts. Claims re-verified against the primary sources by fetching all
# three URLs: OCC Bulletin 2026-13 (17 April 2026, FRB/OCC/FDIC) carries the quoted sentence
# verbatim; SR 26-2 carries the same date, the supersession of SR 11-7 and SR 21-8, and the
# quoted purpose; arXiv 2207.07048 (Kapoor and Narayanan, 2022) carries "17 fields ...
# collectively affecting 329 papers" verbatim. Prerequisites both resolve to real lesson ids.
# Worst consecutive-markdown prose run re-measured at 32 lines, inside gate 3's ~40. Points
# re-summed from the RUBRIC: 37 cases, 122 points, matching the field above.
#
# A fresh mutation run of 25 plausible-wrong variants plus 5 controls, written independently of
# the author's list in a scratch directory outside the lesson. 25 of 25 caught, scores 90.2% to
# 98.4%, never 0 and never 100, so partial credit survives every one. All 5 controls — the
# reconciliation by membership tests, the leakage ordering as a stable two-pass sort, the
# contamination set by comprehension, the monotonicity worst-pair accumulated then maximised,
# and the severity lookup via try/KeyError — still score 122/122.
#
# TWO SURVIVORS, both real defects, both now fixed. They were the same hole seen twice:
# test_mono_skips_raising_points asserted only n_skipped and violated is False, and on the
# function it used, violated is False was the right answer anyway, so nothing discriminated
# between a probe that DROPS an unevaluable grid point and one that counts it in n_skipped and
# then leaves it in the sequence.
#   * `except Exception: skipped += 1; score = 0.0` (no continue) scored 122/122. On this
#     lesson's own model it changes the months_on_book MONO finding from a wrong-way move of
#     0.025211 to 0.113146 — a wrong figure in the register the whole lesson builds.
#   * `if not math.isfinite(score): skipped += 1` (no continue) also scored 122/122, admitting
#     nan to the comparison; every violation involving it evaluates False and is silently lost.
# The fix adds a second half to that case: the unevaluable point sits in the MIDDLE of the grid
# (0.0, 0.25, 0.5, 0.75, 1.0 scoring 0.0, 0.9, unevaluable, 0.1, 0.2) so the pair that brackets
# it is the only wrong-way move there is. The reference drops the point and reports
# worst_violation 0.8 at (0.25, 0.75, 0.9, 0.1); the first mutant reports 0.9 at (0.25, 0.5),
# the second reports no violation at all. Both now score 118/122. The same case was added to
# the notebook's public _check_monotonicity, so a student meets it before the grader does.
#
# One further correction. The header prose said the specification and the implementation "do
# not agree, in four separate ways ... nobody is going to tell you which four". The reference
# run raises 12 findings from at least six planted discrepancies, so the typed four was both
# wrong and a number in prose that the student's own run contradicts. Reworded to commit to no
# count; claims.yaml's matching "four planted defects" corrected to "several".
