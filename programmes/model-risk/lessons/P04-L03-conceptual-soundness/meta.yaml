id: P04-L03-conceptual-soundness
title: Build the probes that review a model's conceptual soundness by running it — feature use, variable
  reconciliation, monotonicity and domain counterexamples, leakage, contamination, a trivial-baseline
  margin, and the finding register they generate
track: P04
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- Implement a feature-use recorder that reports which inputs an implementation actually reads, across
  branches and through .get()
- Implement a reconciliation that separates undocumented variables, unused documented variables, features
  unavailable at decision time and features absent from the catalogue
- Implement a monotonicity prober and a domain prober that search a documented specification for counterexamples,
  and keep a crash apart from a wrong-way move
- Implement mechanical checks for target leakage, train/test contamination by duplicate rows, and a stated
  margin over a trivial baseline
- Generate a severity-rated finding register from those results, and explain why its severities must come
  from policy rather than from the code that writes it
before_you_start:
  assumed:
  - write a Python class that subclasses dict and overrides a special method such as __getitem__
  - read a model specification given as a table of variables, allowed ranges and the expected direction
    of each variable's effect
  - explain what a train/test split is for
  resources:
  - title: SR 26-2 Revised Guidance on Model Risk Management (the attachment)
    by: Federal Reserve, OCC and FDIC (hosted by the Federal Reserve), 17 April 2026; supersedes SR 11-7
    url: https://www.federalreserve.gov/supervisionreg/srletters/sr2602a1.pdf
    kind: free
    why: 'section V, ''Conceptual Soundness'': what a validator is expected to assess and document about
      design, assumptions and data selection, and the role of benchmarking and interpretability measures'
  - title: SS1/23 Model risk management principles for banks
    by: Prudential Regulation Authority, Bank of England
    url: https://www.bankofengland.co.uk/prudential-regulation/publication/2023/may/model-risk-management-principles-for-banks-ss
    kind: free
    why: 'Principle 3 (model development, implementation and use) and Principle 4 (independent model validation):
      what a validator is expected to test, which the lesson''s probes turn into code'
  - title: Common pitfalls and recommended practices (scikit-learn user guide)
    by: scikit-learn developers
    url: https://scikit-learn.org/stable/common_pitfalls.html
    kind: free
    why: 'section 12.2 ''Data leakage'': information unavailable at prediction time, and how leakage inflates
      a test score'
  - title: 'Data model: emulating container types (Python language reference)'
    by: Python Software Foundation
    url: https://docs.python.org/3/reference/datamodel.html
    kind: free
    why: 'section 3.3.7, Emulating container types: the special methods (__getitem__, __contains__, __iter__
      and others) a dict-like recorder can override'
datasets: []
