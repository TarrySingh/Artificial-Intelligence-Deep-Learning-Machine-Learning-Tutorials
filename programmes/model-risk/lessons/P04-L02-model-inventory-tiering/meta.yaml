id: P04-L02-model-inventory-tiering
title: Build the model inventory schema, a risk tiering with an audit trail that reconstructs every decision, a reconciliation against what is actually running, and the coverage report that names the models nobody has validated
track: P04
flagship: ""            # programme module 2; feeds no flagship yet
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P04-L01-validation-suite
objectives:
  - "Implement a model record schema validator that reports every defect in every record rather than stopping at the first"
  - "Implement tier(record, policy) over materiality, complexity, exposure, reversibility and human override, with the policy passed in and every boundary defined"
  - "Produce an audit trail that reconstructs a tier decision from the record and the policy alone, including the escalation rule when it applies"
  - "Reconcile an inventory against a runtime registry and name the models running outside it"
  - "Generate the inventory report from the measured results, and explain why a model with no validation on file is a coverage finding and not a schema error"
datasets: []            # none: the inventory and the runtime registry are synthetic, generated in the notebook, declared in DATA_NOTE and printed at the head of the report
points: 121        # = sum of RUBRIC points in tests/test_lesson.py
# Build notes, 2026-09-16. All four gates run from the repo root on the venv interpreter; the
# measured figures below were written back by tools/execute.py and never typed.
#
# Spec conformance. MODULES.md specifies this module as: a model record schema with a
# validator that names every record that fails it; tier(record, policy) over materiality,
# complexity, exposure and the reversibility of the decision, with the policy passed in and
# the boundary cases graded; reconcile(inventory, runtime_registry) producing three lists; and
# a tier distribution report generated from the result. All four are built.
#
# Two deliberate deviations, both additive:
#   * a FIFTH tiering attribute, human_override, is scored alongside the four MODULES.md
#     names. The brief that commissioned this lesson lists "materiality, autonomy, exposure,
#     reversibility"; MODULES.md lists complexity in autonomy's place. Rather than choose, the
#     lesson scores both — complexity because SS1/23 names it explicitly, human override
#     because it is what makes an irreversible decision irreversible in practice. It is also
#     what the escalation rule keys on, so it earns its place in the grading.
#   * reconcile() returns a FOURTH list, decommissioned_running: identifiers the inventory
#     records as switched off that production is still running. It is the same finding as
#     runtime_only from the other direction and costs one line to grade.
# Both are declared as non-claims in claims.yaml; neither is attributed to any regulator.
#
# Data: every record and every runtime identifier is synthetic, generated by
# numpy.random.default_rng(20260916) inside the notebook. Four records are deliberately
# damaged — one field removed, one value outside its enumeration, one negative exposure, one
# duplicated id — so the validator has something to find. DATA_NOTE says the whole extract is
# synthetic, the notebook prints it, and render_inventory_report puts it in section 1 of every
# report, so a reader of the artefact cannot mistake it for a real firm's book. datasets: []
# is therefore correct and gate 11 is vacuous.
#
# Numbers: nothing a student sees is typed. The report's figures come from the run. Every
# expected value in the rubric is worked out by hand from POLICY, in a comment above the case,
# against records built inside the test file — the rubric never reads the notebook's synthetic
# inventory, so a change to the generator cannot silently break grading and a student cannot
# pass by special-casing a model id.
#
# Mutation testing, 2026-09-16. 23 plausible-wrong variants of the reference solution were
# built in a scratch directory outside the lesson and graded; all 23 are caught, and every one
# keeps partial credit — scores run from 84% to 98%, never 0 and never 100. The four hardest,
# by score: human_override dropped from the total, 84%; the escalation applied as an assignment
# rather than a floor, 88%; the exposure band scored with > instead of >=, 89%; the inventory
# validator stopping at the first failing record, 93%. Four controls, each a correct answer
# written a different way, all still score 100%: the exposure band found by a reversed scan
# with a break instead of a full walk, months elapsed computed from absolute month indices
# instead of a component subtraction, duplicate ids counted with list.count instead of a
# running tally, and the reconciliation's three lists built by comprehension instead of set
# difference.
#
# The variants, by exercise:
#   1. returning at the first defect; isinstance(v, int) accepting a boolean exposure; treating
#      last_validated=None as a missing field, which moves the coverage finding into the schema
#      report where nobody reads it; type-checking a field that is absent, so one missing field
#      produces two messages; leaving the messages unsorted.
#   2. reporting only the first failing record; attaching the duplicate message to the second
#      occurrence only, so a report keyed by id shows the clean record as clean; keying a
#      nameless record by its index rather than by "<record i>"; accepting a dict of records.
#   3. scoring the exposure band with > instead of >=, so a model on a threshold sits one band
#      low; applying the escalation as an assignment rather than min(), which demotes a tier 1
#      model to tier 2 and improves the aggregate distribution; omitting the escalation line
#      when it changes nothing; dropping human_override from the score; dict.get(value, 0) for
#      an unrecognised materiality, which makes the firm's most dangerous model its safest;
#      recording the POST-escalation tier on the cut line, which erases the override from the
#      trail; rendering the exposure band's threshold instead of the record's own figure.
#   4. returning runtime_only as the models in the inventory and not running — the two lists
#      the wrong way round; letting the LAST record's status win on a duplicated id, which
#      turns a live model into a decommissioned-and-still-running finding or hides a real one.
#   5. months elapsed without the day-of-month adjustment, so six months and a day short reads
#      as six; >= for the overdue test, which reports every model as late on the day it falls
#      due; including decommissioned models in coverage, where a switched-off model with no
#      validation on file becomes a finding.
#   6. recomputing the tier distribution from the tiers dict's own keys, so an empty tier gets
#      no row; printing nothing when a dangerous list is empty, which a reader cannot tell
#      from an omission; naming only the first missing key in the ValueError.
#
# One defect the first full grading run found and fixed, rather than merely confirmed:
#   * the single-attribute-flip case originally asserted that every one-step move added
#     exactly one point. Moving materiality from medium to high adds TWO under this policy, so
#     the reference solution failed its own rubric at 97%. The case now carries the expected
#     score per attribute, worked out from POLICY, and still asserts the tier flip — which is
#     the property the case exists for.
#
# Known limits, for the owner:
#   * the POLICY weights, the cuts and the escalation rule are a teaching policy with no
#     primary source, and claims.yaml records all three as deliberate non-claims. SS1/23 gives
#     the SHAPE of a tiering approach and leaves the calibration to the firm; this lesson
#     teaches the shape and grades the boundaries.
#   * validate_inventory keys by model_id, so two records sharing an id collapse to one entry
#     in its result. The duplicate is reported on that entry and the notebook's own check
#     covers it, but a firm with three copies of one id sees one row. Left as is: fixing it
#     would mean keying by position and losing the property that the result reads like the
#     inventory.
#   * worst run of prose before the next runnable cell, measured: 32 non-blank lines (section
#     10, the five self-check questions), then 24 (the header) and 18 (section 9, common
#     mistakes). All inside gate 3's ~40. Section 9 is split by a runnable demonstration of
#     exposure-only tiering rather than running on into section 10.
#
# Independent review, 2026-09-16. All four gates re-run from the repo root: execute PASS
# (0.1s, 33 MiB against a 90s / 8 GiB budget), solution 121/121, student stub 0/121, jupytext
# converts. 30 fresh mutants and 5 controls were built in a scratch directory outside the
# lesson and graded. 25 mutants were already caught (73%-98%, every one keeping partial
# credit); FIVE scored 100% and were rubric defects, now fixed in tests/test_lesson.py:
#   * a validator that returns as soon as it has collected the missing fields — no case
#     combined an absent field with a bad value on a present one. test_validate_missing_
#     field_not_double_reported now grades a record with one missing field and three bad
#     values (mutant 100% -> 98%).
#   * the coverage section rendered without its parenthetical tail, and the coverage section
#     rendered empty — the rubric never looked at section 5 of the page at all.
#     test_report_uses_findings_only now pins all three coverage lines (100% -> 96%).
#   * section 4's two counts printed the wrong way round — the probe's `both` and
#     `inventory_only` were both length 2, so the swap was invisible. The probe's
#     inventory_only is now length 3 (100% -> 96%).
#   * the findings block emitted in an order other than the documented one.
#     test_report_findings_block now pins the relative order of the five findings
#     (100% -> 98%).
# One survivor is genuinely EQUIVALENT, not a defect: attaching the duplicate-id message to
# the later copies only. validate_inventory keys by model_id and the last record carrying an
# id overwrites the earlier entries, and that last record gets the message either way — a
# differential test over 3,375 exhaustive three-record inventories and 5,000 randomised ones
# found 0 observable differences. This is the keying limit the author already records above,
# and it makes the "second occurrence only" line in the build notes above an overstatement.
# Point totals are unchanged at 121; the reference still scores 100% and all 5 controls
# (including two new ones) are unharmed. Claims spot-checked: OCC Bulletin 2026-13 fetched
# and its quote, date and $30bn line confirmed verbatim, including that it says nothing about
# inventories or tiering — which claims.yaml itself states; SS1/23's Principle 1 ordering and
# the 1.3(a) tiering sentence corroborated (the PDF would not render to text through the
# fetch tool, so 1.3(b)(i)'s "number of customers" phrasing, which appears only in
# claims.yaml's quote_context and in no prose the student reads, is unverified). Prose runs
# re-measured independently: 32 / 24 / 18 lines, inside gate 3. Prerequisites both resolve
# (lessons/T00-L01-the-8gb-track, programmes/model-risk/lessons/P04-L01-validation-suite).
status: reviewed        # draft | executed | reviewed | shipped
