id: P04-L02-model-inventory-tiering
title: Build the model inventory schema, a risk tiering with an audit trail that reconstructs every decision,
  a reconciliation against what is actually running, and the coverage report that names the models nobody
  has validated
track: P04
flagship: ''
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- Implement a model record schema validator that reports every defect in every record rather than stopping
  at the first
- Implement tier(record, policy) over materiality, complexity, exposure, reversibility and human override,
  with the policy passed in and every boundary defined
- Produce an audit trail that reconstructs a tier decision from the record and the policy alone, including
  the escalation rule when it applies
- Reconcile an inventory against a runtime registry and name the models running outside it
- Generate the inventory report from the measured results, and explain why a model with no validation
  on file is a coverage finding and not a schema error
