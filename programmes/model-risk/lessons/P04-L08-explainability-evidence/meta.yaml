id: P04-L08-explainability-evidence
title: Build permutation importance with a spread and the grouped version correlated features need, partial
  dependence and a measure of how much of it is extrapolation, exact Shapley attributions by enumeration,
  and a reproducibility check that regenerates the explanation pack in fresh processes byte for byte
track: P04
flagship: ''
tier: cpu8
budget_seconds: 240
language: python
prerequisites:
- T00-L01-the-8gb-track
- P04-L01-validation-suite
objectives:
- Implement permutation importance on held-out data with a repeat count and a reported spread, and measure
  why two strongly correlated features each receive little of the importance their pair carries until
  they are permuted together
- Implement one- and two-dimensional partial dependence, and measure the share of its evaluation points
  that fall outside the region the data occupies
- Implement exact Shapley attributions by enumerating every coalition under a stated baseline value function,
  verify that they sum to the prediction minus the baseline value, and measure how the cost grows with
  the number of features
- Implement a canonical serialisation and a reproducibility check that regenerates the explanation pack
  in fresh processes and asserts byte equality
- Explain why a check that regenerates in the same process certifies a pack whose figures depend on the
  process hash seed
before_you_start:
  assumed:
  - train a simple model (for example a logistic regression written in numpy) and call its prediction
    function on a numpy array
  - write a loop over all subsets of a small set of indices (for example with itertools.combinations)
  - run one Python script from another with subprocess and read what it prints
  resources:
  - title: Interpretable Machine Learning
    by: Christoph Molnar (free online book)
    url: https://christophm.github.io/interpretable-ml-book/
    kind: free
    why: the chapters Permutation Feature Importance, Partial Dependence Plot (PDP) and Shapley Values,
      including how correlated features and extrapolation distort each of the first two
  - title: A Unified Approach to Interpreting Model Predictions
    by: Lundberg and Lee (NeurIPS 2017)
    url: https://arxiv.org/abs/1705.07874
    kind: free
    why: introduces SHAP and the additive-attribution properties (including attributions summing to prediction
      minus baseline) that the lesson checks on exact Shapley values
  - title: 'Command line and environment: PYTHONHASHSEED (Python documentation)'
    by: Python Software Foundation
    url: https://docs.python.org/3/using/cmdline.html
    kind: free
    why: the PYTHONHASHSEED entry explains hash randomisation, why set and dict-of-string order can differ
      between processes, and how to pin it
  - title: 'json: JSON encoder and decoder (Python documentation)'
    by: Python Software Foundation
    url: https://docs.python.org/3/library/json.html
    kind: free
    why: json.dumps with sort_keys, separators and ensure_ascii, the knobs of a canonical serialisation
      that gives the same bytes every run
datasets:
