claims:
- id: milford-haven-alarm-flood
  claim: 'The UK Health and Safety Executive''s information sheet on alarm handling, written after the
    1994 explosion and fires at the Texaco Milford Haven refinery, records that in the last eleven minutes
    before the explosion two operators had to recognise, acknowledge and act on 275 alarms, and lists
    "There were too many alarms and they were poorly prioritised" first among the key factors that emerged
    from HSE''s investigation (the quotation is verbatim; an earlier wording paraphrased it inside quotation
    marks). The lesson uses this as the reason a false alarm is not merely a small recurring cost: an
    alarm system that raises more alarms than a human can act on stops being an alarm system.'
  where: lesson.py section 7 (put a price on every cell of the matrix)
  source_url: https://www.hse.gov.uk/pubns/chis6.pdf
  source_title: Better alarm handling — HSE information sheet, Chemicals Sheet No 6 (CHIS6)
  quote: In the last 11 minutes before the explosion the two operators had to recognise, acknowledge and
    act on 275 alarms.
  accessed: 2026-09-23
- id: alarm-rate-target
  claim: 'The same HSE information sheet sets an alarm rate target, attributed to page 37 of the EEMUA
    guide that HSE contributed to and recommends: during normal operation the long-term average should
    be no more than one alarm every ten minutes, and no more than ten displayed in the first ten minutes
    after a major plant upset. The lesson quotes the first figure only, as evidence that the budget for
    credible alarms is small, countable and set by human attention rather than by a model''s confidence.'
  where: lesson.py section 7 (the false-alarm bullet)
  source_url: https://www.hse.gov.uk/pubns/chis6.pdf
  source_title: Better alarm handling — HSE information sheet, Chemicals Sheet No 6 (CHIS6)
  quote: the long-term average alarm rate during normal operation should be no more than one every ten
    minutes; and no more than ten displayed in the first ten minutes following a major plant upset
  quote_context: 'Step 1: find out if you have a problem — ''Alarm rate targets'' box, citing page 37
    of the EEMUA guide'
  accessed: 2026-09-23
