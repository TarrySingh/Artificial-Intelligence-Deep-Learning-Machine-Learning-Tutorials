id: P03-L08-drift-and-the-alarm-audit
title: Tell a moved instrument from a moved duty point from a fleet that is genuinely older, apply the
  one fix each of them needs, and re-derive the alarm threshold from the plant's own audited prices
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
- P03-L07-ot-network-deployment
objectives:
- Implement reference_bins and psi so a drift statistic is computed on bins taken from the reference alone,
  and measure this plant's own alert level by scoring the reference window against itself
- Implement conditional_psi so a drift explained by the duty point disappears and a drift inside a duty
  point does not, and so a duty point the reference never contained raises rather than being scored
- Implement diagnose_drift in the order that makes a moved instrument outrank a moved duty point, and
  explain why every other statistic is untrustworthy once the check standard has moved
- Implement the three fixes and measure, from a sixteen-cell cost matrix, what applying the wrong one
  to the right diagnosis costs on this fleet
- Implement estimate_prices so a class the audit barely saw keeps the kick-off guess and is reported as
  one, and re-derive module 1's threshold from the audited prices
before_you_start:
  assumed:
  - bin a 1-D array by quantile edges with np.quantile and np.digitize, and turn the counts into proportions
  - compare two histograms of the same variable and describe where they differ
  - compute a mean cost per category from a list of records, and say why the mean of right-skewed values
    sits above the median
  resources:
  - title: 'Failing Loudly: An Empirical Study of Methods for Detecting Dataset Shift'
    by: Rabanser, Günnemann and Lipton (NeurIPS 2019)
    url: https://arxiv.org/abs/1810.11953
    kind: free
    why: 'detecting a shift in the input data without labels: per-feature two-sample tests and dimensionality
      reduction, the setting this lesson is in after the diode'
  - title: 'Learning under Concept Drift: A Review'
    by: Lu, Liu, Dong, Gu, Gama and Zhang (IEEE TKDE)
    url: https://arxiv.org/abs/2004.05785
    kind: free
    why: 'the taxonomy of drift: a change in the input distribution (virtual drift, covariate shift) versus
      a change in the input-to-outcome relation'
  - title: Statistical Properties of Population Stability Index
    by: Bilal Yurdakul (Western Michigan University dissertation, open access)
    url: https://scholarworks.wmich.edu/dissertations/3208/
    kind: free
    why: what the population stability index measures, its 0.10 and 0.25 rules of thumb, and the point
      that they are used with no stated Type I or Type II error rate
  - title: Think Stats, 2nd edition
    by: Allen B. Downey (Green Tea Press; free online)
    url: https://greenteapress.com/thinkstats2/html/index.html
    kind: free
    why: 'the estimation chapter: the estimation game and sampling distributions, why a price averaged
      from a handful of audit rows cannot be trusted'
datasets:
