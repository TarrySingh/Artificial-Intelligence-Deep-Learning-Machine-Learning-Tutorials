claims:
- id: check-standard-baseline
  claim: 'The NIST/SEMATECH e-Handbook of Statistical Methods describes a check standard as a tool for
    controlling the bias and long-term variability of a measurement process against a baseline established
    from the check standard''s own history. Section 7 of the lesson takes that literally: `baseline.check_level`
    is the kick-off median of the instrument self-test readings, and the `rebaseline` fix re-zeros each
    channel against it. The lesson''s claim that a sensor drift cannot be told from a machine drift by
    the feature distribution alone, and needs an independent reference, rests on this idea and is stated
    as an argument in section 5 rather than attributed to the source.'
  where: lesson.py section 5 (why the check reading is in the signature), section 7 (adjust_feature, the
    rebaseline branch)
  source_url: https://www.itl.nist.gov/div898/handbook/mpc/section1/mpc12.htm
  source_title: NIST/SEMATECH e-Handbook of Statistical Methods, 2.1.2 What is a check standard?
  quote: It is a device for controlling the bias and long-term variability of the process once a baseline
    for these quantities has been established from historical data on the check standard.
  quote_context: Opening paragraph, under the heading "A check standard is useful for gathering data on
    the process". The same paragraph adds that check standard methodology is "a tool for collecting data
    on the measurement process to expose errors that afflict the process over time".
  accessed: 2026-09-22
- id: ongoing-monitoring-is-part-of-validation
  claim: As of 2026-10-02 the current US interagency model risk guidance is the Revised Guidance on Model
    Risk Management issued on 17 April 2026 by the Federal Reserve (as SR 26-2), the OCC and the FDIC.
    Its section V, Model Validation and Monitoring, lists ongoing model monitoring as one of three components
    of model validation, alongside conceptual soundness and outcomes analysis; defines it as evaluating
    whether a model is still performing as expected given changes in the conditions around it; and says
    that a model which no longer performs as expected may warrant overlays, adjustment or redevelopment.
    The lesson's framing — that the monitoring loop is part of the model's deliverable and not an optional
    extra, and that what it feeds is a choice of fix (re-baseline, condition, re-price) rather than an
    alarm — is this idea applied to a plant rather than a bank. The lesson does not claim that this guidance
    applies to industrial condition monitoring; it is cited as the place the argument is made explicitly.
    Until 2 October 2026 this entry quoted the 2011 guidance (SR 11-7), whose corresponding sentence named
    "adjustment, redevelopment, or replacement" and also the verification of any extension of the model
    beyond its original scope; the 2026 text does not name replacement here and treats extending a model's
    use in section IV, Model Use, instead.
  where: lesson.py section 8 (the audit that closes the loop), section 10 (the diagnosis-to-fix table),
    section 12 (closing the loop)
  source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602a1.pdf
  source_title: Revised Guidance on Model Risk Management, attachment to SR letter 26-2, Board of Governors
    of the Federal Reserve System, Federal Deposit Insurance Corporation and Office of the Comptroller
    of the Currency, 17 April 2026, section V, Ongoing Model Monitoring
  quote: Ongoing model monitoring involves an evaluation of the extent to which a model is performing
    as expected given potential changes in products, exposures, activities, clients, data relevance, or
    market conditions. A model that no longer performs as expected may warrant overlays, adjustment, or
    redevelopment of the model
  quote_context: First paragraph under the heading "Ongoing Model Monitoring", the third of the three
    headings under "Components of Model Validation" in section V (the other two are "Conceptual Soundness"
    and "Outcomes Analysis"), page 9 of the attachment. The second sentence continues "depending on a
    banking organization's model risk management policy as it pertains to model deterioration." Section
    IV, under "Model Use", says "When extending a model's use beyond its original application, sound practice
    involves considering additional analysis of the new usage and its limitations".
  accessed: 2026-10-02
- id: sr-11-7-superseded
  claim: SR letter 11-7 (4 April 2011) was superseded and replaced on 17 April 2026 by SR letter 26-2,
    Revised Guidance on Model Risk Management, issued jointly by the Federal Reserve, the OCC and the
    FDIC; SR 26-2 also supersedes SR letter 21-8 (9 April 2021). This is recorded because this lesson's
    monitoring claim quoted the 2011 text until 2 October 2026 and now quotes the 2026 attachment, and
    a reader comparing the two should know which is current. The Federal Reserve's former SR 11-7 page
    under /supervisionreg/ returns 404 as of 2026-10-02.
  where: claims.yaml only; the lesson does not mention either letter by number
  source_url: https://www.federalreserve.gov/supervisionreg/srletters/SR2602.htm
  source_title: Supervisory Letter SR 26-2 on Revised Guidance on Model Risk Management, 17 April 2026
  quote: which supersedes and replaces SR letter 11-7, Guidance on Model Risk Management (issued April
    4, 2011) and SR letter 21-8
  quote_context: 'From the letter''s opening paragraph: the Board, the OCC and the FDIC "are issuing the
    attached Revised Guidance on Model Risk Management", followed by the quoted clause, which names SR
    letter 21-8 as the Interagency Statement on Model Risk Management for Bank Systems Supporting Bank
    Secrecy Act/Anti-Money Laundering Compliance (issued April 9, 2021). The letter''s "Supersedes" footer
    repeats both.'
  accessed: 2026-10-02
- id: cmapss-optional-extension
  claim: NASA's Prognostics Center of Excellence data repository publishes the Turbofan Engine Degradation
    Simulation (C-MAPSS) sets as a direct download with no registration form, asks that publications acknowledge
    the repository and the donors, and states that users employ the data at their own risk. This is recorded
    because the lesson names those sets as an OPTIONAL, OFF-PATH extension a student can run the same
    code against afterwards. Nothing the grader touches downloads anything, and the lesson runs with the
    machine offline. C-MAPSS carries an operating-condition column per row, which is what the regime-conditional
    half of this lesson needs from a real corpus.
  where: meta.yaml datasets note; not on any required path in lesson.py
  source_url: https://www.nasa.gov/intelligent-systems-division/discovery-and-systems-health/pcoe/pcoe-data-set-repository/
  source_title: NASA Prognostics Center of Excellence Data Set Repository, entry 6, Turbofan Engine Degradation
    Simulation
  quote: Users employ the data at their own risk. Neither NASA nor the donators of the data sets assume
    any liability for the use of the data, or any system developed using the data.
  quote_context: Repository-wide terms, immediately above the data set list. The same paragraph asks that
    "Publications making use of databases obtained from this repository ... acknowledge both the assistance
    received by using this repository and the donators of the data." Entry 6 links directly to https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip
  accessed: 2026-09-22
