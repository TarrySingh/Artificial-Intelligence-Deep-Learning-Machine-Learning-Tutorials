id: P03-L04-labelling-run-to-failure
title: Derive failure times from a maintenance work-order log, censor the runs that never failed, and
  measure how far the cost-optimal threshold moves on a bookkeeping decision alone
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
- P03-L03-vibration-features
objectives:
- Implement parse_log_hour, classify_work_order and event_hour so a CMMS export in three date formats
  yields failure and suspension events, each dated under a stated policy, without counting a no-fault-found
  call-out as a failure
- Implement build_runs and horizon_labels so that a unit the log never mentions is right-censored at the
  edge of the window rather than dropped or treated as a survivor, a suspended or censored unit's final
  horizon emits unknown rather than negative, and no row survives the hour the run ended
- Implement split_by_unit and measure how many units a row-level split puts on both sides of the boundary
- Implement a tie-aware rank_auc and a two-detector leakage_report, and explain from the measured table
  why a score ceiling alone misses the quiet leak
- Measure how far the cost-optimal threshold moves between three labelling policies applied to one unchanged
  health index, and what the worst of them costs when scored honestly
before_you_start:
  assumed:
  - parse a date string with datetime.strptime and compare or subtract two timestamps
  - group a list of records by a key and sort each group by time
  - explain what a train/test split is for and why the test rows must stay untouched
  resources:
  - title: Introduction to survival analysis
    by: lifelines documentation (Cameron Davidson-Pilon)
    url: https://lifelines.readthedocs.io/en/latest/Survival%20Analysis%20intro.html
    kind: free
    why: right-censoring explained with an example of what ignoring censored units does to a lifetime
      estimate, then the survival and hazard functions
  - title: 'Common pitfalls and recommended practices: data leakage'
    by: scikit-learn documentation
    url: https://scikit-learn.org/stable/common_pitfalls.html
    kind: free
    why: 'section 12.2 on data leakage: how information that would not exist at prediction time inflates
      a score, the failure exercise 8 is built to catch'
  - title: 'Cross-validation: cross-validation iterators for grouped data'
    by: scikit-learn documentation
    url: https://scikit-learn.org/stable/modules/cross_validation.html
    kind: free
    why: 'the group K-fold section: why rows from one group must not sit on both sides of a split, which
      is the case for splitting by unit'
  - title: 'datetime: strftime() and strptime() behavior'
    by: Python documentation
    url: https://docs.python.org/3/library/datetime.html
    kind: free
    why: the format-code table for parsing dates written in several formats, as in the work-order export
      in exercise 1
