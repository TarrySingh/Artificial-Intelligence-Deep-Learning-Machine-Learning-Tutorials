id: P03-L04-labelling-run-to-failure
title: Derive failure times from a maintenance work-order log, censor the runs that never failed, and measure how far the cost-optimal threshold moves on a bookkeeping decision alone
track: P03
programme: predictive-maintenance
flagship:               # none: this module feeds the programme's capstone, not a flagship
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P03-L01-alarm-economics
  - P03-L03-vibration-features
objectives:
  - "Implement parse_log_hour, classify_work_order and event_hour so a CMMS export in three date formats yields failure and suspension events, each dated under a stated policy, without counting a no-fault-found call-out as a failure"
  - "Implement build_runs and horizon_labels so that a unit the log never mentions is right-censored at the edge of the window rather than dropped or treated as a survivor, a suspended or censored unit's final horizon emits unknown rather than negative, and no row survives the hour the run ended"
  - "Implement split_by_unit and measure how many units a row-level split puts on both sides of the boundary"
  - "Implement a tie-aware rank_auc and a two-detector leakage_report, and explain from the measured table why a score ceiling alone misses the quiet leak"
  - "Measure how far the cost-optimal threshold moves between three labelling policies applied to one unchanged health index, and what the worst of them costs when scored honestly"
datasets:
  - name: synthetic-plant-and-work-order-log
    kind: synthetic
    description: "240 units x 960 hourly health-index readings with 60 run-to-failure and 40 suspended units, plus a 150-row CMMS work-order export in three date formats with no-fault-found call-outs and paperwork lags, generated in lesson.py by generate_plant(seed=20260916)"
    generator: "lesson.py :: generate_plant"
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    downloads: false
points: 113        # = sum of RUBRIC points in tests/test_lesson.py
# Why the data is synthetic, recorded here because gate 11 is about honesty rather than about
# having a URL: this module's argument is that a labelling policy can be WRONG, and to show a
# policy wrong you need the run table it was trying to recover. No real maintenance log ships
# with one. The generator is in the notebook, is seeded, and is read by the student before it
# is used. MODULES.md names the real corpora the later modules move onto; module 5 takes the
# run table built here onto NASA's C-MAPSS sets.
#
# Design notes for a reviewer:
#
# * Every number in the prose is printed by the notebook. On this plant the three policies
#   land 0 h, 22 h and 246 h from the truth in median; the honest AUC is 0.8991 and the
#   centred-window labeller reaches 0.9556 on 43,658 post-event rows; the closed policy leaks
#   24,148 rows and scores 0.2990, BELOW the honest baseline. The cost-optimal thresholds are
#   1.35 (truth and trip), 1.40 (raised) and 3.05 (closed); the closed policy's threshold
#   claims 540,000 and costs 3,600,000 when scored against the truth, 3.23x the best available
#   1,113,000, giving up all 60 failures against 5.
# * The two leak detectors deliberately disagree. The centred-window labeller is caught by
#   both; the closed policy is caught by the row audit alone, because its leak makes the score
#   worse rather than better. A lesson that only taught "suspiciously high AUC" would have
#   shipped a detector that waves the commonest real leak straight through, and the notebook
#   says so from its own measured table rather than asserting it.
# * The cost-optimal point gives up 5 of 60 failures on purpose, and the rubric's
#   test_the_policy_gap_is_real asserts truth.fn > 0 so a fleet retune that made "catch
#   everything" optimal would fail the gate rather than quietly weaken the lesson.
# * The prices are NOT module 1's. Module 1 held the labels fixed and moved the prices; this
#   module holds the prices fixed and moves the labels, so the absolute level carries no
#   weight. The setup cell says so where a student will read it.
# * `runs_for()` caches the per-policy run table rather than building it at module level. The
#   first draft built a module-level RUNS dict from student code, which crashed tools/grade.py
#   at import on a file full of stubs — gate 6's partial credit was unreachable for exactly
#   the students who needed it. Every demonstration now sits inside `_try`, and a completely
#   unfilled lesson.py imports cleanly, prints a hint per exercise and scores 0/113 with a
#   TODO row for every one of the 29 rubric entries.
#
# Mutation testing of the rubric, 2026-09-16. Nineteen plausible wrong implementations were
# built from the reference solution in a throwaway temporary directory, one break each, and
# graded. All nineteen were caught, and every one kept partial credit rather than collapsing
# to zero — the scores span 87% to 98%:
#
#   no-fault checked after the job type 87% · expected cost charging the true negatives 88% ·
#   horizon comparison strict `<` 88% · lead time compared with `>` 89% · month-first date
#   format 92% · censored final window labelled 0 instead of -1 93% · rows from at or after
#   end_hour emitted 93% · leakage audit using `>` instead of `>=` 93% · trip falling back to
#   the close date 94% · units with no order dropped 96% · first order in the file instead of
#   the earliest 96% · `if order.trip_hour:` instead of `>= 0` 96% · split not stratified 96% ·
#   AUC ties taking their sort position 96% · alarm window searching the whole row 96% ·
#   rank_auc scoring unknown (-1) rows as negatives 96% · split ignoring its seed 97% ·
#   an unknown policy falling through to 'trip' 98% · horizon_labels skipping validation 98%.
#
# A twentieth run was a deliberate CONTROL: rank_auc rewritten with np.searchsorted, deriving
# each row's average rank from the left and right insertion points instead of scattering a
# rank array — a correct answer of a completely different shape. It still scores 113/113, so
# the rubric grades the behaviour the docstrings ask for and not one way of writing it.
#
# Eight of the nineteen are caught by exactly ONE case each and by nothing else, which is why
# those cases exist and are documented as deliberate in the rubric's module docstring. The
# three that matter most: test_horizon_labels_censoring_is_unknown (the mutant writing 0 where
# the label is unknowable passes every other label case), test_cost_optimal_stops_at_the_run_end
# (the whole-row mutant is otherwise perfect, and it is the leak the module is named for), and
# test_rank_auc_rejects_unknown_labels (nothing else in the rubric hands the scorer a -1).
#
# Gate 3 measured, not assumed: the longest run of consecutive prose before the next runnable
# cell is 39 raw / 33 non-blank lines (the self-check quiz), inside the ~40 the gate allows.
# An earlier draft ran 62 raw lines across the common-mistakes list and the quiz; the runnable
# cell that now splits them prices the censoring bug on this plant (8,640 invented negatives,
# 3.00 for every genuine positive, and an AUC that barely moves), which is a better place for
# that argument than a bullet anyway.
#
# Open for the owner: the prerequisite on P03-L03-vibration-features resolves to a lesson
# directory that exists in this tree; if module 3 is renumbered, this line moves with it. The
# programme-level MODULES.md status table is the owner's to update and has not been touched.
#
# --- independent review, 2026-09-16 ---------------------------------------------------------
#
# Four gates re-run from scratch: execute PASS (1.0 s every run, peak RSS 119-123 MiB across
# three runs against a 90 s / 8 GiB budget; the write-back below is the last), solution 113/113,
# stub file 0/113 with a TODO row for all 29 rubric entries, jupytext converts. Prerequisites
# resolve to three directories that exist. Both claims.yaml sources re-fetched and the two
# quotes matched verbatim, including the section number 8.1.3.1 and the "right censored"
# sentence in quote_context. The lab matches what MODULES.md specifies for module 4 — event
# times from a work-order log, three defensible policies measured against each other, failure
# versus suspension, right-censoring, and module 1's sweep re-run under each policy.
#
# Twenty-three fresh mutants were built from the reference in a temporary directory, one break
# each, covering every archetype in the review brief. TWO SURVIVED at 113/113 and were fixed:
#
#   1. build_runs tie rule. `hour <= current[0]` — keep whichever tied order the export listed
#      LAST — scored 113/113, because the rubric's single tie case happened to list the failure
#      second. Measured: with the same pair reversed that mutant returns 'suspension' where the
#      docstring promises 'failure'. tests now put the tied pair in both row orders; the mutant
#      scores 108/113.
#   2. split_by_unit fold size. Every fraction in the rubric divided exactly (8, 12, 4 and 60
#      at a quarter or a half), so `int(n * test_fraction)` truncating instead of rounding was
#      invisible: 113/113. Measured: 6 failures at 0.25 gives 1 test failure instead of 2, and
#      3 failures at 0.25 gives ZERO — the empty-stratum outcome the test's own hint says
#      stratifying prevents. Two non-dividing strata added; the mutant scores 109/113.
#
# A third survivor was EQUIVALENT, not a defect: rank_auc with the positives' rank sum written
# `mean() * n_pos`. That is algebraically the sum, and over 2,000 random score/label tables the
# largest difference from the reference was 1.665e-16. The honest version of that mistake —
# `mean()` with no compensating multiply — is caught at 108/113. After the two fixes the
# reference still scores 113/113 and all 22 breaking mutants fail, every one of them keeping
# partial credit; the scores span 84% to 97%, the lowest being the mutable-default build_runs
# (84%) and the build_runs that never returns (84%).
#
# One thing the gates could not see was wrong and is fixed in lesson.py and in the solution:
# the handover note reported the historian fallback as "73 of 150 orders". Fifty of those 73
# are no-fault-found orders, which classify_work_order discards before event_hour is ever
# called, so they never use the fallback; the note overstated the rate by a factor of two. It
# now counts run-ending orders only and prints 23 of 100. The self-check answer to question 2
# carried the same error as typed prose ("about one job in six") and now points at the
# notebook's printed count instead of quoting a ratio.
#
# Gate 3 re-measured by the reviewer: the longest prose run is 40 raw / 33 non-blank lines (the
# self-check quiz), inside the ~40 the gate allows. Nine stubs, each with a docstring, a worked
# example, `# YOUR CODE HERE` and `raise NotImplementedError`; no blank cells. No check message
# bottoms out at "assertion failed" — each names the mistake. No path under solutions/ appears
# anywhere in lesson.py's prose. Every number the notebook prints is computed by the code the
# student runs; the numbers in these design notes were re-verified against a live run.
status: reviewed        # draft | executed | reviewed | shipped
reviewed_by: "Independent review 2026-09-16 — 4 gates re-run green (execute PASS 1.0 s/123 MiB, solution 113/113, stubs 0/113, jupytext converts); 23 fresh mutants, 2 survivors fixed (build_runs tie rule graded the export's row order, split_by_unit fold size never met a non-dividing fraction) and 1 proved equivalent by measurement (max 1.665e-16); all 22 breaking mutants now caught at 84-97% with partial credit; handover's historian-fallback count corrected from 73 of 150 orders to 23 of 100 run-ending orders and the matching typed ratio removed from the answer key; both NIST quotes re-fetched verbatim; lab matches MODULES.md module 4"

