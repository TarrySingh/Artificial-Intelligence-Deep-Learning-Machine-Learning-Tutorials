claims:
- id: censoring-definition
  claim: The NIST/SEMATECH e-Handbook of Statistical Methods defines censored data as what you have when
    not every unit under observation fails, and calls the case where the unobserved failure times lie
    beyond the end of observation "right censored". Section 5 of the lesson quotes the first sentence
    to justify treating a unit with no work order as censored at the edge of the sensor window rather
    than as a negative example, and exercise 5's -1 label is the same idea applied per hour.
  where: lesson.py section 5 (build_runs and right-censoring), section 6 (horizon_labels)
  source_url: https://www.itl.nist.gov/div898/handbook/apr/section1/apr131.htm
  source_title: NIST/SEMATECH e-Handbook of Statistical Methods, 8.1.3.1 Censoring
  quote: When not all units on test fail we have censored data
  quote_context: Opening definition of the Censoring subsection; the same page adds "This type of censoring
    is also called 'right censored' data since the times of failure to the right (i.e., larger than T)
    are missing."
  accessed: 2026-09-16
- id: multicensored-three-outcomes
  claim: 'The same handbook page states the general case in which each observed unit yields exactly one
    of three kinds of information: a run time if it did not fail while under observation, an exact failure
    time, or an interval during which it failed. The lesson''s Run table is the first two of those three
    — `kind` is FAILURE, SUSPENSION or CENSORED — and the absence of the third is stated in the lesson''s
    own scope rather than implied: this module derives an event hour and does not model interval censoring.'
  where: lesson.py section 5 (the three ways a run ends)
  source_url: https://www.itl.nist.gov/div898/handbook/apr/section1/apr131.htm
  source_title: NIST/SEMATECH e-Handbook of Statistical Methods, 8.1.3.1 Censoring
  quote: 'In the most general case, every unit observed yields exactly one of the following three types
    of information: a run-time if the unit did not fail while under observation, an exact failure time,
    an interval of time during which the unit failed.'
  quote_context: Multicensored Data subsection
  accessed: 2026-09-16
