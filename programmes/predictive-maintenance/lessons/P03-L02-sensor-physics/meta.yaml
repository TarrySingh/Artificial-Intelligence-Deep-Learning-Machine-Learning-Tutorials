id: P03-L02-sensor-physics
title: Build the measurement chain between a machine and its features, and catch it misreporting a component
  by 150% without a single wrong-looking line in the spectrum
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
objectives:
- Implement an amplitude-scaled one-sided spectrum, including the two bins that must not be doubled, and
  read a component's amplitude off it
- Compute the frequency a tone folds to when it is undersampled, and identify an aliased component by
  intersecting candidate sets across three sampling rates
- Implement a cascaded one-pole low-pass, derive its gain and phase from its own difference equation,
  and measure both against a tone
- Quantise acceleration through a sensor sensitivity and a bipolar ADC range, and measure why clipping
  costs more than four extra bits can buy
- Explain, from the measured velocity RMS under three orderings, why the high-pass belongs after the integration
  and not before it
