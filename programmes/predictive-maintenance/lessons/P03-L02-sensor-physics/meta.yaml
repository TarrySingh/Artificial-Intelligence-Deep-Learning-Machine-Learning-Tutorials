id: P03-L02-sensor-physics
title: Build the measurement chain between a machine and its features, and catch it misreporting a component
  by 150% without a single wrong-looking line in the spectrum
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
objectives:
- Implement an amplitude-scaled one-sided spectrum, including the two bins that must not be doubled, and
  read a component's amplitude off it
- Compute the frequency a tone folds to when it is undersampled, and identify an aliased component by
  intersecting candidate sets across three sampling rates
- Implement a cascaded one-pole low-pass, derive its gain and phase from its own difference equation,
  and measure both against a tone
- Quantise acceleration through a sensor sensitivity and a bipolar ADC range, and measure why clipping
  costs more than four extra bits can buy
- Explain, from the measured velocity RMS under three orderings, why the high-pass belongs after the integration
  and not before it
before_you_start:
  assumed:
  - generate a sine wave of a given amplitude and frequency in numpy and say what its sample rate in Hz
    means
  - call np.fft.rfft on a real signal and map a bin index to a frequency
  - read a difference equation and run it sample by sample in a Python loop
  resources:
  - title: 'The Scientist and Engineer''s Guide to Digital Signal Processing, chapter 3: ADC and DAC'
    by: Steven W. Smith (free online)
    url: https://www.dspguide.com/ch3.htm
    kind: free
    why: quantisation noise, the sampling theorem and aliasing, and choosing an anti-alias filter, the
      three failures this lesson makes you measure
  - title: 'The Scientist and Engineer''s Guide to Digital Signal Processing, chapter 19: Recursive Filters'
    by: Steven W. Smith (free online)
    url: https://www.dspguide.com/ch19.htm
    kind: free
    why: single-pole recursive filters and their phase response, the one-pole low-pass whose gain and
      lag you derive and measure
  - title: Think DSP
    by: Allen B. Downey (Green Tea Press; free online)
    url: https://greenteapress.com/thinkdsp/html/index.html
    kind: free
    why: chapter 2 on harmonics, aliasing and computing the spectrum, in Python with numpy, before you
      scale a spectrum yourself
  - title: Understanding Digital Signal Processing, 3rd edition
    by: Richard G. Lyons (Pearson)
    url: https://www.informit.com/store/understanding-digital-signal-processing-9780137027415
    kind: paid
    why: chapter 2 on periodic sampling and aliasing, chapter 6 on IIR filters, and section 12.3 on the
      effects of finite fixed-point word length, including A/D quantisation noise
