id: P03-L07-ot-network-deployment
title: Deploy one inference path twice — in C inside a fixed arena and in numpy in float64 — measure what
  the register map costs that the arithmetic does not, and move a week of readings across an outage exactly
  once
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 120
language: c
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
- P03-L06-thresholds-from-distributions
objectives:
- Implement a fixed-arena allocator in C that aligns, refuses rather than overruns, and hands out nothing
  once start-up is over
- Implement a Modbus RTU frame decoder that rejects a damaged frame without half-filling the caller's
  struct
- Implement the health index twice — in Q16.16 integers in C and in float64 in numpy — and measure both
  the disagreement between them and how many alarm decisions change, and in which direction, because the
  threshold is not representable on the wire
- Implement a store-and-forward buffer that neither loses nor duplicates a reading across a link outage,
  and measure how many hours of plant it holds
- Explain, from a measured comparison, why a one-way data diode forces drift detection to be unsupervised,
  and implement the signal that survives it
before_you_start:
  assumed:
  - 'read and write C: declare structs, use fixed-width integers such as uint8_t and int32_t, and pass
    pointers to functions'
  - convert between hexadecimal, binary and decimal, and shift and mask bits
  - run make from a terminal and read a compiler error and its line number
  resources:
  - title: Beej's Guide to C Programming
    by: Brian "Beej Jorgensen" Hall (free online)
    url: https://beej.us/guide/bgc/html/split/
    kind: free
    why: 'chapter 5 on pointers, chapter 8 on structs, chapter 24 on bitwise operations and chapter 37
      on fixed-width integer types: the C you read and write in lesson.c'
  - title: Automation and Make
    by: Software Carpentry (free online)
    url: https://swcarpentry.github.io/make-novice/
    kind: free
    why: 'the first two episodes on Makefiles: targets, dependencies and recipes, enough to follow what
      make test does in this lesson'
  - title: 'The Scientist and Engineer''s Guide to Digital Signal Processing: Fixed Point (Integers)'
    by: Steven W. Smith (free online)
    url: https://www.dspguide.com/ch4/2.htm
    kind: free
    why: chapter 4 on how integers are stored as bit patterns (unsigned, offset binary, sign and magnitude,
      two's complement), the representation under the Q16.16 health index
  - title: 'MODBUS over Serial Line: Specification and Implementation Guide V1.02'
    by: Modbus Organization
    url: https://www.modbus.org/file/secure/modbusoverserial.pdf
    kind: free
    why: the RTU transmission mode frame format and Appendix B on CRC generation, the layout frame_decode
      has to parse and check
  - title: Guide to Operational Technology (OT) Security, SP 800-82 Rev. 3
    by: NIST
    url: https://csrc.nist.gov/pubs/sp/800/82/r3/final
    kind: free
    why: section 5.2.3 on network security and appendix E.1.2 on unidirectional gateways (data diodes),
      the constraint exercise 7 prices
