    generator: "lesson.py :: make_forecast, generate_fleet, maintenance_calendar"
    licence: "not applicable - generated at run time by the lesson itself"
    url: ""
    downloads: false
  - name: nasa-pcoe-turbofan-c-mapss
    kind: external-optional
    description: "NAMED IN THE LESSON AS AN OPTIONAL OFF-PATH EXTENSION AND NOTHING MORE. No cell fetches it, no check reads it, no rubric case touches it, and every gate runs with the machine offline. A student who wants the same code pointed at a real corpus after module 5 ships can fit the degradation model to a turbofan trajectory and hand make_forecast's output shape to every function below it."
    generator: ""
    licence: "NASA PCoE repository disclaimer: 'Users employ the data at their own risk. Neither NASA nor the donators of the data sets assume any liability for the use of the data, or any system developed using the data.' Verified verbatim 2026-09-22; recorded in claims.yaml as nasa-pcoe-optional-corpus."
