#     prices every plan under the draws. Reference run: the two-moment shapes book earlier on
#     4 of 4 units, by at most 25 hours, and cost 2,790 (normal, 1.4%) and 3,509 (log-normal,
#     1.8%) more across the four; at the hour the normal books it puts the chance of failing
#     first at 3.0x to 5.4x what the draws say and quotes its plan 17.1% to 23.7% dearer than
#     the draws price it. So the honest finding is not that two moments move the plan far —
#     the expected-cost curve is flat at its bottom — but that they misstate the risk and the
#     price that travel with it. The notebook prints every one of these numbers; none is typed
#     in any markdown cell, and the closing sentence of the demo is printed only when the
#     measured numbers support it. Probed while designing (not shipped): the plan's extra cost
#     keeps its sign at 20,000 and 100,000 draws per unit, settling near 0.9% (normal) and
#     1.2% (log-normal); at module 5's own 1,500 draws the per-unit figure carries sampling
