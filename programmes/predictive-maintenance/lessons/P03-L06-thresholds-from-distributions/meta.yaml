id: P03-L06-thresholds-from-distributions
title: Price an intervention time against a predictive RUL distribution, show it is neither the mean nor
  a fixed percentile, and measure what a workshop that takes one machine per slot costs on top
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
- P03-L05-remaining-useful-life
objectives:
- Implement expected_cost_at and best_intervention_time so a plan prices a failure at or before the booked
  hour separately from the remaining useful life thrown away, and measure, on the notebook's own fleet,
  how much more it costs to plan at the mean RUL or at a fixed percentile
- Implement survival_and_hazard, and explain why the optimal intervention time is where the hazard reaches
  life_per_hour / (unplanned - planned), by checking that route against an independent cost sweep
- Measure how the optimal intervention time moves when the width of an RUL distribution changes and its
  centre does not, and price a confident wrong forecast against an uncertain roughly-right one on the
  same machine
- Implement greedy_schedule and best_schedule under a finite workshop capacity, and report the calendar
  price, the capacity price and the planner's error as three separate measured numbers
- Implement forecast_from_samples to turn module 5's predictive RUL draws into this module's forecast,
  and measure what planning from a normal or a log-normal with the draws' mean and sd costs against planning
  from the draws themselves, in the booked hour, in the risk quoted with it and in its price
datasets:
- name: synthetic-rul-forecast-fleet
  kind: synthetic
  description: 6 machines, each with a 900-bin hourly predictive RUL distribution and a true failure hour
    drawn from its own forecast, plus a 20-slot weekday maintenance calendar, generated in lesson.py by
    generate_fleet(seed=20260922) on top of make_forecast; and, for section 13, module 5's predictive
    RUL draws for four units (1,500 each), generated by the lesson's own copy of module 5's rul_samples(seed=20260922
    + unit) from four posteriors rounded from a run of module 5's reference
