# Gates re-run from the repo root after the edit: notebooks --build/--check ok, execute.py
# PASS (measured figures written back below), solution 139/139, stub file 0/139 with a TODO
# row on all 36 cases, verify_all.structure [], verify_portable PASS on py311 and py312 and
