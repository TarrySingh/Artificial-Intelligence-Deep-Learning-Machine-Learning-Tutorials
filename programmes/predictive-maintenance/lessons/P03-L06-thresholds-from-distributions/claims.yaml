claims:
- id: survival-function-definition
  claim: The NIST/SEMATECH e-Handbook of Statistical Methods defines the reliability or survival function
    as the probability that a unit survives beyond time t, and states that survival is the complementary
    event to failure. Section 3 of the lesson defines `survival[k] = P(RUL > hours[k]) = 1 - cumsum(pmf)[k]`
    on exactly that reading — the comparison is strictly greater than, so the last bin of a finite grid
    is 0 — and the rubric's test_survival_values grades the alternative, P(RUL >= hours[k]), as the off-by-one-bin
    error it is.
  where: lesson.py section 3 (survival_and_hazard)
  source_url: https://www.itl.nist.gov/div898/handbook/apr/section1/apr122.htm
  source_title: NIST/SEMATECH e-Handbook of Statistical Methods, 8.1.2.2 Reliability or survival function
  quote: Survival is the complementary event to failure
  quote_context: Opening sentence of the section; the same page defines the reliability function R(t),
    also written S(t), as "the probability a unit survives beyond time t".
  accessed: 2026-09-23
- id: hazard-rate-definition
  claim: 'The same handbook defines the failure rate, also called the hazard rate, as the instantaneous
    rate of failure among the survivors to time t during the next instant of time. That conditioning on
    the survivors is the whole content of exercise 2''s denominator: the population at risk at the start
    of hour k is the machines that reached it, which in a discrete grid is `survival[k] + pmf[k]` and
    not `survival[k]`. Section 6 then uses the hazard, and nothing else about the distribution, to locate
    the optimal intervention time.'
  where: lesson.py section 3 (survival_and_hazard) and section 6 (hazard_crossing)
  source_url: https://www.itl.nist.gov/div898/handbook/apr/section1/apr123.htm
  source_title: NIST/SEMATECH e-Handbook of Statistical Methods, 8.1.2.3 Failure (or hazard) rate
  quote: The failure rate is defined for non repairable populations as the (instantaneous) rate of failure
    for the survivors to time t during the next instant of time.
  quote_context: Definition paragraph of the section, which also gives h(t) = f(t)/[1 - F(t)] = f(t)/R(t)
    and describes the failure rate as the rate at which the survivors at a given instant are "falling
    over the cliff".
  accessed: 2026-09-23
- id: nasa-pcoe-optional-corpus
  claim: NASA's Prognostics Center of Excellence Prognostics Data Repository publishes the Turbofan Engine
    Degradation Simulation (C-MAPSS) sets as a direct download with no registration, under a disclaimer
    that users employ the data at their own risk and that neither NASA nor the donators assume liability.
    The lesson names this corpus in section 1 as an OPTIONAL off-path extension a student can point the
    same code at by fitting module 5's model to it and handing the draws to exercise 10. Nothing the grader
    needs touches it, nothing in the lesson downloads it, and the lesson runs with the machine offline.
  where: 'lesson.py section 1 (the optional extension note); meta.yaml datasets: (off-path)'
  source_url: https://www.nasa.gov/intelligent-systems-division/discovery-and-systems-health/pcoe/pcoe-data-set-repository/
  source_title: NASA Prognostics Center of Excellence Data Set Repository
  quote: Users employ the data at their own risk. Neither NASA nor the donators of the data sets assume
    any liability for the use of the data, or any system developed using the data.
  quote_context: Repository disclaimer, above the dataset list. The turbofan set is offered at https://phm-datasets.s3.amazonaws.com/NASA/6.+Turbofan+Engine+Degradation+Simulation+Data+Set.zip
    with no login; the repository notes that a few other sets are "currently unavailable for download
    directly" and must be requested, which is precisely why nothing required is taken from it.
  accessed: 2026-09-23
