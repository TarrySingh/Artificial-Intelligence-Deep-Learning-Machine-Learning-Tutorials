id: P03-L03-vibration-features
title: Implement the standard vibration condition indicators and a load-corrected bearing temperature, and measure which of them read the fault and which read the duty point
track: P03
programme: predictive-maintenance
flagship:               # none: this module feeds the programme's capstone, not a flagship
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 90
language: python        # python | c | cpp
prerequisites:
  - T00-L01-the-8gb-track
  - P03-L01-alarm-economics
objectives:
  - "Implement RMS, crest factor and kurtosis from their definitions, and measure which of the three is invariant to a change of gain"
  - "Compute a correctly scaled one-sided amplitude spectrum with numpy.fft.rfft and a band-energy feature that satisfies Parseval's identity to 1e-9"
  - "Measure each feature's separation of healthy from degrading units, and its separation of healthy units at two different loads, with the same rank statistic"
  - "Remove a bearing temperature's dependence on load and ambient by least squares fitted on known-good units, and measure the residual's detection gain over the raw reading"
  - "Rank every feature by the money it saves at its own cost-optimal threshold, and explain why that ranking differs from the ranking by separation"
datasets:
