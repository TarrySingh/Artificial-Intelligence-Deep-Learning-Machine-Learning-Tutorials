id: P03-L03-vibration-features
title: Implement the standard vibration condition indicators and a load-corrected bearing temperature,
  and measure which of them read the fault and which read the duty point
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
objectives:
- Implement RMS, crest factor and kurtosis from their definitions, and measure which of the three is invariant
  to a change of gain
- Compute a correctly scaled one-sided amplitude spectrum with numpy.fft.rfft and a band-energy feature
  that satisfies Parseval's identity to 1e-9
- Measure each feature's separation of healthy from degrading units, and its separation of healthy units
  at two different loads, with the same rank statistic
- Remove a bearing temperature's dependence on load and ambient by least squares fitted on known-good
  units, and measure the residual's detection gain over the raw reading
- Rank every feature by the money it saves at its own cost-optimal threshold, and explain why that ranking
  differs from the ranking by separation
before_you_start:
  assumed:
  - compute a mean, standard deviation and central moments of an array with numpy, and say what a z-score
    is
  - 'say what a frequency spectrum shows: a signal written as a sum of sines, each with an amplitude'
  - fit a line or a plane by least squares with np.linalg.lstsq and read the residuals
  resources:
  - title: Think Stats, 2nd edition
    by: Allen B. Downey (Green Tea Press; free online)
    url: https://greenteapress.com/thinkstats2/html/index.html
    kind: free
    why: the probability density functions chapter (moments and skewness, the moment statistics kurtosis
      extends) and the linear least squares chapter (fits and residuals)
  - title: 'The Scientist and Engineer''s Guide to Digital Signal Processing: Parseval''s Relation'
    by: Steven W. Smith (free online)
    url: https://www.dspguide.com/ch10/7.htm
    kind: free
    why: chapter 10, the statement that energy in the time domain equals energy in the frequency domain,
      which exercise 5's band energy has to satisfy
  - title: 'Introduction to Applied Linear Algebra: Vectors, Matrices, and Least Squares'
    by: Stephen Boyd and Lieven Vandenberghe (Cambridge University Press; free PDF)
    url: https://web.stanford.edu/~boyd/vmls/
    kind: free
    why: chapters 12 and 13 on least squares and least-squares data fitting, the method that removes load
      and ambient from a bearing temperature
  - title: Vibration-based Condition Monitoring, 2nd edition
    by: Robert Bond Randall (Wiley)
    url: https://www.wiley.com/en-us/Vibration+based+Condition+Monitoring:+Industrial,+Automotive+and+Aerospace+Applications,+2nd+Edition-p-9781119477556
    kind: paid
    why: chapter 3, Basic Signal Processing Techniques (3.1 statistical measures, 3.2 Fourier analysis),
      then chapter 4 on fault detection and 7.3 on rolling element bearing diagnostics
