    and band_energy at it and measuring the load AUC across the four motor loads before believing any
    fault AUC. Sourced in claims.yaml (cwru-bearing-apparatus, cwru-bearing-zenodo-licence).
  licence: CC BY 4.0 (Creative Commons Attribution 4.0 International, as stated on the Zenodo record)
  url: https://zenodo.org/records/10987113
  downloads: false
