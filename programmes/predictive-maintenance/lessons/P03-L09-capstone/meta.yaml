id: P03-L09-capstone
title: Deliver a monitoring programme for one asset class as a runnable notebook plus a one-page specification,
  and implement the checklist that refuses a threshold reported without its price or without the failures
  it gives up named
track: P03
programme: predictive-maintenance
flagship: null
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- T00-L01-the-8gb-track
- P03-L01-alarm-economics
- P03-L02-sensor-physics
- P03-L03-vibration-features
- P03-L04-labelling-run-to-failure
- P03-L05-remaining-useful-life
- P03-L06-thresholds-from-distributions
- P03-L07-ot-network-deployment
- P03-L08-drift-and-the-alarm-audit
objectives:
- Implement causal_health and causality_margin so that the claim 'this feature is causal' is a number
  the notebook prints, and measure what a whole-window fit does to readings that were already recorded
- Implement label_runs and censoring_report so a suspension is censored rather than counted as a survivor,
  and report what the policy censors in units and in unobserved unit-hours
- Implement price_the_outcomes, choose_operating_point and failures_given_up so the threshold is derived
  in currency from audited prices, with a price the audit could not support carried as a labelled guess,
  and measure, for every failure that threshold does not catch, the reason and the price of catching it
  anyway
- Implement deployment_report and rederivation_trigger so the smoothing window is decided by the gateway's
  arena and the re-derivation rule is two measured numbers rather than a sentence
- Implement check_specification and my_specification, and explain why a submission that reports a threshold
  without its prices, or without naming the failures it gives up, must fail however good its detector
  is
before_you_start:
  assumed:
  - read a long notebook function by function and trace what each data structure carries from one call
    to the next
  - write a checking function that returns a list of named failures rather than a bare True or False
  - add up counts times prices into a cost in currency, and say which price is a measurement and which
    is a guess
  - state a decision, its assumptions and its known failure cases in a page of plain sentences
  resources:
  - title: Model Cards for Model Reporting
    by: Mitchell et al. (FAT* 2019)
    url: https://arxiv.org/abs/1810.03993
    kind: free
    why: 'a short structured document stating what a model is for, how it was evaluated and where it fails:
      the shape of the one-page specification you write'
  - title: 'Rules of Machine Learning: Best Practices for ML Engineering'
    by: Martin Zinkevich (Google)
    url: https://developers.google.com/machine-learning/guides/rules-of-ml
    kind: free
    why: the rules on starting from a simple baseline, training-serving skew, and alerting hygiene (actionable
      alerts), the habits behind this capstone's checklist
  - title: Hidden Technical Debt in Machine Learning Systems
    by: Sculley et al. (NeurIPS 2015)
    url: https://papers.nips.cc/paper_files/paper/2015/hash/86df7dcfd896fcaf2674f757a2463eba-Abstract.html
    kind: free
    why: why a model is a small part of a deployed system, and how undeclared dependencies and feedback
      loops make a threshold quietly wrong
  - title: Vibration-based Condition Monitoring, 2nd edition
    by: Robert Bond Randall (Wiley)
    url: https://www.wiley.com/en-us/Vibration+based+Condition+Monitoring:+Industrial,+Automotive+and+Aerospace+Applications,+2nd+Edition-p-9781119477556
    kind: paid
    why: 'chapter 1, sections 1.2, 1.3 and 1.7: maintenance strategies, condition-monitoring methods and
      the basic problem of condition monitoring, the setting this programme is for'
datasets:
- name: synthetic-feed-pump-fleet-log-and-alarm-audit
  kind: synthetic
  description: 140 boiler feed pumps x 720 hourly conditioned vibration readings with a duty and an ambient
    channel per reading, 24 run-to-failure units (19 with a slow P-F interval and 5 whose whole P-F interval
    is shorter than the lead requirement) and 16 suspensions, plus a 66-row CMMS work-order export including
    26 no-fault-found call-outs and a 36-line alarm audit priced off invoices, generated in lesson.py
    by generate_fleet(seed=20260923), generate_log and generate_audit
  generator: 'lesson.py :: generate_fleet, generate_log, generate_audit'
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  downloads: false
points: 183
status: reviewed
measured_seconds: 1.1
measured_peak_mib: 106
