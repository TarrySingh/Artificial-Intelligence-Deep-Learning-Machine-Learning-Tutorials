  kind: synthetic
  description: four LC-MS runs of 300 scans with 73 invented compounds (adducts, isotope peaks, retention-time
    drift), noise, steady background ions and bumps, plus a 320-entry invented compound library with authentic-standard
    retention times for about half of it, generated in lesson.py by generate_world(seed=20261002)
  generator: 'lesson.py :: generate_world'
  licence: not applicable - generated at run time by the lesson itself
  url: ''
  downloads: false
