objectives:
  - "Implement the three stages of an MPPI planner in C++ — sample, score and refit — and pass the binary's self-test"
  - "Measure this machine's rollout throughput in C++ and in Python on identical work, and report the ratio the two loops achieve"
  - "Compute the sample-and-horizon budget a 100 Hz control tick affords at a measured throughput, and decide whether a configuration is real-time"
  - "Explain why subtracting the minimum cost before exponentiating is what stops the MPPI weights underflowing to zero"
  - "Show that scoring a candidate plan leaves the live simulation state untouched, and explain what breaks when it does not"
