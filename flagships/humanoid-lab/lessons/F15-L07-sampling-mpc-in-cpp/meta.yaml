id: F15-L07-sampling-mpc-in-cpp
title: Implement the MPPI sampling loop in C++ and measure the rollout throughput a 100 Hz control tick
  can afford
summary: Write sampling-based MPC in C++ on a cart-pole, measured in rollouts per second.
track: T11
flagship: F15-humanoid-lab
tier: cpu8
budget_seconds: 120
language: cpp
prerequisites:
- F15-L01-first-contact
- F15-L03-pd-control
- F15-L06-control-loop-in-c
objectives:
- Implement the three stages of an MPPI planner in C++ — sample, score and refit — and pass the binary's
  self-test
- Measure this machine's rollout throughput in C++ and in Python on identical work, and report the ratio
  the two loops achieve
- Compute the sample-and-horizon budget a 100 Hz control tick affords at a measured throughput, and decide
  whether a configuration is real-time
- Explain why subtracting the minimum cost before exponentiating is what stops the MPPI weights underflowing
  to zero
- Show that scoring a candidate plan leaves the live simulation state untouched, and explain what breaks
  when it does not
before_you_start:
  assumed:
  - write C++ that uses std::vector, references and functions, and read a struct definition
  - draw numbers from a Gaussian with a given mean and standard deviation, and say what the mean and spread
    control
  - compute a weighted average of vectors when the weights are not equal
  - build a small C++ program with make against an installed library
  resources:
  - title: Learn C++
    by: learncpp.com
    url: https://www.learncpp.com/
    kind: free
    why: chapters 12 (references and pointers) and 16 (std::vector), plus lesson 8.14 on std::mt19937
      random numbers, the C++ the three stages use
  - title: 'Predictive Sampling: Real-time Behaviour Synthesis with MuJoCo'
    by: Howell, Gileadi, Tunyasuvunakool, Zakka, Erez and Tassa (arXiv)
    url: https://arxiv.org/abs/2212.00541
    kind: free
    why: sampling-based MPC on MuJoCo, the simple sample-and-pick relative of the MPPI you implement,
      run in real time
  - title: Model Predictive Path Integral Control using Covariance Variable Importance Sampling
    by: Williams, Aldrich and Theodorou (arXiv)
    url: https://arxiv.org/abs/1509.01149
    kind: free
    why: the MPPI algorithm itself, with the exponentiated-cost weights that the refit stage computes
  - title: What Every Computer Scientist Should Know About Floating-Point Arithmetic
    by: David Goldberg (Oracle-hosted reprint)
    url: https://docs.oracle.com/cd/E19957-01/806-3568/ncg_goldberg.html
    kind: free
    why: the sections on denormalized numbers and on exceptions, for how a result too small to represent
      underflows to zero, as exp of a large negative number does
  - title: A Tour of C++, 3rd edition
    by: Bjarne Stroustrup (Addison-Wesley)
    url: https://www.informit.com/store/tour-of-c-plus-plus-9780136816485
    kind: paid
    why: a compact modern-C++ overview from the language's creator, if you know C but not C++
