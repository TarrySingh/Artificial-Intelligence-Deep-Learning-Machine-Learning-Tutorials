id: F15-L06-control-loop-in-c
title: Write a PD control loop against MuJoCo's C API and measure the per-tick overhead that separates it from the same loop in Python
track: T11
flagship: F15-humanoid-lab
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: c             # python | c | cpp
prerequisites:
  - F15-L01-first-contact      # mjModel vs mjData, stepping, reading qpos/qvel
  - F15-L03-pd-control         # the control law this lesson rewrites on the other side of the bindings
objectives:
  - "Implement a joint's qpos and qvel address lookup through mjModel's own tables in C, and show the two addresses differ on a model with a free joint"
  - "Implement a per-actuator clamped PD control law in C and pass the binary's self-test on all three exercises"
  - "Implement a fixed-step control loop in C and show it advances simulated time by exactly one timestep per tick"
  - "Measure the same loop's throughput in C and in Python on identical work and report the per-tick overhead and ratio between them"
  - "Explain why a PD law leaves a steady-state error, from a measured comparison of that error against qfrc_bias divided by the gain"
