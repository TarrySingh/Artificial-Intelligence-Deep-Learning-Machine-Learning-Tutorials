id: F15-L06-control-loop-in-c
title: Write a PD control loop against MuJoCo's C API and measure the per-tick overhead that separates
  it from the same loop in Python
summary: Write the control loop in C against MuJoCo's own API, built with `clang` and `make`.
track: T11
flagship: F15-humanoid-lab
tier: cpu8
budget_seconds: 120
language: c
prerequisites:
- F15-L01-first-contact
- F15-L03-pd-control
objectives:
- Implement a joint's qpos and qvel address lookup through mjModel's own tables in C, and show the two
  addresses differ on a model with a free joint
- Implement a per-actuator clamped PD control law in C and pass the binary's self-test on all three exercises
- Implement a fixed-step control loop in C and show it advances simulated time by exactly one timestep
  per tick
- Measure the same loop's throughput in C and in Python on identical work and report the per-tick overhead
  and ratio between them
- Explain why a PD law leaves a steady-state error, from a measured comparison of that error against qfrc_bias
  divided by the gain
before_you_start:
  assumed:
  - 'read and write C: declare variables, call functions, and use arrays and pointers to double'
  - pass a struct by pointer and read its fields with ->
  - build a C program with make, read a compiler warning, and run the resulting binary
  - read a C function prototype in a header and call the function with arguments of the right types
  resources:
  - title: Beej's Guide to C Programming
    by: Brian "Beej Jorgensen" Hall
    url: https://beej.us/guide/bgc/
    kind: free
    why: chapters 5 (pointers), 6 (arrays), 8 (structs) and 17 (multifile projects), which is all the
      C you write in lesson.c
  - title: Makefile Tutorial by Example
    by: theicfire (makefiletutorial.com)
    url: https://makefiletutorial.com/
    kind: free
    why: targets, prerequisites and variables, enough to read this lesson's Makefile and rebuild after
      an edit
  - title: MuJoCo documentation, Simulation
    by: Google DeepMind (official documentation)
    url: https://mujoco.readthedocs.io/en/stable/programming/simulation.html
    kind: free
    why: the simulation loop, the "State and control" section and mj_makeData, the C API calls the loop
      you write is built from
  - title: MuJoCo documentation, Programming
    by: Google DeepMind (official documentation)
    url: https://mujoco.readthedocs.io/en/stable/programming/index.html
    kind: free
    why: the Getting started and Header files sections, how a C program includes mujoco.h and links the
      library
  - title: 'C Programming: A Modern Approach'
    by: K. N. King (W. W. Norton)
    url: https://wwnorton.com/books/9780393979503
    kind: paid
    why: a widely used C textbook; chapters 11 and 12 (pointers, pointers and arrays), 15 (writing large
      programs) and 16 (structures), if Beej's guide is not enough
