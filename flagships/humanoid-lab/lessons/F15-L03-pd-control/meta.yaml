id: F15-L03-pd-control
title: Build a joint PD controller with gravity compensation, measure the droop it removes, and find your loop's stability ceiling by sweeping the gain
track: T11
flagship: F15-humanoid-lab
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 60
language: python        # python | c | cpp
prerequisites:
  - F15-L01-first-contact      # mjModel vs mjData, stepping, reading qpos/qvel
objectives:
  - "Implement pd_torque(q, qd, q_target, kp, kd) and verify it against pure-P, pure-D and combined cases to machine precision"
  - "Measure the steady-state droop of an uncompensated PD joint and show it equals qfrc_bias / kp rather than a bug in the loop"
  - "Implement gravity compensation from data.qfrc_bias and measure the factor by which it drops the steady-state error"
  - "Sweep kp at fixed kd, produce the tracking-error curve, and locate the stability limit from measured error alone"
  - "Explain why a once-per-step PD law diverges at high kp and again at high kd"
