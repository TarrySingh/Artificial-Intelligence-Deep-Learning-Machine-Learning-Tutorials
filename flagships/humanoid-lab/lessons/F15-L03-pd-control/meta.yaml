# Authored 2026-09-16. The reference implementation was inherited in a usable state and was
# corrected in two places before this meta was written, both of them gate failures:
#
#  - Section 2 probed the velocity-dependent part of qfrc_bias at the straight target pose
#    and printed [0. 0.], while the closing prose told the student they had "seen the
#    Coriolis terms appear the moment the arm moved". They had not: the coupling between
#    these two links carries a sin(elbow) factor and the elbow is at zero there. The demo now
#    probes a straight pose AND a bent one and prints both, so the zero is explained by a
#    second measurement instead of contradicted by prose (gate 12: the notebook must not
#    claim what its own output denies).
#  - The common-mistakes and self-check prose ran 55 lines with nothing runnable between them
#    (gate 3 allows ~40). A measured demo of the bias sign error now splits them: it runs
#    tau = PD - qfrc_bias and reports the ratio against the uncompensated droop, which is the
#    2x signature the prose had only asserted.
#
# Rubric design: no test asserts a gain value. Exercise 3 is graded on a grid the notebook
# never uses, and the stability limit is only ever read back out of measured error, so a
# student who finds a different ceiling on different hardware still scores full marks.
#
# Rubric mutation-tested against 10 plausible wrong implementations: flipped error sign,
# added rather than subtracted damping, a controller that writes through the live qpos view,
# a clamped (non-linear) torque, a subtracted bias, a bias read at the target instead of the
# current pose, a hand-written gravity constant, a sweep that drops its kd argument, one that
# drops its gravity_comp argument, and one that does not sort. 10 of 10 caught, every one
# with partial credit intact (scores 14-30 of 32, never 0 and never full marks).
#
# That pass found a defect in this rubric rather than in a student's work, which is the point
# of running it: test_pd_torque_does_not_touch_the_live_mujoco_views handed pd_torque
# Q_TARGET, which is [0, 0], so the classic `q -= q_target` mutation subtracted zero and the
# test written expressly to catch it passed. It now uses a non-zero target, and catches it.
