      inside the notebook, so the lesson runs with no network and no asset directory. No
      contacts and no joint damping: the only thing resisting the controller is the arm's own
      inertia and the gravitational bias, which is exactly what the lesson measures. The
      payoff is an mj_step of a few microseconds, so a full eight-gain sweep plus a five-gain
