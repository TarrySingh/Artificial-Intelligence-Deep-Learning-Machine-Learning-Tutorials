# Authored 2026-09-16. Four claims were DROPPED during authoring because measurement refuted
# them. They are recorded here because a later reader will be tempted by each one again:
#
#  - "The footprint is the support polygon." Silently false in the first model, which let the
#    torso capsule collide. Its lower cap reaches 0.01 m below the ankle, so the machine stood
#    on its chest: one contact point carried the full body weight while the foot floated a
#    centimetre off the floor. Found by printing ncon and the contact positions instead of
#    assuming them. The torso is now excluded from collision and the lesson asserts ncon == 4.
#
#  - "A stiff posture controller topples with near-zero joint error." This was going to be the
#    lesson's headline, and it is wrong. The 0.0098 rad that suggested it was the ankle angle
#    AFTER the machine had finished falling and settled flat, not during the fall. Measured
#    properly, the worst absolute ankle error while toppling is 0.347 rad for the stiff foil
#    and 0.394 rad for the best-tuned one. The foil is not blind, and the lesson no longer
#    says it is.
#
#  - "Stiffer posture control is worse." Refuted by the gain sweep: 76.8, 95.4, 73.2 N is not
#    monotone in stiffness. Deleted rather than defended.
#
#  - "Bisection finds the largest survivable push." Bisection assumes survival is monotone in
#    push magnitude, and it is not: the stiff foil fails at 80 N and survives at 101.5 N, both
#    reproduced on freshly loaded models. An early draft reported a 102 N limit for a foil
#    that demonstrably fails at 80 N. The lesson now defines the limit as the monotone PREFIX
#    of a ladder, grades that definition on synthetic non-monotone patterns, and shows the
#    student the offending pair of pushes in section 12.
#
# What the lesson does claim about control, measured on the prefix definition: forwards, the
# centre-of-mass controller reaches 100 N on the shipped ladder against 80 N for the soft foil
# and 60 N for the stiff one (on a fine 5 N grid: 110 / 95 / 75 N). Backwards, all three stop
# at the same rung, because the heel margin is roughly half the toe margin and no amount of
# control buys floor that is not there. That asymmetry, not a large survival advantage, is the
# result the lesson is built on.
#
# Every number a student sees is computed by the code they run. The graded ladder is placed
# clear of the controller's measured limit, which lies between 110 and 115 N: the last
# surviving rung is 100 N and the first failing rung is 130 N, so a shift of more than 10% in
# anyone's machine would be needed to flip a grade.
