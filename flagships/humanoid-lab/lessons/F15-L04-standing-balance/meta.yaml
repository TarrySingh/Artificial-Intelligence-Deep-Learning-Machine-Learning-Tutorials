id: F15-L04-standing-balance
title: Compute the centre of mass and the support polygon of a standing machine, push it over, and build the centre-of-mass feedback controller that catches it
track: T11
flagship: F15-humanoid-lab
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: python        # python | c | cpp
prerequisites:
  - F15-L01-first-contact      # mjModel vs mjData, stepping, centre of mass from xipos
  - F15-L03-pd-control         # state feedback, gains, and what a joint PD does and does not do
objectives:
  - "Implement the centre-of-mass ground projection from body masses and data.xipos, and verify it against MuJoCo's own subtree_com to machine precision"
  - "Compute the support polygon from the foot geom, implement a signed support margin, and measure that at rest the centre of pressure and the centre-of-mass projection coincide"
  - "Measure the ankle torque at which the foot starts to leave the floor, and show that the ceiling is set by the support polygon rather than by the actuator's ctrlrange"
  - "Implement a push through xfrc_applied and a fall detector that reads state, and demonstrate that a centre of mass outside the support polygon is not yet a fall"
  - "Implement a centre-of-mass feedback controller, measure the largest push it survives forwards and backwards on a graded ladder, and explain why it beats a joint-posture controller only in the direction where the support polygon leaves room to work"
