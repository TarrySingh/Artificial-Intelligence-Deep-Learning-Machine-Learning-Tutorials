    cached_at: "assets/stander.xml"
    retrieved: 2026-09-16
    gated: false
    notes: >-
      Not a download. Written for this lesson and shipped inside it, so the lesson runs with
      no network at all. Unlike F15-L08's balancer this model keeps contacts ENABLED and does
      not pin the ankle, because the support polygon does not exist without contact: the foot
      is a box on a plane that can tip, skid or leave the ground. The footprint is
      deliberately not centred on the ankle, so the toe margin is about twice the heel margin
      and the asymmetry is measurable in the push the controller survives each way. See
      assets/SOURCE.md for why the torso is excluded from collision and what broke when it
      was not.
