id: F15-L05-gait-and-energy
title: Generate an open-loop gait for a planar biped, account for its energy as the integral of torque
  times velocity, and cut its cost of transport with a budgeted search
track: T11
flagship: F15-humanoid-lab
tier: cpu8
budget_seconds: 90
language: python
prerequisites:
- F15-L01-first-contact
- F15-L03-pd-control
objectives:
- Implement a parameterised rhythmic gait and state what each of its five parameters does to the trajectory
- Measure the mechanical energy a gait spends as the time integral of actuator torque times actuator velocity,
  and cross-check it in joint space
- Implement the dimensionless cost of transport and explain why a walker that covers no ground scores
  infinity rather than zero
- Measure the effect of the inter-leg phase offset, and show that the antiphase gait survives where the
  in-phase gait topples
- Run a rollout-capped coordinate search and report the margin it opens over a baseline gait
