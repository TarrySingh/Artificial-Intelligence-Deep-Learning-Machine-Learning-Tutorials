  - F15-L03-pd-control         # actuators, gains, and why a controller's authority is finite
objectives:
  - "Implement a parameterised rhythmic gait and state what each of its five parameters does to the trajectory"
  - "Measure the mechanical energy a gait spends as the time integral of actuator torque times actuator velocity, and cross-check it in joint space"
  - "Implement the dimensionless cost of transport and explain why a walker that covers no ground scores infinity rather than zero"
  - "Measure the effect of the inter-leg phase offset, and show that the antiphase gait survives where the in-phase gait topples"
  - "Run a rollout-capped coordinate search and report the margin it opens over a baseline gait"
