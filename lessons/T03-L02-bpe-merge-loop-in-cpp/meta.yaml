id: T03-L02-bpe-merge-loop-in-cpp
title: Implement the BPE merge loop in C++ and measure the speedup over the Python trainer on one identical
  corpus
summary: Write the BPE merge loop in C++, and measure its speed-up over the Python trainer on one identical
  corpus.
track: T03
flagship: F02
tier: cpu8
budget_seconds: 120
language: cpp
prerequisites:
- T03-L01-bpe-from-scratch
objectives:
- 'Implement the four-function BPE merge loop in C++ — pair counting, deterministic argmax, in-place merge,
  training loop — using only std:: containers'
- Measure the naive rescan's wall-clock cost in Python and in C++ on one identical corpus, and report
  the speedup this machine produces
- Show that the C++ merge list is identical to the Python trainer's, and name the tie-break rule that
  makes that reproducibility possible
- Explain why the speedup is a constant factor rather than an asymptotic one, and what would have to change
  to bend the curve
- State which language each production tokenizer is actually written in, and what that does and does not
  change about the systems-language argument
before_you_start:
  assumed:
  - write a C++17 program that uses std::vector, std::unordered_map, range-for loops and pass-by-reference
    parameters, and compile it with clang++ or g++
  - run make in a terminal and read the first compiler error, which usually names the real line
  - explain why scanning n items k times costs about k times n, and what a constant-factor speedup is
  resources:
  - title: Learn C++
    by: Alex on learncpp.com
    url: https://www.learncpp.com/
    kind: free
    why: 'the free C++ course; chapter 12 (references and pointers) and chapter 16 (dynamic arrays: std::vector)
      cover the language you need for the four functions'
  - title: std::unordered_map
    by: cppreference.com
    url: https://en.cppreference.com/w/cpp/container/unordered_map
    kind: free
    why: the reference page for the hash map the pair counts live in, including operator[], find and average
      constant-time lookup
  - title: Introduction to Algorithms (6.006, Spring 2020)
    by: MIT OpenCourseWare
    url: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/
    kind: free
    why: 'Lecture 1 notes on efficiency and asymptotic notation, which ignores constant factors, and Lecture
      4 on hashing: the background to why the speedup is a constant factor'
  - title: Makefile Tutorial by Example
    by: makefiletutorial.com
    url: https://makefiletutorial.com/
    kind: free
    why: the Makefile syntax section (targets, prerequisites, commands), enough to read the lesson's Makefile
      and the make output when a build fails
  - title: A Tour of C++, 3rd edition
    by: Bjarne Stroustrup (Addison-Wesley)
    url: https://www.informit.com/store/tour-of-c-plus-plus-9780136816485
    kind: paid
    why: a compact tour of the standard library; chapter 12, Containers, covers vector (12.2) and unordered_map
      (12.6) as used in this lesson
