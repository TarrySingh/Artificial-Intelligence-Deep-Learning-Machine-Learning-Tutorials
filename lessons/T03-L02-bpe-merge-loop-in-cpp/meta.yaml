id: T03-L02-bpe-merge-loop-in-cpp
title: Implement the BPE merge loop in C++ and measure the speedup over the Python trainer on one identical corpus
track: T03
flagship: F02
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 120
language: cpp           # python | c | cpp
prerequisites:
  - T03-L01-bpe-from-scratch
objectives:
  - "Implement the four-function BPE merge loop in C++ — pair counting, deterministic argmax, in-place merge, training loop — using only std:: containers"
  - "Measure the naive rescan's wall-clock cost in Python and in C++ on one identical corpus, and report the speedup this machine produces"
  - "Show that the C++ merge list is identical to the Python trainer's, and name the tie-break rule that makes that reproducibility possible"
  - "Explain why the speedup is a constant factor rather than an asymptotic one, and what would have to change to bend the curve"
  - "State which language each production tokenizer is actually written in, and what that does and does not change about the systems-language argument"
