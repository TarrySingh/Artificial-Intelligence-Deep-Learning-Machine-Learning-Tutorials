claims:
- id: tokenizer-length-disparity
  claim: The same text translated into different languages can have very different tokenization lengths,
    even for tokenizers trained for multilingual support (Petrov et al., 2023). The lesson reproduces
    the mechanism on generated languages and does not repeat any of the paper's figures.
  where: lesson.py sections 3 (exercise 1, the tax table) and the mixture demo that follows it
  source_url: https://arxiv.org/abs/2305.15425
  source_title: Language Model Tokenizers Introduce Unfairness Between Languages (Petrov, La Malfa, Torr,
    Bibi; arXiv:2305.15425)
  quote: The same text translated into different languages can have drastically different tokenization
    lengths, with differences up to 15 times in some cases.
  accessed: 2026-09-29
- id: tokenizer-disparity-cost-latency-context
  claim: 'Tokenization disparity translates into unequal cost of accessing commercial language services,
    unequal processing time and latency, and a different amount of content that can be provided as context
    to the models (Petrov et al., 2023). This is the basis for the lesson''s two consequences of fertility:
    cost per correct answer and units that fit in a fixed context window.'
  where: lesson.py section 5 (exercise 2, cost per correct answer and units in the window)
  source_url: https://arxiv.org/abs/2305.15425
  source_title: Language Model Tokenizers Introduce Unfairness Between Languages (Petrov, La Malfa, Torr,
    Bibi; arXiv:2305.15425)
  quote: This induces unfair treatment for some language communities in regard to the cost of accessing
    commercial language services, the processing time and latency, as well as the amount of content that
    can be provided as context to the models.
  accessed: 2026-09-29
- id: api-vendors-charge-per-token
  claim: Commercial language-model APIs charge according to the number of tokens processed or generated,
    and the number of tokens needed to convey the same information varies widely between languages (Ahia
    et al., 2023).
  where: lesson.py section 5 (exercise 2 prose)
  source_url: https://arxiv.org/abs/2305.13707
  source_title: Do All Languages Cost the Same? Tokenization in the Era of Commercial Language Models
    (Ahia, Kumar, Gonen, Kasai, Mortensen, Smith, Tsvetkov; arXiv:2305.13707)
  quote: The API vendors charge their users based on usage, more specifically on the number of ``tokens''
    processed or generated by the underlying language models.
  accessed: 2026-09-29
- id: translation-artefacts-distort-benchmarks
  claim: Translating a benchmark can introduce artefacts that distort the meaning or clarity of questions
    in the target language, and the Global-MMLU authors report that rankings of models change depending
    on which subset of the questions is evaluated (Singh et al., 2024). The lesson's exercise 9 measures
    a PLANTED artefact of this kind on a simulated system; it makes no claim about the size of the effect
    in any real benchmark.
  where: lesson.py section 12 (exercise 9 prose)
  source_url: https://arxiv.org/abs/2412.03304
  source_title: 'Global MMLU: Understanding and Addressing Cultural and Linguistic Biases in Multilingual
    Evaluation (Singh et al.; arXiv:2412.03304)'
  quote: Furthermore, translation often introduces artefacts that can distort the meaning or clarity of
    questions in the target language.
  accessed: 2026-09-29
- id: machine-translated-eval-sets-common-practice
  claim: Relying on machine-translated evaluation sets is a common practice in multilingual evaluation
    (Singh et al., 2024). The lesson uses this to say why "the benchmark" in the simulation is its translated
    half; it makes no claim about what share of real benchmarks is translated.
  where: lesson.py section 4 (the benchmark and the two systems) and section 12 (exercise 9 prose)
  source_url: https://arxiv.org/abs/2412.03304
  source_title: 'Global MMLU: Understanding and Addressing Cultural and Linguistic Biases in Multilingual
    Evaluation (Singh et al.; arXiv:2412.03304)'
  quote: A common practice in multilingual evaluation is to rely on machine-translated evaluation sets,
    but simply translating a dataset is insufficient to address these challenges.
  accessed: 2026-09-29
- id: translation-artifacts-affect-cross-lingual-models
  claim: The translation process used to build multilingual datasets can introduce subtle artifacts that
    have a notable impact on existing cross-lingual models (Artetxe, Labaka and Agirre, 2020).
  where: lesson.py section 12 (exercise 9 prose)
  source_url: https://arxiv.org/abs/2004.04721
  source_title: Translation Artifacts in Cross-lingual Transfer Learning (Artetxe, Labaka, Agirre; arXiv:2004.04721)
  quote: such translation process can introduce subtle artifacts that have a notable impact in existing
    cross-lingual models.
  accessed: 2026-09-29
- id: paired-bootstrap-resampling
  claim: Bootstrap resampling can be used to compute the statistical significance of differences between
    two systems' test results, even for test sets of a few hundred items (Koehn, 2004, in the setting
    of machine-translation evaluation). The paired form resamples the same test items for both systems.
  where: lesson.py section 9 (exercise 6 prose)
  source_url: https://aclanthology.org/W04-3250/
  source_title: Statistical Significance Tests for Machine Translation Evaluation (Koehn, EMNLP 2004;
    PDF at https://aclanthology.org/W04-3250.pdf)
  quote: To answer this question, we describe bootstrap resampling methods to compute statistical significance
    of test results
  accessed: 2026-09-29
- id: macro-and-micro-averaging
  claim: Macroaveraging computes a simple average over classes and gives equal weight to each class; microaveraging
    pools the individual decisions across classes and gives equal weight to each decision (Manning, Raghavan
    and Schutze, Introduction to Information Retrieval, section 13.6). The lesson applies the two definitions
    with "language" in place of "class".
  where: lesson.py section 10 (exercise 7 prose)
  source_url: https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-text-classification-1.html
  source_title: Introduction to Information Retrieval, 13.6 Evaluation of text classification
  quote: Macroaveraging gives equal weight to each class, whereas microaveraging gives equal weight to
    each per-document classification decision.
  accessed: 2026-09-29
- id: underpowered-nlp-comparisons
  claim: Statistical power has been largely ignored in NLP, and underpowered experiments are common in
    the NLP literature, so that small test sets often cannot distinguish noise from a real difference
    between systems (Card et al., 2020).
  where: lesson.py section 13 (exercise 10 prose)
  source_url: https://arxiv.org/abs/2010.06595
  source_title: With Little Power Comes Great Responsibility (Card, Henderson, Khandelwal, Jia, Mahowald,
    Jurafsky; EMNLP 2020; arXiv:2010.06595)
  quote: underpowered experiments are common in the NLP literature
  accessed: 2026-09-29
