claims:
- id: openai-tool-arguments-json-string
  claim: In the OpenAI chat-completions shape a tool call's `function.arguments` is a string of JSON generated
    by the model, the model does not always produce valid JSON and may invent parameters, and the caller
    is told to validate before calling the function. This is why exercise 1 parses a string and rejects
    bad JSON with ValueError.
  where: lesson.py section 3 (exercise 1, parse_tool_calls), section 10 and self-check 3
  source_url: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  source_title: OpenAI OpenAPI specification, the `arguments` property of a chat completion tool call's
    function
  quote: The arguments to call the function with, as generated by the model in JSON format. Note that
    the model does not always generate valid JSON, and may hallucinate parameters not defined by your
    function schema. Validate the arguments in your code before calling your function.
  quote_context: description of the `arguments` string property (first occurrence, function-call object)
  accessed: 2026-09-29
- id: openai-finish-reason-values
  claim: The chat-completions `finish_reason` vocabulary includes `stop`, `length`, `content_filter`,
    `tool_calls` and the deprecated `function_call`. `normalise` maps those onto the lesson's Turn.finish
    values, and `parse_tool_calls` accepts the deprecated single `function_call` field.
  where: lesson.py section 6 (exercise 4, normalise) and section 3 (legacy function_call)
  source_url: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  source_title: OpenAI OpenAPI specification, `finish_reason` of a chat completion choice
  quote: '`tool_calls` if the model called a tool, or `function_call` (deprecated) if the model called
    a function.'
  quote_context: description of `finish_reason`, after the `stop`, `length` and `content_filter` values
  accessed: 2026-09-29
- id: openai-chat-usage-names
  claim: The chat-completions usage object names its counts `prompt_tokens`, `completion_tokens` and `total_tokens`.
  where: lesson.py section 6 (exercise 4, token counts)
  source_url: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  source_title: OpenAI OpenAPI specification, CompletionUsage
  quote: Number of tokens in the prompt.
  quote_context: description of the `prompt_tokens` property of CompletionUsage
  accessed: 2026-09-29
- id: openai-responses-usage-names
  claim: The same vendor's Responses API names its counts `input_tokens` and `output_tokens`, a second
    spelling a multi-provider client meets, which `normalise` accepts.
  where: lesson.py section 6 (exercise 4, token counts)
  source_url: https://raw.githubusercontent.com/openai/openai-openapi/master/openapi.yaml
  source_title: OpenAI OpenAPI specification, ResponseUsage
  quote: The number of input tokens.
  quote_context: description of the `input_tokens` property of ResponseUsage
  accessed: 2026-09-29
- id: anthropic-compat-response-format-ignored
  claim: Anthropic's OpenAI-SDK compatibility layer ignores the `response_format` request field. This
    is why the `frontier` recording answers a JSON-schema request with 200 and prose, and why its `schema`
    cell is "renamed" (the object is recoverable) and not "kept".
  where: lesson.py section 1 (frontier schema recording), section 7 and section 10
  source_url: https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk
  source_title: 'OpenAI SDK compatibility, Claude Platform Docs: Request fields'
  quote: Ignored. For JSON output, use Structured Outputs with the native Claude API
  quote_context: the Support status cell of the `response_format` row of the simple request fields table
  accessed: 2026-09-29
- id: anthropic-compat-reasoning-effort-ignored
  claim: The same compatibility layer ignores the `reasoning_effort` request field, so the `frontier`
    recording carries no reasoning and its `reasoning` cell is "dropped".
  where: lesson.py section 1 (frontier reasoning recording) and section 7
  source_url: https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk
  source_title: 'OpenAI SDK compatibility, Claude Platform Docs: Request fields'
  quote: reasoning_effort Ignored
  quote_context: 'a row of the simple request fields table: field name, then its support status'
  accessed: 2026-09-29
- id: anthropic-compat-thinking-not-returned
  claim: Through the OpenAI SDK compatibility layer Anthropic does not return the model's reasoning output;
    full thinking features need the native API.
  where: lesson.py section 1 (frontier reasoning recording)
  source_url: https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk
  source_title: 'OpenAI SDK compatibility, Claude Platform Docs: Thinking support'
  quote: the OpenAI SDK doesn't return Claude's thinking.
  quote_context: 'The end of the third sentence of the Thinking support section, which goes on: "For full
    thinking features, including summarized thinking, use the native Claude API." Re-quoted on 2026-10-16:
    the page used to say "the OpenAI SDK doesn''t return Claude''s detailed thought process."; the wording
    changed, the behaviour did not.'
  accessed: 2026-10-16
- id: anthropic-compat-silent-ignore
  claim: The same compatibility layer silently ignores most unsupported fields instead of returning an
    error, which is why "a 200 is not evidence of support" is a general lesson and not a quirk of one
    field.
  where: lesson.py section 7 and section 10
  source_url: https://platform.claude.com/docs/en/cli-sdks-libraries/libraries/openai-sdk
  source_title: 'OpenAI SDK compatibility, Claude Platform Docs: Important OpenAI compatibility limitations'
  quote: Most unsupported fields are silently ignored rather than producing errors.
  quote_context: the API behavior list of the limitations section
  accessed: 2026-09-29
- id: llama-cpp-reasoning-format-legacy
  claim: llama.cpp's server can be run in a mode that keeps `<think>` tags in `message.content` while
    also filling `message.reasoning_content`. The `local` reasoning recording is written in that mode,
    and exercise 2's "field and tags together" case exists because of it.
  where: lesson.py section 1 (local reasoning recording) and section 4 (exercise 2)
  source_url: https://raw.githubusercontent.com/ggml-org/llama.cpp/master/tools/server/README.md
  source_title: llama.cpp server README, the --reasoning-format option
  quote: 'deepseek-legacy: keeps `<think>` tags in `message.content` while also populating `message.reasoning_content`'
  quote_context: the list of values of --reasoning-format
  accessed: 2026-09-29
- id: llama-cpp-reasoning-format-none
  claim: llama.cpp's server, told not to parse thoughts, leaves them unparsed in `message.content` (inline
    think tags). This is the fourth place exercise 2 reads reasoning from.
  where: lesson.py section 4 (exercise 2), inline think tags
  source_url: https://raw.githubusercontent.com/ggml-org/llama.cpp/master/tools/server/README.md
  source_title: llama.cpp server README, the --reasoning-format option
  quote: 'none: leaves thoughts unparsed in `message.content`'
  quote_context: the list of values of --reasoning-format
  accessed: 2026-09-29
- id: llama-cpp-reasoning-content-field
  claim: llama.cpp's server returns parsed reasoning in a `reasoning_content` field, named after the DeepSeek
    API's. This is the lesson's reference field name for the `reasoning` feature.
  where: lesson.py section 4 (exercise 2) and section 7 (classify, reference field)
  source_url: https://raw.githubusercontent.com/ggml-org/llama.cpp/master/tools/server/README.md
  source_title: llama.cpp server README, reasoning section
  quote: The server supports parsing and returning reasoning via the `reasoning_content` field, similar
    to Deepseek API.
  quote_context: the reasoning paragraph of the chat-completions section
  accessed: 2026-09-29
- id: openrouter-reasoning-field
  claim: OpenRouter returns reasoning tokens in a `reasoning` field on each message, a different field
    name from llama.cpp's. The `hosted` reasoning recording uses it.
  where: lesson.py section 1 (hosted reasoning recording) and section 4 (exercise 2)
  source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
  source_title: OpenRouter docs, Reasoning Tokens
  quote: Reasoning tokens will appear in the reasoning field of each message, unless you decide to exclude
    them.
  quote_context: second paragraph of the page introduction
  accessed: 2026-09-29
- id: openrouter-reasoning-details
  claim: OpenRouter also returns a typed `reasoning_details` array in `choices[].message` with three block
    types (`reasoning.summary`, `reasoning.encrypted`, `reasoning.text`); the summary block carries `summary`,
    the text block `text`, and the encrypted block opaque `data`. Exercise 2 reads the first two and skips
    the third.
  where: lesson.py section 4 (exercise 2) and the hosted reasoning recording
  source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
  source_title: 'OpenRouter docs, Reasoning Tokens: Reasoning Details API Shape'
  quote: Each object in the array represents a specific piece of reasoning information and follows one
    of three possible types.
  quote_context: the reasoning_details Array Structure section; the type shapes are in the examples that
    follow
  accessed: 2026-09-29
- id: openrouter-reasoning-length-empty-content
  claim: On OpenRouter a model that spends its whole token budget reasoning returns finish_reason "length"
    with empty content; an answer cut off mid-thought is therefore a case a client must handle, which
    exercise 2's unterminated-tag rule and exercise 4's "length stays length" rule are written for.
  where: lesson.py section 4 (exercise 2), section 6 (exercise 4) and self-check 4
  source_url: https://openrouter.ai/docs/guides/best-practices/reasoning-tokens
  source_title: 'OpenRouter docs, Reasoning Tokens: Reasoning tokens and max_tokens'
  quote: 'If the limit is small enough that the model spends all of it reasoning, the response returns
    finish_reason: "length" with an empty content, and the reasoning tokens are still billed.'
  quote_context: the 'Reasoning tokens count against max_tokens' note
  accessed: 2026-09-29
- id: openrouter-structured-outputs-unsupported
  claim: 'On OpenRouter a request for structured outputs to a model that does not support them fails with
    an error. The `hosted` schema replay is an error response for that reason and its cell is "rejected".
    The documentation says only that the request fails with an error: the HTTP status 400 and the wording
    of the replayed message are invented for the lesson.'
  where: lesson.py section 1 (hosted schema recording) and section 7
  source_url: https://openrouter.ai/docs/guides/features/structured-outputs
  source_title: 'OpenRouter docs, Structured Outputs: Error Handling'
  quote: 'Model doesn’t support structured outputs: The request will fail with an error indicating lack
    of support'
  quote_context: first bullet under Error Handling
  accessed: 2026-09-29
- id: openrouter-error-shape
  claim: OpenRouter's error responses are a JSON object with an `error` object holding a numeric `code`,
    a string `message` and optional `metadata`, and the HTTP status equals `error.code`. The `hosted`
    schema recording follows that shape, and `normalise` reads `error.message`.
  where: lesson.py section 1 (hosted schema recording) and section 6 (exercise 4)
  source_url: https://openrouter.ai/docs/api_reference/errors-and-debugging
  source_title: OpenRouter docs, API Errors and Debugging
  quote: 'For errors, OpenRouter returns a JSON response with the following shape:'
  quote_context: the sentence introducing the ErrorResponse type (error.code, error.message, error.metadata)
  accessed: 2026-09-29
- id: openrouter-free-variant
  claim: OpenRouter offers free-tier variants of models under a `:free` suffix, with their own rate limits.
    This is the sense in which the lesson calls the `hosted` stand-in a free hosted tier.
  where: lesson.py section 1 (the three stand-ins)
  source_url: https://openrouter.ai/docs/guides/routing/model-variants/overview
  source_title: 'OpenRouter docs, Model Variants: Catalog variants'
  quote: A free-tier version of the model with its own rate limits and endpoints.
  quote_context: the Meaning cell of the :free row of the catalog variants table
  accessed: 2026-09-29
- id: ollama-native-thinking-field
  claim: Ollama's own chat API returns reasoning in `message.thinking`, a fifth spelling beyond the four
    the lesson's client handles.
  where: lesson.py section 10 (common mistakes) and self-check 2
  source_url: https://docs.ollama.com/capabilities/thinking
  source_title: Ollama docs, Thinking
  quote: Chat returns message.thinking
  quote_context: the sentence after 'The reasoning output and answer use separate fields.'
  accessed: 2026-09-29
- id: snapshot-provenance
  claim: 'NOT A CLAIM: the lesson''s twelve recordings (three stand-in backends by four probes) are hand-written
    to the shapes documented by the sources above on the snapshot date. They are not captures of live
    traffic: no network, API key or account was used, and every identifier, token count and error message
    in them is a placeholder. The lesson says so in its opening cell.'
  where: lesson.py opening cell and section 1
  source_url: none
  accessed: 2026-09-29
