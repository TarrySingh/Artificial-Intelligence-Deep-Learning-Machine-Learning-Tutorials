- id: acp-error-codes
  claim: 'ACP''s schema defines error codes of its own beyond JSON-RPC''s five standard ones: -32000 is
    "authentication required" and -32002 is "resource not found" (for example a file), both inside JSON-RPC''s
    server-error range, and -32800 is "request cancelled", which lies outside JSON-RPC''s reserved block
    altogether. The lesson''s agent keeps clear of all of them with -31001 and -31003 for its two own
    conditions, which the specification does not fix, and its toy editor answers a missing file with -32002.'
  where: lesson.py section 2 (Conn), handle_session_new, Conn.on_other, ToyEditor._on_request
  source_url: https://agentclientprotocol.com/protocol/v1/schema
  source_title: 'Agent Client Protocol: Schema (ErrorCode)'
  quote: Authentication is required before this operation can be performed.
  quote_context: 'the ErrorCode list: ''-32000 Authentication required'', ''-32002 Resource not found
    : A given resource, such as a file, was not found.'' and ''-32800 Request cancelled'''
  accessed: 2026-10-24
- id: acp-custom-method-not-found
