- id: acp-fs-capabilities-default-false
  claim: The published v1 schema types fs.readTextFile and fs.writeTextFile as booleans that default to
    false, and marks them to fall back to that default when a value cannot be deserialised. A non-boolean
    such as "yes" or 1 therefore reads as unsupported, which is what the lesson's only-true client_can
    helper does.
