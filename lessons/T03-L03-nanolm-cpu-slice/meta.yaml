id: T03-L03-nanolm-cpu-slice
title: Train a character-level language model on a CPU with numpy alone, deriving the backward pass by
  hand and proving it against finite differences
track: T03
flagship: F01-nanolm
tier: cpu8
budget_seconds: 300
language: python
prerequisites:
- T00-L01-the-8gb-track
objectives:
- Implement softmax and cross-entropy that survive logits of magnitude 1e4 without overflowing to nan
- Implement causal single-head self-attention and demonstrate it cannot see the future by perturbing a
  later position and measuring zero change
- Derive and implement the backward pass by hand, and verify every parameter gradient against central
  finite differences to a stated tolerance
- Measure why a gradient check run at initialisation can pass a broken attention gradient, and choose
  a probe scale where it cannot
- Train the model on a CPU and measure that held-out loss beats the corpus unigram entropy by a stated
  margin
datasets:
- name: 'Shakespeare''s Sonnets (opening excerpt), Project Gutenberg eBook #1041'
