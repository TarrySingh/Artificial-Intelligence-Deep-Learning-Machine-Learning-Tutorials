  notes: 'The lesson downloads nothing, at authoring time or at student run time. A 5988-character excerpt
    of the sonnets is embedded as a Python string literal, so the lesson runs with no network and no assets/
    directory at all. Project Gutenberg''s own header and footer, which carry the Project Gutenberg trademark
    licence, are NOT included: only the public-domain Shakespeare text is used. Three Unicode punctuation
    marks in the Gutenberg transcription (U+2019 and U+2018 curly quotes, U+2014 em dash) were folded
    to ASCII apostrophe and hyphen so the corpus is pure ASCII and the character vocabulary stays at 57
    symbols. That normalisation is the only edit made to the text.'
