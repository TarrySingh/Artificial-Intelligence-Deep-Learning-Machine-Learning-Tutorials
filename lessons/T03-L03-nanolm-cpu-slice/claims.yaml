claims:
- id: corpus-public-domain
  claim: 'The text used as the training corpus is an excerpt of Shakespeare''s Sonnets, taken from Project
    Gutenberg eBook #1041. Project Gutenberg records this eBook''s copyright status as "Public domain
    in the USA.", and the author, William Shakespeare, is recorded there with the dates 1564-1616, so
    the work is long out of copyright worldwide by age. The excerpt used excludes Project Gutenberg''s
    own header and footer, which are the only parts of that file carrying the Project Gutenberg trademark
    licence.'
  where: meta.yaml datasets; lesson.py section 1 (the corpus) and the CORPUS docstring.
  source_url: https://www.gutenberg.org/ebooks/1041
  source_title: 'Project Gutenberg — Shakespeare''s Sonnets by William Shakespeare, eBook #1041'
  source_kind: primary (the distributor's own catalogue record for the file used)
  quote: Public domain in the USA.
  accessed: 2026-09-16
  corroborating_url: https://www.gutenberg.org/cache/epub/1041/pg1041.txt
  corroborating_note: 'The plain-text file itself was fetched at authoring time and its header read. It
    records ''Title: Shakespeare''s Sonnets'', ''Author: William Shakespeare'', ''Release date: September
    1, 1997 [eBook #1041]''. The text between the START and END markers is the Shakespeare work; only
    that region was used, and only its first 5988 characters.'
- id: scaled-dot-product-attention
  claim: 'Scaled dot-product attention — computing the dot products of a query with all keys, dividing
    each by the square root of the key dimension d_k, and applying a softmax to obtain weights over the
    values — was introduced in "Attention Is All You Need" by Vaswani, Shazeer, Parmar, Uszkoreit, Jones,
    Gomez, Kaiser and Polosukhin, submitted to arXiv on 12 June 2017. The 1/sqrt(d_k) factor is not decoration:
    the paper''s stated reason is that for large d_k the dot products grow large in magnitude and push
    the softmax into a region where its gradients are extremely small.'
  where: lesson.py section 5 (scaled scores and the causal mask), the attention_forward docstring where
    SCALE is defined as 1/sqrt(D_MODEL), and self-check question 4.
  source_url: https://arxiv.org/abs/1706.03762
  source_title: Vaswani et al., Attention Is All You Need (arXiv:1706.03762)
  source_kind: primary (the paper itself)
  quote: For large values of d_k, the dot products grow large in magnitude, pushing the softmax function
    into regions where it has extremely small gradients.
  accessed: 2026-09-16
  corroborating_url: https://ar5iv.labs.arxiv.org/html/1706.03762
  corroborating_note: Section 3.2.1 gives the attention function as softmax(Q K^T / sqrt(d_k)) V. The
    abstract page confirms the title, the full author list and the June 2017 submission date.
- id: causal-masking-before-softmax
  claim: The same paper implements the auto-regressive constraint inside scaled dot-product attention
    by masking out — specifically, by setting to negative infinity — all values in the INPUT of the softmax
    that correspond to illegal connections, so that a position cannot attend to positions after it.
  where: lesson.py section 5 (why the mask goes before the softmax, not after it), the attention_forward
    docstring, common mistake 3, and self-check question 2.
  source_url: https://arxiv.org/abs/1706.03762
  source_title: Vaswani et al., Attention Is All You Need (arXiv:1706.03762), section 3.2.3
  source_kind: primary (the paper itself)
  quote: We implement this inside of scaled dot-product attention by masking out (setting to -inf) all
    values in the input of the softmax which correspond to illegal connections.
  accessed: 2026-09-16
  corroborating_url: https://ar5iv.labs.arxiv.org/html/1706.03762
  corroborating_note: Read from the rendered full text of section 3.2.3, which states that this preserves
    the auto-regressive property by preventing positions from attending to subsequent positions.
- id: adam-identity
  claim: 'Adam, the first-order optimiser used by this lesson''s training loop, is the algorithm introduced
    in "Adam: A Method for Stochastic Optimization" by Diederik P. Kingma and Jimmy Ba, submitted to arXiv
    in December 2014 and published at ICLR 2015. It maintains running estimates of the first and second
    moments of the gradient and applies a bias correction to each.'
  where: lesson.py section 11 (the optimiser is not the lesson), the adam_step docstring.
  source_url: https://arxiv.org/abs/1412.6980
  source_title: 'Kingma and Ba, Adam: A Method for Stochastic Optimization (arXiv:1412.6980)'
  source_kind: primary (the paper's arXiv record)
  quote: We introduce Adam, an algorithm for first-order gradient-based optimization of stochastic objective
    functions, based on adaptive estimates of lower-order moments.
  accessed: 2026-09-16
  note: 'DELIBERATELY NOT CLAIMED: the specific constants this lesson uses for beta1, beta2 and epsilon
    are NOT presented as the paper''s recommended defaults. At authoring time the sentence stating those
    defaults could not be read from a primary source (the ar5iv rendering returned only a navigation page
    and the PDF text could not be extracted), so the lesson names them as its own chosen hyperparameters
    and claims nothing about what the paper recommends. If that sentence is later verified, this note
    is where to record it.'
  corroborating_url: https://arxiv.org/abs/1412.6980
  corroborating_note: 'The ICLR 2015 half of this claim was confirmed independently at review on 2026-09-16
    from the arXiv record''s own comments field, which reads verbatim: "Published as a conference paper
    at the 3rd International Conference for Learning Representations, San Diego, 2015". The submission
    date on that record is 22 Dec 2014, consistent with "December 2014" above. The beta1/beta2/epsilon
    defaults remain deliberately unclaimed.'
- id: mlp-parameter-share
  claim: 'In a standard transformer block the position-wise feed-forward sub-layer holds roughly two thirds
    of the block''s parameters. "Attention Is All You Need" sizes its base model with d_model = 512 and
    inner feed-forward dimensionality d_ff = 2048, so the two feed-forward matrices carry 2 * d_model
    * d_ff = 2,097,152 weights against the four attention projections'' 4 * d_model^2 = 1,048,576 — exactly
    a 2:1 split, hence two thirds of 3,145,728. The word "roughly" is doing real work: the share moves
    with the d_ff/d_model ratio an implementation chooses, and biases and norms are excluded.'
  where: lesson.py section 17, the 'The MLP sub-layer' bullet.
  source_url: https://arxiv.org/abs/1706.03762
  source_title: Vaswani et al., Attention Is All You Need (arXiv:1706.03762), section 3.3 and Table 3
  source_kind: primary (the paper itself)
  quote: d_model = 512, d_ff = 2048
  accessed: 2026-09-16
  corroborating_url: https://ar5iv.labs.arxiv.org/html/1706.03762
  corroborating_note: Added at independent review on 2026-09-16. The bullet was previously the one sentence
    of prose in this lesson making a quantitative statement about models other than the one the student
    builds, and it carried no source. The arithmetic above is stated here rather than printed by the notebook
    because it describes an architecture this lesson does not build, so there is no cell that could compute
    it honestly.
