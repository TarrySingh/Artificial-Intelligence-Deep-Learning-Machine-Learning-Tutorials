- id: proxy-benchmark-llama-3-1-8b-on-one-h100
  claim: 'NVIDIA''s NIM LLMs benchmarking guide (version 1.0.0, Performance page) publishes, for Llama-3.1-8B-Instruct
    served by NIM container 1.8.0 on one H100 80GB GPU with FP8 weights (tensor parallelism 1) and requests
    of 200 input and 200 output tokens, the time to first token, the inter-token latency and the throughput
    at concurrencies 1, 5, 25, 50, 100, 150, 200 and 250; at concurrency 50 they are 67.41 ms, 5.91 ms
    and 8,018.23 tokens per second. The same page gives the same model on the same GPU with FP8 weights
    for 1000 input and 1000 output tokens, and with BF16 weights for 1000 and 1000 (its only 16-bit run
    of this model on the H100 in that container version). The snapshot transcribes those three tables,
    24 rows. The lesson uses them as a PROXY for its own small model, which none of the sources benchmarks,
    and derives the endpoint''s capacity, and the small model''s latency on it, from them as of 2026-10-03:
    the results are estimates under stated assumptions, not measurements of the small model. The same
    page''s FP8 table for 5000 input and 500 output tokens gives 2,765.71 output tokens a second at concurrency
    50, about 30,400 tokens a second in and out together, against about 16,000 for 200 and 200 at the
    same concurrency: the GPU gets through more tokens a second when more of them are input, which is
    why the lesson says that counting an input token as dear as an output token errs low.'
  where: assets/price_snapshot.json (serving_benchmark); assets/scenario.json (endpoint_capacity_requests_per_month);
    lesson.py section 4 (How many requests one endpoint carries), used by sections 6, 7 and 8, and the
    cell after the common mistakes (section 10)
  source_url: https://docs.nvidia.com/nim/benchmarking/llm/1.0.0/performance.html
  source_title: 'NVIDIA NIM LLMs Benchmarking: Performance'
  quote: 50 | 67.41 | 5.91 | 8018.23
  quote_context: 'the concurrency-50 row of the table under ''Llama-3.1-8b-instruct Results'', ''NIM Container:
    Llama-3.1-8b-Instruct'', ''Version: 1.8.0'', ''1 x H100 80G'', ''fp8 TP1'', ''200 Input Tokens / 200
    Output Tokens'', whose columns are ''Concurrency | TTFT (ms) | ITL (ms) | Throughput(Tokens/s)'';
    the next row reads ''100 | 119.97 | 7.57 | 12214.97''. The page opens ''This section shows the latency
    and throughput numbers for Llama models powered by NVIDIA NIM.'', its Hardware Specifications give
    the GPU as ''H100 80GB HBM3(GH100)'' in an NVIDIA DGX H100, and it reads ''Last updated on Apr 01,
    2026''. The FP8 table for ''1000 Input Tokens / 1000 Output Tokens'' follows under the same heading,
    and the BF16 one under ''bf16 TP1'', before ''1 x H200 141GB''; the FP8 table for ''5000 Input Tokens
    / 500 Output Tokens'' has the row ''50 | 817.73 | 16.47 | 2765.71''. The guide''s latest version,
    https://docs.nvidia.com/nim/benchmarking/llm/latest/, no longer lists a Performance page (its /latest/performance.html
    returned 404 on 2026-10-03); the versioned page above is live, and https://web.archive.org/web/20260915150912/https://docs.nvidia.com/nim/benchmarking/llm/1.0.0/performance.html
    holds the same rows.'
  accessed: 2026-10-03
- id: proxy-benchmark-metric-definitions
  claim: In that guide the throughput is the output tokens per second of all requests in flight together;
    the inter-token latency (ITL) is the average time between consecutive output tokens after the first,
    so that a request lasts its time to first token plus ITL times one less than its output tokens; the
    time to first token includes queueing and prefill and grows with the prompt; and a concurrency of
    N keeps N requests in flight. The lesson's estimate of one request's time, and its conversion of the
    throughput into requests a second, rest on these definitions.
  where: lesson.py section 4
  source_url: https://docs.nvidia.com/nim/benchmarking/llm/1.0.0/metrics.html
  source_title: 'NVIDIA NIM LLMs Benchmarking: Metrics'
  quote: Total TPS per system represents the total output tokens per seconds throughput, accounting for
    all the requests happening simultaneously.
  quote_context: the same page reads 'This is defined as the average time between consecutive tokens and
    is also known as time per output token (TPOT).', gives GenAI-Perf's ITL as (e2e_latency - TTFT) /
    (Total_output_tokens - 1) (typeset as a formula), adds 'The equation used for this metric does not
    include the first token (hence subtracts 1 in the denominator).', and says 'Time to first token generally
    includes both request queuing time, prefill time and network latency. The longer the prompt, the larger
    the TTFT.' https://docs.nvidia.com/nim/benchmarking/llm/1.0.0/parameters.html reads 'Concurrency N
    is the number of concurrent users each having one active request, or equivalently the number of requests
    concurrently being served by an LLM service.'
  accessed: 2026-10-03
- id: proxy-and-small-model-are-dense-and-of-similar-size
  claim: 'The benchmark''s model and the lesson''s small model are both dense (every parameter is used
    for every token) and of similar size and shape: Meta gives Llama 3.1 8B as 8B parameters with 32 layers
    of width 4,096, and Tinker''s table gives Qwen3.5-9B 9B parameters, all of them active, ''Dense'',
    while its card gives 32 layers of width 4,096. The lesson therefore scales the benchmark''s times
    up, and its rates down, by the ratio of the two sizes as their publishers state them. Qwen3.5-9B differs
    in that three of every four of its layers use linear attention (Gated DeltaNet); the estimate does
    not model that, nor the cost of serving a LoRA adapter.'
  where: assets/price_snapshot.json (serving_benchmark model_params and model_arch; tinker.models params
    and arch); lesson.py section 4
  source_url: https://tinker-docs.thinkingmachines.ai/tinker/models/models_and_pricing/
  source_title: 'Tinker documentation: Models & Pricing'
  quote: Architecture is either Dense (all parameters active per token) or MoE (mixture-of-experts, only
