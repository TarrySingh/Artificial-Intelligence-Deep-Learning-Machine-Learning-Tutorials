- id: tinker-per-token-serving-is-beta
  claim: Tinker's serverless inference, its per-token serving, is in beta, available for Inkling and Inkling-Small
    only, and not recommended for intensive production use, so it does not cover this lesson's small model.
    Tinker does price per-token sampling of the small model (prefill and sample prices in the table headed
    Training), through the sampling client of its training service, which generates from base or trained
    weights. The lesson does not treat that sampling as a production serving offer (an assumption, in
    line with Tinker's deployment guide, which serves a checkpoint outside Tinker after downloading it),
    so it does not price serving at Tinker's prices; it prints both statements among how the cited hosts
    serve a fine-tuned model.
  where: assets/price_snapshot.json (serving_a_fine_tune); lesson.py section 1
  source_url: https://tinker-docs.thinkingmachines.ai/tinker/models/models_and_pricing/
  source_title: 'Tinker documentation: Models & Pricing (Serverless Inference (Beta))'
  quote: Serverless inference is currently in beta and available for Inkling and Inkling-Small only. We
    do not recommend it for intensive production use until it is out of beta.
  quote_context: 'the Serverless Inference (Beta) table beneath it prices Inkling-Small and Inkling per
    million input and output tokens; https://tinker-docs.thinkingmachines.ai/tinker/serverless.json lists
    the same two models. The same page''s Pricing Terms read ''Sample : Generating output tokens'' and
    give the Tinker ID as ''The exact string to pass to create_lora_training_client(base_model=...) or
    create_sampling_client(base_model=...)''; https://tinker-docs.thinkingmachines.ai/tinker/api-reference/samplingclient/
    describes the sampling client as ''Client for text generation and inference from trained or base models.'''
  accessed: 2026-10-24
- id: tinker-trained-adapter-can-be-served-elsewhere
  claim: A model trained on Tinker is a LoRA adapter kept in Tinker's checkpoint storage, which can be
    downloaded and turned into an artifact another serving stack can load. The lesson trains the distilled
    small model on Tinker, keeps paying Tinker's storage price for its checkpoint, and serves it on a
    dedicated endpoint elsewhere.
  where: lesson.py section 1 and exercise 3
  source_url: https://tinker-docs.thinkingmachines.ai/cookbook/deployment/basics/
  source_title: 'Tinker cookbook: Deployment Basics'
  quote: Tinker trains LoRA adapters and keeps the resulting checkpoints in Tinker storage. To serve a
    checkpoint outside Tinker, download it and use tinker_cookbook.weights to turn it into an artifact
    your serving stack understands.
  accessed: 2026-10-03
