    USD per million output tokens, with a prompt-cache hit priced at 0.10 USD per million tokens. The
    snapshot transcribes those three numbers as the hosted large model's input, output and cache-read
    prices. All prices on the page are in USD.
  where: assets/price_snapshot.json (api_models); lesson.py section 1, exercise 2 (request_cost_usd)
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  source_title: 'Claude Platform Docs: Pricing'
  quote: $2 / MTok | $10 / MTok | $2.50 / MTok | $4 / MTok | $0.10 / MTok
  quote_context: the row for 'Claude Sonnet 5.5' in the Model pricing table; the columns are Input, Output,
    5m writes, 1h writes, Hits and refreshes
  accessed: 2026-10-24
- id: hosted-model-api-id
  claim: The hosted large model priced in the snapshot, Claude Sonnet 5.5, has the API model ID claude-sonnet-5-5.
    The scenario file names it by that ID so the snapshot and the scenario point at the same row.
  where: assets/scenario.json (prompt_model); assets/price_snapshot.json (api_models)
  source_url: https://platform.claude.com/docs/en/models/overview
  source_title: 'Claude Platform Docs: Models overview'
  quote: Claude API ID | claude-fable-5-1 | claude-opus-5-5 | claude-sonnet-5-5 | claude-haiku-4-5-20251001
