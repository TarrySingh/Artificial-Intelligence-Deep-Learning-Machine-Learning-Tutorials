  accessed: 2026-10-02
- id: cache-hit-is-a-fraction-of-input-price
  claim: A prompt-cache hit is billed at a fraction of the ordinary input price (5% on this model), so
    the lesson prices the cached share of a repeated instruction at the cache-read price and everything
    else at the ordinary input price.
  where: lesson.py exercise 2
  source_url: https://platform.claude.com/docs/en/about-claude/pricing
  source_title: 'Claude Platform Docs: Pricing'
  quote: Cache hits and refreshes on Claude Opus 5.5 and Claude Sonnet 5.5 are priced at 0.05x the base
