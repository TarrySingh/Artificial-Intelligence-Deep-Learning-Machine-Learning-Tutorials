    whose text contains no restriction on what the model's outputs are used for. The lesson names it as
    the example of a teacher's licence to read before training another model on the teacher's answers,
    and says that the terms of the service the teacher is called through must permit that too. It does
    not say what any licence or terms permit in the reader's own case, and it is not legal advice.
  where: lesson.py section 1 and the decision cell (section 7); assets/price_snapshot.json (open_models,
    licence)
