claims:
- id: reproducibility-not-guaranteed
  claim: PyTorch's documentation does not promise completely reproducible results across releases, individual
    commits or platforms. Section 11 says the lesson MEASURED that a resumed run equals the uninterrupted
    one on one machine, one build and one thread, and calls it a measurement, not a guarantee.
  where: lesson.py section 11 (what this lesson does not cover)
  source_url: https://docs.pytorch.org/docs/2.14/notes/randomness.html
  source_title: 'PyTorch 2.14 documentation, Notes: Reproducibility'
  quote: Completely reproducible results are not guaranteed across PyTorch releases, individual commits,
    or different platforms.
  quote_context: Reproducibility page, the opening paragraph
  accessed: 2026-10-18
- id: dataloader-generator-used-by-randomsampler
  claim: The generator argument of DataLoader is the random number generator that RandomSampler uses to
    draw the shuffle, and that is used to make base_seed for workers. Section 4 says the loader's randomness
    should be a generator the code owns.
  where: lesson.py section 4 and exercise 4
  source_url: https://docs.pytorch.org/docs/2.14/data.html
  source_title: 'PyTorch 2.14 documentation, torch.utils.data: DataLoader arguments'
  quote: If not None, this RNG will be used by RandomSampler to generate random indexes and multiprocessing
    to generate base_seed for workers.
  quote_context: The description of the generator parameter of torch.utils.data.DataLoader
  accessed: 2026-10-18
- id: dataloader-base-seed-consumes-generator
  claim: 'With workers, the base seed is drawn by the main process from its own RNG, which consumes RNG
    state, or from a specified generator. Section 4''s demo measures the same effect with no workers:
    creating the iterator draws from the loader''s generator.'
  where: lesson.py section 4 (the generator demo after exercise 4)
  source_url: https://docs.pytorch.org/docs/2.14/data.html
  source_title: 'PyTorch 2.14 documentation, torch.utils.data: Randomness in multi-process data loading'
  quote: base_seed is a long generated by main process using its RNG (thereby, consuming a RNG state mandatorily)
    or a specified generator
  quote_context: The numbered description of what happens when an iterator over a DataLoader is created,
    item about base_seed
  accessed: 2026-10-18
- id: spawn-default-on-windows-and-macos
  claim: On Windows and macOS the default multiprocessing start method is spawn(). Section 4 gives it
    as the reason the lesson loads data in the main process (a worker is a separate process) and the checks
    reject a loader with workers before iterating it. No exact failure message is claimed.
  where: lesson.py section 4 and exercise 4
  source_url: https://docs.pytorch.org/docs/2.14/data.html
  source_title: 'PyTorch 2.14 documentation, torch.utils.data: Platform-specific behaviors'
  quote: On Windows and MacOS, spawn() is the default multiprocessing start method.
  quote_context: Platform-specific behaviors, first sentence of the multiprocessing discussion
  accessed: 2026-10-18
- id: torch-load-weights-only
  claim: torch.load with weights_only=True restricts the unpickler to tensors, primitive types, dictionaries
    and types registered with add_safe_globals. Section 6 and self-check question 4 rest on it, and the
    lesson's checkpoint holds only those types.
  where: lesson.py section 6, exercise 7 and self-check question 4
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.load.html
  source_title: 'PyTorch 2.14 documentation, torch.load: the weights_only parameter'
  quote: Indicates whether unpickler should be restricted to loading only tensors, primitive types, dictionaries
    and any types added via torch.serialization.add_safe_globals().
  quote_context: The description of the weights_only parameter of torch.load
  accessed: 2026-10-18
- id: weights-only-default-since-2-6
  claim: From version 2.6 torch.load uses weights_only=True when no pickle module is passed. Section 6
    says so, with that condition, as the reason the lesson writes weights_only=True out explicitly instead
    of relying on the default.
  where: lesson.py section 6
  source_url: https://docs.pytorch.org/docs/2.14/notes/serialization.html
  source_title: 'PyTorch 2.14 documentation, Notes: Serialization semantics'
  quote: Starting in version 2.6, torch.load will use weights_only=True if the pickle_module argument
    is not passed.
  quote_context: Serialization semantics, the section on torch.load with weights_only=True
  accessed: 2026-10-18
- id: accelerator-package
  claim: torch.accelerator is the PyTorch package for the current accelerator. Section 2 introduces it
    that way and gives CUDA, MPS and XPU only as examples of an accelerator; the page gives no list of
    devices, so the lesson lists none as covered.
  where: lesson.py section 2
  source_url: https://docs.pytorch.org/docs/2.14/accelerator.html
  source_title: 'PyTorch 2.14 documentation: torch.accelerator'
  quote: This package introduces support for the current accelerator in python.
  quote_context: The first sentence of the torch.accelerator page
  accessed: 2026-10-18
- id: current-accelerator-compile-time
  claim: 'current_accelerator() returns the device of the accelerator available at compilation time. Section
    2 and exercise 2 build on it: a build compiled for an accelerator on a machine without one still names
    the accelerator.'
  where: lesson.py section 2 and exercise 2
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.accelerator.current_accelerator.html
  source_title: PyTorch 2.14 documentation, torch.accelerator.current_accelerator
  quote: Return the device of the accelerator available at compilation time.
  quote_context: The summary line of torch.accelerator.current_accelerator
  accessed: 2026-10-18
- id: current-accelerator-check-available
  claim: With check_available=True current_accelerator() also checks, at run time, that the accelerator
    is available, on top of the compile-time check; the default is False. Exercise 2 accepts this as one
    correct way to pick a device.
  where: lesson.py exercise 2
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.accelerator.current_accelerator.html
  source_title: 'PyTorch 2.14 documentation, torch.accelerator.current_accelerator: the check_available
    parameter'
  quote: 'if True, will also do a runtime check to see if the device torch.accelerator.is_available()
    on top of the compile-time check. Default: False'
  quote_context: The description of the check_available parameter
  accessed: 2026-10-18
- id: accelerator-is-available
  claim: 'torch.accelerator.is_available() reports whether the current accelerator is available at run
    time: it was built, its drivers are available and at least one device is visible. Exercise 2 accepts
    it as the other correct way to pick a device.'
  where: lesson.py exercise 2
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.accelerator.is_available.html
  source_title: PyTorch 2.14 documentation, torch.accelerator.is_available
  quote: 'Check if the current accelerator is available at runtime: it was built, all the required drivers
    are available and at least one device is visible.'
  quote_context: The summary line of torch.accelerator.is_available
  accessed: 2026-10-18
- id: optimizer-state-dict-holds-state-not-parameters
  claim: An optimiser's state_dict holds the current optimisation state, saved per parameter, and the
    parameter itself is not saved. Section 6 says the checkpoint must therefore hold the optimiser's state
    separately from the model's weights.
  where: lesson.py section 6 and exercise 6
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.optim.Optimizer.state_dict.html
  source_title: PyTorch 2.14 documentation, torch.optim.Optimizer.state_dict
  quote: a Dict holding current optimization state.
  quote_context: The first of the two entries of the returned dict, 'state'; the same paragraph says 'the
    parameter itself is NOT saved'
  accessed: 2026-10-18
- id: optimizer-state-dict-parameter-not-saved
  claim: In an optimiser's state_dict the state is saved per parameter and the parameter itself is not
    saved.
  where: lesson.py section 6
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.optim.Optimizer.state_dict.html
  source_title: PyTorch 2.14 documentation, torch.optim.Optimizer.state_dict
  quote: the parameter itself is NOT saved
  quote_context: 'Same paragraph as the ''state'' entry: ''state is saved per parameter, and the parameter
    itself is NOT saved'''
  accessed: 2026-10-18
- id: persistent-and-non-persistent-buffers
  claim: The only difference between a persistent and a non-persistent buffer is that the latter is not
    part of the module's state_dict. Section 3 and exercise 3 (a persistent buffer scale, a non-persistent
    buffer shift) rest on it.
  where: lesson.py section 3 and exercise 3
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.Module.html
  source_title: PyTorch 2.14 documentation, torch.nn.Module.register_buffer
  quote: The only difference between a persistent buffer and a non-persistent buffer is that the latter
    will not be a part of this module’s state_dict.
  quote_context: register_buffer, description
  accessed: 2026-10-18
- id: module-to-modifies-in-place
  claim: Module.to modifies the module in place. Section 1, section 3 and self-check question 3 say a
    module moved with .to is the same object, converted.
  where: lesson.py sections 1 and 3, self-check question 3
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.Module.html
  source_title: PyTorch 2.14 documentation, torch.nn.Module.to
  quote: This method modifies the module in-place.
  quote_context: A note under the description of Module.to (the same note appears under several of Module's
    conversion methods; read in the to section)
  accessed: 2026-10-18
- id: module-to-returns-self
  claim: Module.to returns self. Read separately from the previous claim because the page puts a Parameters
    block between the note and the Returns line.
  where: lesson.py sections 1 and 3, self-check question 3
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.Module.html
  source_title: 'PyTorch 2.14 documentation, torch.nn.Module.to: the Returns block'
  quote: 'Returns: self'
  quote_context: 'The Returns block of Module.to, after its Parameters block (page text shows ''Returns
    : self'')'
  accessed: 2026-10-18
- id: tensor-to-returns-self-when-nothing-changes
  claim: Tensor.to returns the tensor itself when it already has the requested dtype and device, and otherwise
    a copy. Section 1 and self-check question 3 contrast it with Module.to.
  where: lesson.py sections 1 and 3, self-check question 3
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.Tensor.to.html
  source_title: PyTorch 2.14 documentation, torch.Tensor.to
  quote: If the self Tensor already has the correct torch.dtype and torch.device, then self is returned.
  quote_context: A note in the description of Tensor.to
  accessed: 2026-10-18
- id: load-state-dict-assign-optimizer-after
  claim: When load_state_dict is called with assign=True the optimiser must be created after the call,
    unless get_swap_module_params_on_conversion() is True. Exercise 6 states it, and section 8 measures
    what happens when the optimiser is built first.
  where: lesson.py exercise 6 and section 8
  source_url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.Module.html
  source_title: PyTorch 2.14 documentation, torch.nn.Module.load_state_dict
  quote: If assign is True the optimizer must be created after the call to load_state_dict unless get_swap_module_params_on_conversion()
    is True.
  quote_context: A warning under the description of Module.load_state_dict
  accessed: 2026-10-18
- id: pytorch-wheel-platforms
  claim: The release this lesson pins has, for macOS, only a wheel built for macOS 14 or later on Apple
    silicon (macosx_14_0_arm64), for Python 3.11 and 3.12 alike. The Before-you-start box therefore says
    the lesson's install line does not serve Intel Macs or older macOS.
  where: meta.yaml before_you_start (assumed skills)
  source_url: https://pypi.org/pypi/torch/2.14.1/json
  source_title: PyPI JSON metadata of torch 2.14.1, the list of release files
  quote: torch-2.14.1-cp312-cp312-macosx_14_0_arm64.whl
  quote_context: The filename of the macOS wheel for Python 3.12 among the release files (the cp311 file
    is torch-2.14.1-cp311-cp311-macosx_14_0_arm64.whl; for Python 3.11 and 3.12 no other macOS wheel is
    listed)
  accessed: 2026-10-18
