id: T10-L01-ai-act-conformity-pack
title: Turn an AI system registry into a machine-checkable EU AI Act conformity evidence pack
track: T10
flagship: F09           # flagship id this lesson feeds, or empty
tier: cpu8              # phone | browser | cpu8 | free-gpu | gpu24 | gpu80 | multi-gpu | api
budget_seconds: 60
language: python        # python | c | cpp
prerequisites: []       # first lesson of the track; assumes only Python dicts, lists and datetime.date
objectives:
  - "Implement classify() so a described system maps to a risk tier, a cumulative obligation set, and the date each obligation starts to bind"
  - "Implement missing_evidence() so an item counts only when it is present, actually referenced, in date and not overdue for review"
  - "Generate a conformity report over a registry and read its blocking list, overdue count and next deadline off computed output"
  - "Explain why deferring the Annex III high-risk duties to 2 December 2027 defers neither Article 5, nor Article 4, nor Article 50"
  - "Justify which date binds a system that is both an Annex III use case and a safety component of a product regulated under Annex I"
datasets:
  - name: "systems.yaml — fictional AI system registry authored for this lesson"
    licence: "CC0-1.0"
    url: "none — authored in this repository, ships at assets/systems.yaml"
    origin: authored-for-this-lesson
    cached_at: "assets/systems.yaml"
    gated: false
    downloads: none
    notes: >-
      Not a third-party dataset. Every system, document reference and date in it is invented
      for this lesson; it describes no real product, company or audit. It ships in the
      lesson's assets/ directory and is read from disk, so the lesson runs with no network at
      all. The legal texts the rulebook encodes are not data files: they are cited in
      claims.yaml with their EUR-Lex and European Commission URLs and access dates.
points: 30
status: reviewed        # draft | executed | reviewed | shipped
reviewed_by: >-
  Independent review 2026-09-16. All four gates re-run from a clean checkout; the rubric was
  mutation-tested against 21 plausible wrong implementations. Three rubric holes found and
  closed (next_deadline ignoring the incomplete filter, blocking dropping the prohibited
  clause, and a row-order test whose fixture ids were alphabetical so sorting passed). Every
  sourced date re-verified against the European Commission's own pages. The EUR-Lex HTML,
  ELI and OJ views for CELEX 32026R1744 all returned HTTP 202 with an empty body on this
  date, so the two deferral claims no longer carry a verbatim EUR-Lex quote; see claims.yaml.
  Open for the owner: the flagship id on line 4. F09 appears nowhere else in this repo, and
  the repo uses two conventions — a bare id (F13, F02) and a slug (F15-humanoid-lab).
measured_seconds: 0.1
measured_peak_mib: 22
