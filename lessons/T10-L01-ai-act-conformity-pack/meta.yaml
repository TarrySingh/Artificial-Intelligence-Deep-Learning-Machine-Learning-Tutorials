id: T10-L01-ai-act-conformity-pack
title: Turn an AI system registry into a machine-checkable EU AI Act conformity evidence pack
track: T10
flagship: F09
tier: cpu8
budget_seconds: 60
language: python
prerequisites: []
objectives:
- Implement classify() so a described system maps to a risk tier, a cumulative obligation set, and the
  date each obligation starts to bind
- Implement missing_evidence() so an item counts only when it is present, actually referenced, in date
  and not overdue for review
- Generate a conformity report over a registry and read its blocking list, overdue count and next deadline
  off computed output
- Explain why deferring the Annex III high-risk duties to 2 December 2027 defers neither Article 5, nor
  Article 4, nor Article 50
- Justify which date binds a system that is both an Annex III use case and a safety component of a product
  regulated under Annex I
