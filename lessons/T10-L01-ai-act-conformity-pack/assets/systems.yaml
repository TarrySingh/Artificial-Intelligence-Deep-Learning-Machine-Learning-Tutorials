# A fictional organisation's AI system registry — the input side of a conformity pack.
#
# Every system, every document reference and every person implied here is invented for this
# lesson. Nothing in this file describes a real product, a real company or a real audit.
# The SHAPE is what matters: this is the level of detail a conformity pack actually needs
# before anyone can say whether a system is ready.
#
# Field reference (see lesson.py section 2):
#   id                             short stable key
#   name                           what the system does, in one line
#   role                           this organisation's role for this system: provider | deployer
#   prohibited_practice            a tag naming an Article 5 practice, or null
#   annex_iii_area                 an Annex III use-case area, or null
#   embedded_in_regulated_product  true when the AI is a safety component of a product already
#                                  covered by EU product-safety law (the Annex I route)
#   product_legislation            which product legislation, when embedded; else null
#   is_gpai_model                  true for a general-purpose AI model placed on the market
#   interacts_with_humans          true when a person converses with it directly
#   generates_synthetic_content    true when it emits synthetic audio, image, video or text
#   placed_on_market               ISO date the system was first placed on the market or put
#                                  into service (drives the Article 50(2) transitional rule)
#   evidence                       item id -> {status, document, date, review_due}
#                                    status     present | planned | missing
#                                    document   the reference a reviewer would ask for
#                                    date       ISO date the document was issued
#                                    review_due ISO date it must next be reviewed (optional)

