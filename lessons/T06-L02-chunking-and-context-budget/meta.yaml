id: T06-L02-chunking-and-context-budget
title: Chunking and the context budget — measure evidence coverage, not chunk hits
summary: Chunk documents and assemble context under a token budget, measured by whether the evidence an
  answer needs actually reaches the model.
track: T06
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- T06-L01-retrieval-from-scratch
objectives:
- Implement fixed-size chunking with a token-overlap window and structure-aware chunking that groups paragraphs
  under a token budget with a heading-merge rule and an over-budget fallback
- Implement an approximate, documented token-budget counter and measure how far it drifts from a real
  subword tokenizer trained, offline, on this lesson's own corpus
- Implement greedy, budget-constrained context assembly that skips instead of stopping on an oversized
  candidate and de-duplicates overlapping chunks before spending budget on them
- Implement evidence coverage — whether a query's gold evidence span is fully contained in the assembled
  context — and distinguish it from a chunk-level retrieval hit
- Measure, on a corpus with planted evidence spans of varying length, how chunk size and overlap trade
  evidence coverage against token cost, and choose a chunking policy from the measured curve
before_you_start:
  assumed:
  - tokenise text with a Python regular expression, and slice a string by character offsets, reading a
    span as a half-open [start, end) interval
  - say what a token and a context window are, and why a prompt that exceeds the window loses text
  - read a cost-versus-quality curve (here, tokens spent against evidence reached) and pick an operating
    point from it
  resources:
  - title: Regular Expression HOWTO
    by: Python documentation
    url: https://docs.python.org/3/howto/regex.html
    kind: free
    why: finditer and match spans (start, end), plus word boundaries and character classes, which the
      carried-forward tokenizer relies on
  - title: Byte-Pair Encoding tokenization (Hugging Face LLM Course, chapter 6)
    by: Hugging Face
    url: https://huggingface.co/learn/llm-course/chapter6/5
    kind: free
    why: how a subword vocabulary is trained and applied, which is what you need to read exercise 3's
      comparison of an approximate token counter against a real BPE tokenizer
  - title: 'Speech and Language Processing (3rd ed. draft), chapter 11: Information Retrieval and Retrieval-Augmented
      Generation'
    by: Dan Jurafsky and James H. Martin (Stanford; free draft)
    url: https://web.stanford.edu/~jurafsky/slp3/11.pdf
    kind: free
    why: 11.3 on splitting documents into fixed-length passages before retrieval, and 11.4 on what the
      retrieved text is used for in retrieval-augmented generation
  - title: Glossary (context window, tokens, RAG)
    by: Anthropic (Claude documentation)
    url: https://platform.claude.com/docs/en/about-claude/glossary
    kind: free
    why: short definitions of the context window, tokens and retrieval-augmented generation, the three
      terms the token budget and coverage metric are built on
datasets:
- name: T06-L02 synthetic incident-report corpus (eight planted facts, varying evidence-span length)
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
points: 144
status: reviewed
measured_seconds: 0.2
measured_peak_mib: 43
