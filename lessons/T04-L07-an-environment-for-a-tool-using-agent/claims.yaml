claims:
- id: openenv-framework-gymnasium-style
  claim: OpenEnv, the environment hub whose conventions the lesson follows, describes itself as a framework
    for isolated execution environments for agentic reinforcement learning with a Gymnasium-style API
    (reset, step and state). The lesson does not import it; it follows these conventions in plain Python.
  where: lesson.py sections 1 and 5; OPENENV_REVISION and OPENENV_DATE in the setup cell
  source_url: https://raw.githubusercontent.com/openenv/OpenEnv/main/README.md
  source_title: OpenEnv README (github.com/openenv/OpenEnv, main branch)
  quote: An end-to-end framework for creating, deploying and using isolated execution environments for
    agentic RL, with a simple Gymnasium-style API.
  quote_context: First paragraph under the title; re-read at github.com/openenv/OpenEnv (the repository
    moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-release-v0-9-0
  claim: As of 2026-10-20 the latest release of OpenEnv on GitHub is v0.9.0, published on 2026-10-15 (the
    tag URL pins the release; the lesson does not claim it stays the latest). The lesson names this revision
    because the interface was still changing; a later release may differ.
  where: lesson.py setup cell (OPENENV_REVISION, OPENENV_DATE) and section 1
  source_url: https://api.github.com/repos/openenv/OpenEnv/releases/tags/v0.9.0
  source_title: 'GitHub releases API, openenv/OpenEnv, release v0.9.0 (html page: https://github.com/openenv/OpenEnv/releases/tag/v0.9.0)'
  quote: '"published_at": "2026-10-15T06:24:33Z"'
  quote_context: The published_at field of the release whose tag_name is v0.9.0; re-read at github.com/openenv/OpenEnv
    (the repository moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-environment-base-class
  claim: In OpenEnv v0.9.0 the base class of an environment follows the Gym/Gymnasium API, with abstract
    reset, step and state members. reset returns the initial observation; step takes an action and returns
    an observation. This is the shape of the ToolEnv class in exercise 3.
  where: lesson.py section 1 and exercise 3 (ToolEnv.reset, ToolEnv.step, ToolEnv.state)
  source_url: https://github.com/openenv/OpenEnv/blob/v0.9.0/src/openenv/core/env_server/interfaces.py
  source_title: OpenEnv v0.9.0, src/openenv/core/env_server/interfaces.py, class Environment
  quote: Base class for all environment servers following Gym/Gymnasium API.
  quote_context: The first line of the docstring of class Environment; re-read at github.com/openenv/OpenEnv
    (the repository moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-reset-returns-observation
  claim: In OpenEnv v0.9.0, reset returns the initial observation (and takes an optional seed and episode
    id, which is why ToolEnv.reset accepts them).
  where: lesson.py exercise 3 (ToolEnv.reset)
  source_url: https://github.com/openenv/OpenEnv/blob/v0.9.0/src/openenv/core/env_server/interfaces.py
  source_title: OpenEnv v0.9.0, src/openenv/core/env_server/interfaces.py, Environment.reset
  quote: Reset the environment and return initial observation.
  quote_context: The docstring of Environment.reset; re-read at github.com/openenv/OpenEnv (the repository
    moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-observation-done-reward
  claim: In OpenEnv v0.9.0 the observation itself carries the episode's done flag and the reward of the
    last action (and a metadata dictionary), where Gymnasium returns them as separate tuple members. The
    lesson's Observation has the same three fields.
  where: lesson.py section 1 and exercise 3 (class Observation)
  source_url: https://github.com/openenv/OpenEnv/blob/v0.9.0/src/openenv/core/env_server/types.py
  source_title: OpenEnv v0.9.0, src/openenv/core/env_server/types.py, class Observation
  quote: Reward signal from the last action
  quote_context: The description of the reward field of class Observation; the done and metadata fields
    are quoted in the two entries below; re-read at github.com/openenv/OpenEnv (the repository moved from
    huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-observation-done
  claim: In OpenEnv v0.9.0 the observation carries a done flag that says the episode has terminated.
  where: lesson.py section 1 and exercise 3 (class Observation)
  source_url: https://github.com/openenv/OpenEnv/blob/v0.9.0/src/openenv/core/env_server/types.py
  source_title: OpenEnv v0.9.0, src/openenv/core/env_server/types.py, class Observation
  quote: Whether the episode has terminated
  quote_context: The description of the done field of class Observation; re-read at github.com/openenv/OpenEnv
    (the repository moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-observation-metadata
  claim: In OpenEnv v0.9.0 the observation carries a metadata dictionary for additional information, which
    the lesson uses for the event and the truncated flag.
  where: lesson.py section 1 and exercise 3 (class Observation)
  source_url: https://github.com/openenv/OpenEnv/blob/v0.9.0/src/openenv/core/env_server/types.py
  source_title: OpenEnv v0.9.0, src/openenv/core/env_server/types.py, class Observation
  quote: Additional metadata for the observation
  quote_context: The description of the metadata field of class Observation; re-read at github.com/openenv/OpenEnv
    (the repository moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: openenv-trainer-runs-loop-env-supplies-reward
  claim: 'In the OpenEnv integration style for environments used as tools, the trainer runs the multi-turn
    tool loop while the environment supplies the tools and the reward. That is the division of labour
    the lesson builds: run_episode and the update are the trainer; ToolEnv is the environment.'
  where: lesson.py section 1
  source_url: https://raw.githubusercontent.com/openenv/OpenEnv/main/README.md
  source_title: OpenEnv README, bullet 'Environments as tools (white-box)'
  quote: The trainer runs the multi-turn tool loop and the environment supplies the tools and the reward.
  quote_context: The bullet that begins 'Environments as tools (white-box)'; re-read at github.com/openenv/OpenEnv
    (the repository moved from huggingface/OpenEnv, which redirects) on 2026-11-08
  accessed: 2026-10-20
- id: gymnasium-truncated
  claim: 'Gymnasium separates the two ways an episode can end: terminated (the task''s own end) and truncated
    (a condition outside the task, typically a time limit). The lesson''s observation keeps the two apart
    (a submit ends the task; the step cap truncates).'
  where: lesson.py section 1, exercise 3 and the self-check
  source_url: https://gymnasium.farama.org/api/env/
  source_title: 'Gymnasium documentation, Env.step: truncated'
  quote: Whether the truncation condition outside the scope of the MDP is satisfied.
  quote_context: The description of the truncated return value of Env.step
  accessed: 2026-10-20
- id: gymnasium-terminated-truncated-split
  claim: Gymnasium 0.26 replaced a single done flag by terminated and truncated to make clear which of
    the two ended an episode, which matters for bootstrapping. This is why the lesson reports them apart.
  where: lesson.py section 1 and the self-check
  source_url: https://gymnasium.farama.org/api/env/
  source_title: 'Gymnasium documentation, Env.step: changed in version 0.26'
  quote: The Step API was changed removing done in favor of terminated and truncated to make it clearer
    to users when the environment had terminated or truncated which is critical for reinforcement learning
    bootstrapping algorithms.
  quote_context: The 'Changed in version 0.26' note under Env.step
  accessed: 2026-10-20
- id: grpo-no-critic
  claim: 'Group Relative Policy Optimisation (GRPO), introduced in DeepSeekMath, estimates its baseline
    from the scores of a group of sampled outputs for the same question instead of a learned critic. This
    is the structure of the lesson''s training loop: a group of episodes per task, the group itself as
    the baseline.'
  where: lesson.py section 1 and exercises 6 to 9
  source_url: https://arxiv.org/html/2402.03300
  source_title: 'DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models (Shao
    et al., 2024), as rendered on arXiv (HTML)'
  quote: GRPO foregoes the critic model, instead estimating the baseline from group scores, significantly
    reducing training resources compared to Proximal Policy Optimization (PPO).
  quote_context: Introduction, the paragraph describing the reinforcement learning contribution
  accessed: 2026-10-20
- id: grpo-advantage-normalisation
  claim: In GRPO with outcome supervision, a group's rewards are normalised by subtracting the group average
    and dividing by the group standard deviation, and the result is the advantage of every token of the
    completion. Exercise 6 implements this with the lesson's own epsilon added to the standard deviation
    and the population standard deviation (the source does not say which estimator; the lesson fixes ddof=0
    and says so).
  where: lesson.py exercise 6 (group_advantages)
  source_url: https://arxiv.org/html/2402.03300
  source_title: DeepSeekMath (Shao et al., 2024), section 4.1.2 Outcome Supervision RL with GRPO
  quote: Subsequently, these rewards are normalized by subtracting the group average and dividing by the
    group standard deviation.
  quote_context: Section 4.1.2, first paragraph
  accessed: 2026-10-20
- id: reward-hacking-wrong-objective
  claim: '"Reward hacking" is a named problem in the AI-safety literature that arises from having the
    wrong objective function: the agent optimises the specified reward in a way its designer did not intend.
    The lesson''s calls-mode loop is a deliberately planted small instance of it, not a claim about any
    real system.'
  where: lesson.py sections 13, 16, 17 and the self-check
  source_url: https://arxiv.org/abs/1606.06565
  source_title: Concrete Problems in AI Safety (Amodei, Olah, Steinhardt, Christiano, Schulman, Mane,
    2016), abstract
  quote: having the wrong objective function ("avoiding side effects" and "avoiding reward hacking")
  quote_context: The abstract's classification of the five research problems
  accessed: 2026-10-20
