id: T00-L02-model-registry
title: Build a role-based model registry, a retirement detector and a golden test that survives a model
  swap
short_title: A model registry that survives a swap
summary: Build a role-based model registry, a retirement detector run against a dated snapshot of a provider's
  model pages, and a golden test that survives a model swap.
track: T00
flagship: ''
tier: cpu8
budget_seconds: 30
language: python
prerequisites:
- T00-L01-the-8gb-track
objectives:
- Implement resolve() so a role follows same_as links to one pinned model id and rejects an unknown role
  and a cycle
- Implement lifecycle_findings() and drift_findings() so a registry is diffed against a dated provider
  snapshot for retired, missing, renamed, soon-to-retire, repriced and resized pins
- Implement a golden-output regression test that compares a normalised contract, and measure how many
  cases survive swapping the model behind a role
- Measure, on the committed snapshot, how many pinned roles in a stale registry already carry a finding
before_you_start:
  assumed:
  - write Python functions that loop over dicts and lists of dicts, and return a NamedTuple
  - read a nested YAML or JSON file and say which keys and values it holds
  - parse an ISO date and add, subtract and compare days with the datetime module
  - write a plain assert-based test for a function
  resources:
  - title: 'The Python Tutorial, section 5: Data Structures'
    by: Python Software Foundation
    url: https://docs.python.org/3/tutorial/datastructures.html
    kind: free
    why: dictionaries (5.5) and tuples (5.3) and how to loop over them, which is all that resolve() and
      the two checkers do
  - title: PyYAML documentation
    by: PyYAML project
    url: https://pyyaml.org/wiki/PyYAMLDocumentation
    kind: free
    why: the Tutorial section on loading a YAML document into Python dicts and lists, which is how models.yaml
      becomes the registry
  - title: 'datetime: Basic date and time types'
    by: Python Software Foundation
    url: https://docs.python.org/3/library/datetime.html
    kind: free
    why: date, timedelta and date.fromisoformat, the pieces behind the notice-window arithmetic in the
      retirement detector
  - title: 'Software Engineering at Google, chapter 12: Unit Testing'
    by: Winters, Manshreck and Wright (O'Reilly; free to read at abseil.io)
    url: https://abseil.io/resources/swe-book/html/ch12.html
    kind: free
    why: 'the sections on preventing brittle tests, testing via public APIs, and testing behaviours rather
      than methods: the reason the golden test compares a contract'
  - title: Model deprecations (Claude Platform docs)
    by: Anthropic
    url: https://platform.claude.com/docs/en/about-claude/model-deprecations
    kind: free
    why: a real retirement table, with states, tentative retirement dates and replacements, which is what
      the provider snapshot in this lesson mirrors
