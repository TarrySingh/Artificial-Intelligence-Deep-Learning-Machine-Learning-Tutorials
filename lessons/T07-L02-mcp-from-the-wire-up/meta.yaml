id: T07-L02-mcp-from-the-wire-up
title: The Model Context Protocol, from the wire up
summary: Build a Model Context Protocol server and client from the specification, checked by a conformance
  harness built from the same specification.
track: T07
flagship: ''
tier: cpu8
budget_seconds: 120
language: python
prerequisites:
- T00-L01-the-8gb-track
- T07-L01-agent-loop-from-scratch
objectives:
- Implement JSON-RPC 2.0 message framing for the stdio transport (single-line UTF-8 JSON, one newline-delimited
  message per line) as the specification defines it, in both directions, with a typed error for a line
  that is not JSON
- Implement the initialize handshake's protocol-version negotiation on both sides, including the case
  where the client's requested version is unsupported and the server answers, as its MUST rule requires,
  with a version it does support inside a successful result
- 'Implement ping, tools/list and tools/call over T07-L01''s own tool registry, distinguishing a JSON-RPC
  protocol error (an unknown tool, a malformed request) from a tool execution error reported inside a
  successful result with isError: true'
- Implement the client's request/response call with id matching enforced on every call, and use it to
  perform the handshake and walk T07-L01's chain task to completion over a real local server subprocess
- 'Verify, with a given data-driven conformance harness, that the server handles seven required wire behaviours
  — malformed JSON, an unknown method, an unsupported protocol version, a tools/call without a name, a
  notification that must get no response, an explicit id: null, and ping — both in-process and over the
  subprocess''s real stdin/stdout'
before_you_start:
  assumed:
  - start a child process from Python with subprocess and exchange text lines through its stdin and stdout
  - parse a line with json.loads and tell invalid JSON apart from valid JSON that has the wrong shape
  - read a specification that uses MUST, SHOULD and MAY, and say which statements a conforming program
    cannot skip
  resources:
  - title: JSON-RPC 2.0 Specification
    by: JSON-RPC Working Group
    url: https://www.jsonrpc.org/specification
    kind: free
    why: 'the whole page (it is short): request, notification, response and error objects and the reserved
      error codes that exercises 1 to 3 and 7 implement'
  - title: 'MCP specification 2025-11-25: Lifecycle'
    by: Model Context Protocol project
    url: https://modelcontextprotocol.io/specification/2025-11-25/basic/lifecycle
    kind: free
    why: initialization and version negotiation, the MUST rules behind exercises 4 and 5
  - title: 'MCP specification 2025-11-25: Tools'
    by: Model Context Protocol project
    url: https://modelcontextprotocol.io/specification/2025-11-25/server/tools
    kind: free
    why: tools/list, tools/call, and the split between protocol errors and tool results flagged isError,
      which exercise 6 dispatches on
  - title: 'MCP specification 2025-11-25: Transports'
    by: Model Context Protocol project
    url: https://modelcontextprotocol.io/specification/2025-11-25/basic/transports
    kind: free
    why: 'the stdio section only: newline-delimited UTF-8 messages, no embedded newlines, nothing but
      messages on stdout (exercises 1, 2 and section 12)'
  - title: 'subprocess: Subprocess management'
    by: Python documentation
    url: https://docs.python.org/3/library/subprocess.html
    kind: free
    why: Popen with PIPE, communicate and the deadlock warning, for the real-subprocess proof in section
      12
datasets:
- name: T07-L02 demo chain task (reuses T07-L01's synthetic lookup-chain generator, one fixed seed)
  kind: synthetic
  licence: not applicable - generated at run time by the lesson itself
points: 348
status: reviewed
measured_seconds: 0.3
measured_peak_mib: 33
guard_allow:
- _serve_stdio
